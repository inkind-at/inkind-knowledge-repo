        tag: completeness_minimal
        value: subcategory, assessment_result
      completeness_standard:
        tag: completeness_standard
        value: subcategory, material, assessment_result, usage
      completeness_detailed:
        tag: completeness_detailed
        value: subcategory, material, assessment_result, dimensions, style, usage
      coicop_division:
        tag: coicop_division
        value: '05.1'
    description: "Shared physical-item dispatch target for Furniture \u2014 used identically\
      \ by DonationItem, StorageCollection, and SortedCollection. Adds assessment_result\
      \ and its UC rules on top of FurnitureCategory. Never used by DemandSignal."
    from_schema: https://inkind-at.github.io/inkind-knowledge-repo/categories/furniture
    is_a: FurnitureCategory
    mixin: true
    mixins:
    - FurnitureContextRulesMixin
    slots:
    - FurnitureCategory_subcategory
    - FurnitureCategory_material
    - dimensions
    - style
    - FurnitureAssessmentMixin_assessment_result
    slot_usage:
      assessment_result:
        name: assessment_result
        description: Structural and quality assessment. Required regardless of usage.
        range: FurnitureAssessmentEnum
        required: false
    class_uri: inkind_knowledge_repo:FurnitureAssessmentMixin
    rules:
    - preconditions:
        slot_conditions:
          assessment_result:
            name: assessment_result
            equals_string: structurally_compromised
      postconditions:
        slot_conditions:
          lifecycle_state:
            name: lifecycle_state
            none_of:
            - equals_string: stored
            - equals_string: distributed
      description: 'Items assessed as structurally_compromised must not be redistributed.
        Applies to both new items (manufacturing defect) and used items. action: block,
        suggest: disposal or repair referral.'
      title: uc-furniture-compromised-block
    - preconditions:
        slot_conditions:
          assessment_result:
            name: assessment_result
            equals_string: functional_with_repairs
      postconditions:
        slot_conditions:
          sorting_notes:
            name: sorting_notes
            required: true
      description: "Items assessed as functional_with_repairs require sorter confirmation.\
        \ action: warn \u2014 sorting_notes required."
      title: uc-furniture-repairable-warn
    - preconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            any_of:
            - equals_string: seating
            - equals_string: beds
          assessment_result:
            name: assessment_result
            equals_string: significant_cosmetic_damage
      postconditions:
        slot_conditions:
          sorting_notes:
            name: sorting_notes
            required: true
