          aliases_de:
            tag: aliases_de
            value: '[''Metall'', ''Gold'', ''Silber'', ''Edelstahl'', ''Legierung'']'
        see_also:
        - schema:material
      plastic:
        text: plastic
        description: "Plastic or acrylic. Common for sunglasses frames, costume jewellery,\
