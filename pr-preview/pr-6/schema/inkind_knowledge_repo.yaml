    rules:
    - preconditions:
        slot_conditions:
          lifecycle_state:
            name: lifecycle_state
            equals_string: sorted
      postconditions:
        slot_conditions:
          condition_grade:
            name: condition_grade
            required: true
      description: condition_grade required at sorted state regardless of usage.
      title: lc-sorted-accessories-condition-grade-required
  FootwearContextRulesMixin:
    name: FootwearContextRulesMixin
    definition_uri: https://inkind-at.github.io/inkind-knowledge-repo/FootwearContextRulesMixin
    description: lc-* rules for the Footwear category only. Mixed into FootwearPhysicalItemMixin
      (categories/footwear.yaml) and DonationItem's real FootwearItem subclass.
    from_schema: https://inkind-at.github.io/inkind-knowledge-repo/categories/_context_rules
    mixin: true
    class_uri: inkind_knowledge_repo:FootwearContextRulesMixin
    rules:
    - preconditions:
        slot_conditions:
          lifecycle_state:
            name: lifecycle_state
            equals_string: sorted
      postconditions:
        slot_conditions:
          condition_grade:
            name: condition_grade
            required: true
      description: condition_grade required at sorted state regardless of usage.
      title: lc-sorted-footwear-condition-grade-required
    - preconditions:
        slot_conditions:
          lifecycle_state:
            name: lifecycle_state
            equals_string: sorted
      postconditions:
        slot_conditions:
          is_winter_suitable:
            name: is_winter_suitable
            required: true
      description: "is_winter_suitable required at sorted state. The thermal and weather-protection\
        \ character of footwear is operationally critical for cold-weather emergency\
        \ distribution \u2014 boots and sandals serve entirely different needs. Sorter\
        \ makes the call; fragment compiler provides subcategory-based hints only."
      title: lc-sorted-footwear-is-winter-suitable-required
    - preconditions:
        slot_conditions:
          lifecycle_state:
            name: lifecycle_state
            equals_string: sorted
      postconditions:
        slot_conditions:
          shoe_size:
            name: shoe_size
            required: true
          shoe_size_system:
            name: shoe_size_system
            required: true
      description: shoe_size and shoe_size_system required at sorted state. System
        required alongside size to disambiguate EU 42 from UK 8.
      title: lc-sorted-footwear-size-required
  FurnitureContextRulesMixin:
    name: FurnitureContextRulesMixin
    definition_uri: https://inkind-at.github.io/inkind-knowledge-repo/FurnitureContextRulesMixin
