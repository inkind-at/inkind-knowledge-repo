    - preconditions:
        slot_conditions:
          assessment_result:
            name: assessment_result
            equals_string: non_functional
      postconditions:
        slot_conditions:
          sorting_notes:
            name: sorting_notes
            required: true
      description: "Non-functional powered devices require sorter confirmation. action:\
        \ warn \u2014 sorting_notes required."
      title: uc-mobility-non-functional-warn
  BabyInfantCategory:
    name: BabyInfantCategory
    definition_uri: https://inkind-at.github.io/inkind-knowledge-repo/BabyInfantCategory
    annotations:
      completeness_minimal:
        tag: completeness_minimal
        value: subcategory
      completeness_standard:
        tag: completeness_standard
        value: subcategory, usage, nappy_size
      completeness_detailed:
        tag: completeness_detailed
        value: subcategory, nappy_size, manufacture_year, is_complete_with_accessories,
          usage
      track_structural_subcategories:
        tag: track_structural_subcategories
        value: pushchairs_prams, cots_cribs, baby_carriers, high_chairs, car_seats,
          sleeping_bags
      track_consumable_subcategories:
        tag: track_consumable_subcategories
        value: infant_formula, feeding_bottles_teats, nappies, baby_care
      track_general_subcategories:
        tag: track_general_subcategories
        value: bath_equipment, changing, baby_monitors, bouncers_swings, breastfeeding,
          other
      regulatory_references:
        tag: regulatory_references
        value: EN 1888, EN 716, EN 14344, EN 14350, EN 16781
      label_en:
        tag: label_en
        value: Baby and Infant Supplies
      label_de:
        tag: label_de
        value: Baby- und Kleinkindausstattung
      aliases_en:
        tag: aliases_en
        value: '[''baby supplies'', ''infant supplies'', ''baby things'', ''infant
          things'']'
      aliases_de:
        tag: aliases_de
        value: '[''Babyausstattung'', ''Kleinkindausstattung'', ''Babybedarf'', ''Kleinkindbedarf'',
          ''Baby sachen'']'
    description: "Mixin for baby and infant supply slots and UC rules \u2014 Tracks\
      \ 2/3, see schema description above. Applied to BabyInfantItem via mixins: [BabyInfantCategory].\
      \ Track 1 assessment_result and its UC rules live on BabyEquipmentAssessmentMixin\
      \ (below), so DemandSignal can dispatch to this bare mixin without that assessment\
      \ content."
    from_schema: https://inkind-at.github.io/inkind-knowledge-repo/categories/baby_infant
    see_also:
    - http://www.productontology.org/id/Baby_transport
    - https://company.auntbertha.com/openeligibility/
    is_a: CategoryMixin
    mixin: true
    slots:
    - material
    - BabyInfantCategory_subcategory
    - manufacture_year
    - includes_original_accessories
    - BabyInfantCategory_is_winter_suitable
    - BabyInfantCategory_is_sealed
    - expiry_date
    - BabyInfantCategory_condition_grade
    - BabyInfantCategory_nappy_size
    slot_usage:
      subcategory:
        name: subcategory
        range: BabyInfantSubcategoryEnum
        required: true
      is_winter_suitable:
        name: is_winter_suitable
        description: "Whether this item provides meaningful warmth in cold conditions.\
          \ Required for sleeping_bags (UC-enforced) \u2014 a summer-weight baby sleeping\
          \ bag in cold-weather distribution is a safety risk. Thermal rating (e.g.\
          \ \"2.5 tog\", \"0\xB0C comfort limit\") may be noted in sorting_notes."
        range: boolean
        required: false
      is_sealed:
        name: is_sealed
        description: Packaging/seal integrity for Track 2 consumables. Required when
          subcategory in [infant_formula, feeding_bottles_teats, nappies].
        required: false
      condition_grade:
        name: condition_grade
        description: Wear grade for Track 3 general baby gear. Required when subcategory
          in [bath_equipment, changing, baby_monitors, bouncers_swings, breastfeeding,
          other].
        range: UsedConditionGradeEnum
        required: false
      nappy_size:
        name: nappy_size
        description: "Weight-banded nappy size. Required when subcategory=nappies.\
          \ Distinct from ClothingCategory's age-banded size slot \u2014 nappy fit\
          \ is determined by infant weight, not age."
        range: NappySizeEnum
        required: false
    class_uri: inkind_knowledge_repo:BabyInfantCategory
    rules:
    - preconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            equals_string: car_seats
      postconditions:
        slot_conditions:
          manufacture_year:
            name: manufacture_year
            required: true
      description: "Car seats require manufacture_year to enable the runtime age check.\
        \ EN 14344 standard \u2014 car seats over 10 years old or with unknown collision\
        \ history must not be redistributed. manufacture_year must be recorded for\
        \ all car seats (new and used) so the runtime check can verify the 10-year\
        \ limit."
      title: uc-baby-car-seat-manufacture-year
    - preconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            equals_string: sleeping_bags
      postconditions:
        slot_conditions:
          is_winter_suitable:
            name: is_winter_suitable
            required: true
      description: "Baby sleeping bags require is_winter_suitable to be explicitly\
        \ set. A summer-weight baby sleeping bag (e.g. 0.5-1.0 tog) issued in a cold-weather\
        \ response is a genuine safety risk \u2014 infants cannot regulate their own\
        \ temperature. The thermal rating is typically printed on the label (tog,\
        \ season number, or comfort temperature). action: warn \u2014 is_winter_suitable\
        \ must be set at sorted state."
      title: uc-baby-sleeping-bag-winter-required
    - preconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            any_of:
            - equals_string: infant_formula
            - equals_string: feeding_bottles_teats
            - equals_string: nappies
            - equals_string: baby_care
      postconditions:
        slot_conditions:
          is_sealed:
            name: is_sealed
            required: true
      description: "Consumable baby items require sealed packaging. Nappies and formula\
        \ are UNHCR NFI core relief items \u2014 hygiene integrity is essential. baby_care\
        \ (wipes, powder, lotion, etc.) carries the same hygiene requirement as the\
        \ adult toiletries it mirrors in PersonalCareCategory."
      title: uc-baby-consumable-sealed-required
    - preconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            any_of:
            - equals_string: infant_formula
            - equals_string: feeding_bottles_teats
            - equals_string: nappies
            - equals_string: baby_care
          is_sealed:
            name: is_sealed
            equals_string: 'false'
      postconditions:
        slot_conditions:
          lifecycle_state:
            name: lifecycle_state
            none_of:
            - equals_string: stored
            - equals_string: distributed
      description: 'Unsealed consumable baby items must not be redistributed. action:
        block.'
      title: uc-baby-consumable-unsealed-block
    - preconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            equals_string: nappies
      postconditions:
        slot_conditions:
          nappy_size:
            name: nappy_size
            required: true
      description: "Nappies require nappy_size. Weight-banded sizing is essential\
        \ for matching donated nappies to the recipient infant's needs \u2014 an unsized\
        \ nappy donation cannot be usefully distributed."
      title: lc-baby-nappy-size-required
    - preconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            equals_string: feeding_bottles_teats
          usage:
            name: usage
            equals_string: used
      postconditions:
        slot_conditions:
          lifecycle_state:
            name: lifecycle_state
            none_of:
            - equals_string: stored
            - equals_string: distributed
      description: "Used feeding bottles and teats must not be redistributed. Hygiene\
        \ and infant safety \u2014 EN 14350 (drinking equipment for children). action:\
        \ block \u2014 no override."
      title: uc-baby-feeding-used-block
    - preconditions: {}
      annotations:
        enforcement:
          tag: enforcement
          value: application_layer
        uc_action:
          tag: uc_action
          value: block
        uc_suggest:
          tag: uc_suggest
          value: disposal
        uc_note:
          tag: uc_note
          value: "expiry_date < today \u2014 runtime check by Django model clean()"
      description: Consumables past expiry must not be redistributed. Runtime check.
      title: uc-baby-consumable-expiry-block
    - preconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            any_of:
            - equals_string: bath_equipment
            - equals_string: changing
            - equals_string: baby_monitors
            - equals_string: bouncers_swings
            - equals_string: breastfeeding
            - equals_string: other
      postconditions:
        slot_conditions:
          condition_grade:
            name: condition_grade
            required: true
      description: General baby gear requires condition_grade wear assessment.
      title: uc-baby-general-condition-grade-required
