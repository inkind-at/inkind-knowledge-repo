  MobilityAidsContextRulesMixin:
    name: MobilityAidsContextRulesMixin
    definition_uri: https://inkind-at.github.io/inkind-knowledge-repo/MobilityAidsContextRulesMixin
    description: lc-* rules for the Mobility Aids category only. Mixed into MobilityAssessmentMixin
      (categories/mobility_aids.yaml) and DonationItem's real MobilityAidsItem subclass.
    from_schema: https://inkind-at.github.io/inkind-knowledge-repo/categories/_context_rules
    mixin: true
    class_uri: inkind_knowledge_repo:MobilityAidsContextRulesMixin
    rules:
    - preconditions:
        slot_conditions:
          lifecycle_state:
            name: lifecycle_state
            equals_string: sorted
      postconditions:
