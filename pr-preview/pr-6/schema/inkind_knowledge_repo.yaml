            tag: aliases_de
            value: '[''Bettdecke'', ''Steppdecke'', ''Kontinentaldecke'']'
        see_also:
        - pto:Duvet
      pillows:
        text: pillows
        description: Pillows and sleeping cushions.
        annotations:
          label_en:
            tag: label_en
            value: Pillows
          label_de:
            tag: label_de
            value: Kissen
          aliases_en:
            tag: aliases_en
            value: '[''pillow'', ''cushion'', ''sleeping cushion'']'
          aliases_de:
            tag: aliases_de
            value: '[''Kissen'', ''Sitzkissen'', ''Schlafkissen'']'
        see_also:
        - pto:Pillow
      mattresses:
        text: mattresses
        description: "Single, double, children's mattresses. Hygiene UC applies. is_winter_suitable\
