        value: '03.1'
      label_en:
        tag: label_en
        value: Accessories
      label_de:
        tag: label_de
        value: Accesoires
      aliases_en:
        tag: aliases_en
        value: '[''accessories'', ''accessory'', ''fashion accessory'']'
      aliases_de:
        tag: aliases_de
        value: '[''Accesoires'', ''Accessoire'', ''Modeaccessoire'']'
    description: 'Mixin for fashion and personal accessories. Applied to AccessoriesItem
      via mixins: [AccessoriesCategory].'
    from_schema: https://inkind-at.github.io/inkind-knowledge-repo/categories/accessories
    see_also:
    - http://www.productontology.org/id/Fashion_accessory
