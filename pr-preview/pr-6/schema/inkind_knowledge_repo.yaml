    - preconditions:
        slot_conditions:
          season:
            name: season
            equals_string: all_season
      postconditions:
        slot_conditions:
          is_winter_suitable:
            name: is_winter_suitable
            equals_string: 'true'
      description: season = all_season implies is_winter_suitable = true.
      title: vm-season-all
  FurnitureCategory:
    name: FurnitureCategory
    definition_uri: https://inkind-at.github.io/inkind-knowledge-repo/FurnitureCategory
    annotations:
      completeness_minimal:
        tag: completeness_minimal
        value: subcategory
      completeness_standard:
        tag: completeness_standard
        value: subcategory, material, usage
      completeness_detailed:
        tag: completeness_detailed
        value: subcategory, material, dimensions, style, usage
      coicop_division:
        tag: coicop_division
        value: '05.1'
      label_en:
        tag: label_en
        value: Furniture
      label_de:
        tag: label_de
        value: "M\xF6bel"
      aliases_en:
        tag: aliases_en
        value: '[''furniture'', ''furnishings'']'
      aliases_de:
        tag: aliases_de
        value: "['M\xF6bel', 'Einrichtung']"
    description: 'Mixin for furniture slots, value maps, and UC rules. Applied to
      FurnitureItem via mixins: [FurnitureCategory]. assessment_result and its UC
      rules live on FurnitureAssessmentMixin (below) so DemandSignal can dispatch
      to this bare mixin without assessment content that only applies to a physical
      item in hand.'
    from_schema: https://inkind-at.github.io/inkind-knowledge-repo/categories/furniture
    see_also:
    - http://www.productontology.org/id/Furniture
    is_a: CategoryMixin
    mixin: true
    slots:
    - FurnitureCategory_subcategory
    - FurnitureCategory_material
    - dimensions
    - style
    slot_usage:
      subcategory:
        name: subcategory
        range: FurnitureSubcategoryEnum
        required: true
      material:
        name: material
        range: FurnitureMaterialEnum
        required: false
    class_uri: inkind_knowledge_repo:FurnitureCategory
    rules:
    - preconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            equals_string: beds
      postconditions:
        slot_conditions:
          material:
            name: material
            any_of:
            - equals_string: wood
            - equals_string: metal
            - equals_string: mixed
      description: Beds accept structural materials only (wood, metal, mixed). Fabric
        and plastic are not valid primary materials for beds.
      title: vm-material-beds
    - preconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            equals_string: tables
      postconditions:
        slot_conditions:
          material:
            name: material
            any_of:
            - equals_string: wood
            - equals_string: metal
            - equals_string: plastic
            - equals_string: glass
            - equals_string: mixed
      description: Tables do not use fabric as primary material.
      title: vm-material-tables
  FurnitureAssessmentMixin:
    name: FurnitureAssessmentMixin
    definition_uri: https://inkind-at.github.io/inkind-knowledge-repo/FurnitureAssessmentMixin
