    class_uri: inkind_knowledge_repo:ClothingPhysicalItemMixin
  ClothingCategory:
    name: ClothingCategory
    definition_uri: https://inkind-at.github.io/inkind-knowledge-repo/ClothingCategory
    annotations:
      completeness_minimal:
        tag: completeness_minimal
        value: subcategory, tops_subcategory, bottoms_subcategory
      completeness_standard:
        tag: completeness_standard
        value: subcategory, tops_subcategory, bottoms_subcategory, demographic, is_maternity,
          size, is_winter_suitable, usage, condition_grade
      completeness_detailed:
        tag: completeness_detailed
        value: subcategory, tops_subcategory, bottoms_subcategory, demographic, is_maternity,
          size, is_winter_suitable, season, material, usage, condition_grade, intact_labels
      coicop_division:
        tag: coicop_division
        value: '03.1'
      material_winter_hint:
        tag: material_winter_hint
        value: Fragment compiler may pre-fill is_winter_suitable=true when material
          in [wool, fleece, down] and is_winter_suitable=false when material in [linen,
          silk]. Sorter can always override.
      season_ui_hint:
        tag: season_ui_hint
        value: Fragment compiler may pre-fill is_winter_suitable=true when subcategory=outerwear
          and is_winter_suitable=false when subcategory=sportswear (swimwear). Sorter
          can override.
      label_en:
        tag: label_en
        value: Clothing
      label_de:
        tag: label_de
        value: Kleidung
      aliases_en:
        tag: aliases_en
        value: '[''clothing'', ''clothes'', ''garment'', ''apparel'']'
      aliases_de:
        tag: aliases_de
        value: "['Kleidung', 'Bekleidung', 'Kleidungsst\xFCck', 'Apparel', 'Gewand',\
          \ 'Kleidungsartikel']"
    description: "Mixin carrying clothing-specific slots, value maps, and UC rules.\
      \ Applied to ClothingItem via mixins: [ClothingCategory]. Does NOT include accessories\
      \ \u2014 see AccessoriesCategory (accessories.yaml). Domain-level rules only;\
      \ lifecycle-aware (lc-*) rules live in ClothingContextRulesMixin (categories/_context_rules.yaml)."
    from_schema: https://inkind-at.github.io/inkind-knowledge-repo/categories/clothing
    see_also:
    - http://www.ebusiness-unibw.org/ontologies/cpi/ns#ClothingAndAccessories
    is_a: CategoryMixin
    mixin: true
    slots:
    - ClothingCategory_condition_grade
    - ClothingCategory_subcategory
    - ClothingCategory_tops_subcategory
    - ClothingCategory_bottoms_subcategory
    - ClothingCategory_material
    - ClothingCategory_is_winter_suitable
    - ClothingCategory_demographic
    - is_maternity
    - ClothingCategory_size
    - ClothingCategory_season
    - intact_labels
    slot_usage:
      subcategory:
        name: subcategory
        description: Subcategory becomes a required field on DonationItem when item's
          lifecycle is sorted.
        range: ClothingSubcategoryEnum
        required: false
      tops_subcategory:
        name: tops_subcategory
        range: TopsSubcategoryEnum
        required: false
      bottoms_subcategory:
        name: bottoms_subcategory
        range: BottomsSubcategoryEnum
        required: false
      demographic:
        name: demographic
        range: DemographicEnum
        required: false
      size:
        name: size
        range: ClothingSizeEnum
        required: false
        multivalued: true
      is_winter_suitable:
        name: is_winter_suitable
        description: "Whether this garment provides meaningful warmth in cold-weather\
          \ conditions. Required at standard completeness for tops, bottoms, outerwear,\
          \ nightwear. The sorter's direct assessment \u2014 not inferred from subcategory\
          \ or material. The primary emergency distribution filter: \"all winter-suitable\
          \ clothing for adults.\""
        range: boolean
        required: false
      season:
        name: season
        description: "Seasonal suitability. Optional \u2014 detailed completeness\
          \ tier. Multivalued: a garment may span seasons (e.g. spring_autumn + summer).\
          \ VM rules auto-derive is_winter_suitable for the extreme values (winter,\
          \ summer, all_season); spring_autumn leaves the sorter to set is_winter_suitable\
          \ explicitly."
        range: SeasonEnum
        required: false
        multivalued: true
      material:
        name: material
        description: "Primary fibre or fabric composition. Optional \u2014 detailed\
          \ completeness tier. Select the dominant fibre for blended fabrics; use\
          \ synthetic_blend when no single synthetic dominates. Exact fibre percentages\
          \ from legible care labels may be noted in sorting_notes. See ClothingMaterialEnum\
          \ for full vocabulary and ontology grounding."
        range: ClothingMaterialEnum
        required: false
      condition_grade:
        name: condition_grade
        range: UsedConditionGradeEnum
        required: false
    class_uri: inkind_knowledge_repo:ClothingCategory
    rules:
    - preconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            equals_string: underwear
          condition_grade:
            name: condition_grade
            any_of:
            - equals_string: fair
            - equals_string: poor
      postconditions:
        slot_conditions:
          lifecycle_state:
            name: lifecycle_state
            none_of:
            - equals_string: stored
            - equals_string: distributed
      description: 'Underwear must be new or like_new condition. fair or poor graded
        underwear must not be redistributed. Reflects universal hygiene policy across
        social organisations. action: block, suggest: disposal.'
      title: uc-underwear-condition-block
    - preconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            equals_string: underwear
          demographic:
            name: demographic
            any_of:
            - equals_string: adult_male
            - equals_string: adult_female
          usage:
            name: usage
            equals_string: used
      postconditions:
        slot_conditions:
          lifecycle_state:
            name: lifecycle_state
            none_of:
            - equals_string: stored
            - equals_string: distributed
      description: 'Used adult underwear (adult_male or adult_female demographic)
        must not be redistributed. usage must be new. Reflects hygiene and dignity
        standards applied universally in the social sector. action: block.'
      title: uc-underwear-adult-used-block
    - preconditions:
        slot_conditions:
          condition_grade:
            name: condition_grade
            equals_string: poor
      postconditions:
        slot_conditions:
          lifecycle_state:
            name: lifecycle_state
            none_of:
            - equals_string: stored
            - equals_string: distributed
      description: 'Items in poor condition should not be distributed. action: block,
        suggest: disposal.'
      title: uc-poor-condition-block
    - preconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            equals_string: tops
      postconditions:
        slot_conditions:
          tops_subcategory:
            name: tops_subcategory
            required: true
      description: Tops subcategory is required for tops items.
      title: lc-tops-subcategory-required
    - preconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            equals_string: bottoms
      postconditions:
        slot_conditions:
          bottoms_subcategory:
            name: bottoms_subcategory
            required: true
      description: Bottoms subcategory is required for bottoms items.
      title: lc-bottoms-subcategory-required
    - preconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            equals_string: underwear
      postconditions:
        slot_conditions:
          demographic:
            name: demographic
            any_of:
            - equals_string: baby
            - equals_string: child
            - equals_string: adult_male
            - equals_string: adult_female
      description: "Underwear subcategory restricts demographic to baby, child, adult_male,\
        \ adult_female. Unisex is not a valid demographic for underwear \u2014 underwear\
        \ is always gender-specific at the redistribution level."
      title: vm-demographic-underwear
    - preconditions:
        slot_conditions:
          demographic:
            name: demographic
            equals_string: baby
      postconditions:
        slot_conditions:
          size:
            name: size
            any_of:
            - equals_string: baby_50
            - equals_string: baby_56
            - equals_string: baby_62
            - equals_string: baby_68
            - equals_string: baby_74
            - equals_string: baby_80
            - equals_string: baby_86
            - equals_string: baby_92
      description: baby demographic constrains size to infant size codes.
      title: vm-size-baby
    - preconditions:
        slot_conditions:
          demographic:
            name: demographic
            equals_string: child
      postconditions:
        slot_conditions:
          size:
            name: size
            any_of:
            - equals_string: child_98
            - equals_string: child_104
            - equals_string: child_110
            - equals_string: child_116
            - equals_string: child_122
            - equals_string: child_128
            - equals_string: child_140
            - equals_string: child_152
            - equals_string: child_164
            - equals_string: child_170
      description: child demographic constrains size to children's size codes.
      title: vm-size-child
    - preconditions:
        slot_conditions:
          demographic:
            name: demographic
            any_of:
            - equals_string: adult_male
            - equals_string: adult_female
            - equals_string: unisex
      postconditions:
        slot_conditions:
          size:
            name: size
            any_of:
            - equals_string: size_xs
            - equals_string: size_s
            - equals_string: size_m
            - equals_string: size_l
            - equals_string: size_xl
            - equals_string: size_xxl_plus
      description: adult/unisex demographics constrain size to adult size codes.
      title: vm-size-adult
    - preconditions:
        slot_conditions:
          season:
            name: season
            equals_string: winter
      postconditions:
        slot_conditions:
          is_winter_suitable:
            name: is_winter_suitable
            equals_string: 'true'
      description: season = winter implies is_winter_suitable = true. A garment explicitly
        tagged winter must be winter-suitable.
      title: vm-season-winter
    - preconditions:
        slot_conditions:
          is_winter_suitable:
            name: is_winter_suitable
            equals_string: 'false'
      postconditions:
        slot_conditions:
          season:
            name: season
            any_of:
            - equals_string: summer
            - equals_string: spring_autumn
      description: is_winter_suitable = false implies that season cannot be winter
        and all season.
      title: vm-season-not-winter-suitable
    - preconditions:
        slot_conditions:
          season:
            name: season
            equals_string: summer
      postconditions:
        slot_conditions:
          is_winter_suitable:
            name: is_winter_suitable
            equals_string: 'false'
      description: "season = summer implies is_winter_suitable = false. A garment\
        \ explicitly tagged summer-only is not winter-suitable. Note: if a sorter\
        \ tags both summer and spring_autumn, the is_winter_suitable value is their\
        \ explicit call \u2014 no rule fires."
      title: vm-season-summer
    - preconditions:
        slot_conditions:
          season:
            name: season
            equals_string: all_season
      postconditions:
        slot_conditions:
          is_winter_suitable:
            name: is_winter_suitable
            equals_string: 'true'
      description: season = all_season implies is_winter_suitable = true. All-season
        items are by definition suitable in winter.
      title: vm-season-all
    - preconditions:
        slot_conditions:
          demographic:
            name: demographic
            equals_string: adult_female
          subcategory:
            name: subcategory
            any_of:
            - equals_string: tops
            - equals_string: bottoms
            - equals_string: outerwear
      postconditions:
        slot_conditions:
          is_maternity:
            name: is_maternity
            required: true
      description: is_maternity is only meaningful for adult female wear and category
        tops, bottoms, outerwear.
      title: lc-maternity-demographic-subcategory
  FootwearPhysicalItemMixin:
    name: FootwearPhysicalItemMixin
