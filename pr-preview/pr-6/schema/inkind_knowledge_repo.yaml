  HouseholdMaterialEnum:
    name: HouseholdMaterialEnum
    definition_uri: https://inkind-at.github.io/inkind-knowledge-repo/HouseholdMaterialEnum
    description: Primary construction material of a household or kitchen item. Records
      the dominant material; use mixed when none dominates. Grounded in Product Types
      Ontology (pto:), consistent with FurnitureMaterialEnum. Used for allergen filtering
      (nickel, copper) and care-requirement matching (cast iron, copper, wood, non-stick).
