  BabyInfantContextRulesMixin:
    name: BabyInfantContextRulesMixin
    definition_uri: https://inkind-at.github.io/inkind-knowledge-repo/BabyInfantContextRulesMixin
    description: lc-* rules for the Baby & Infant Supplies category only. Mixed into
      BabyEquipmentAssessmentMixin (categories/baby_infant.yaml) and DonationItem's
      real BabyInfantItem subclass.
    from_schema: https://inkind-at.github.io/inkind-knowledge-repo/categories/_context_rules
    mixin: true
    class_uri: inkind_knowledge_repo:BabyInfantContextRulesMixin
    rules:
    - preconditions:
        slot_conditions:
          lifecycle_state:
            name: lifecycle_state
            equals_string: sorted
          subcategory:
            name: subcategory
            equals_string: sleeping_bags
      postconditions:
        slot_conditions:
          is_winter_suitable:
            name: is_winter_suitable
            required: true
      description: "is_winter_suitable required at sorted state for baby sleeping\
        \ bags. A summer-weight baby sleeping bag (0.5-1.0 tog) issued in cold- weather\
        \ distribution is a safety risk \u2014 infants cannot regulate their own temperature.\
        \ BabyInfantCategory also carries this rule; the lifecycle rule here ensures\
        \ it is enforced at the sorted transition."
      title: lc-sorted-baby-sleeping-bag-winter-required
    - preconditions:
        slot_conditions:
          lifecycle_state:
            name: lifecycle_state
            equals_string: sorted
      postconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            required: true
      description: subcategory required at sorted state. BabyInfantCategory rules
        then enforce the appropriate assessment track for that subcategory.
      title: lc-sorted-baby-subcategory-required
    - preconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            any_of:
            - equals_string: cots_cribs
            - equals_string: car_seats
            - equals_string: pushchairs_prams
          lifecycle_state:
            name: lifecycle_state
            equals_string: sorted
      postconditions:
        slot_conditions:
          manufacture_year:
            name: manufacture_year
            required: true
      description: Manufacture year is required for certain subcategories.
      title: lc-manufacture-year-required
