  BabyInfantItem:
    name: BabyInfantItem
    definition_uri: https://inkind-at.github.io/inkind-knowledge-repo/BabyInfantItem
    description: "Baby and infant supplies: pushchairs, cots, car seats, infant formula,\
      \ feeding bottles, baby monitors, bath equipment. Baby clothing belongs in ClothingItem\
      \ (demographic=baby). Treated as a first-class category (COICOP otherwise scatters\
      \ these across Divisions 01/03/05), following Open Eligibility and UNHCR NFI\
      \ kit practice.\nThree-track assessment: Track 1 \u2014 safety-critical equipment\
      \ (BabyEquipmentAssessmentEnum): pushchairs, cots, car seats, carriers, high\
      \ chairs, sleeping bags (EN 1888/716/14344/16781). Baby sleeping bags are Track\
      \ 1, not BeddingTextilesItem, since EN 16781 differs from adult sleeping-bag\
      \ hygiene checks. Track 2 \u2014 consumables (is_sealed + expiry_date): infant\
      \ formula, feeding bottles/teats, baby food. Track 3 \u2014 general gear (condition_grade):\
      \ bath, changing, monitors, bouncers."
    from_schema: https://inkind-at.github.io/inkind-knowledge-repo/donation_item
    see_also:
    - http://www.productontology.org/id/Baby_transport
    - http://www.productontology.org/id/Infant_bed
    - https://company.auntbertha.com/openeligibility/
    - https://emergency.unhcr.org/emergency-assistance/core-relief-items/kind-non-food-item-distribution
    mappings:
    - pto:Baby_transport
    is_a: DonationItem
    mixins:
