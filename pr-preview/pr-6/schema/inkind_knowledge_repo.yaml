    description: "Shared physical-item dispatch target for the Clothing category,\
      \ used identically by DonationItem, StorageCollection, and SortedCollection.\
      \ Pure composition \u2014 no slots or rules of its own."
    from_schema: https://inkind-at.github.io/inkind-knowledge-repo/categories/clothing
    is_a: ClothingCategory
