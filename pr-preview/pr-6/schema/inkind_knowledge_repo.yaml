    name: DemandSignal
    definition_uri: https://inkind-at.github.io/inkind-knowledge-repo/DemandSignal
    annotations:
      completeness_minimal:
        tag: completeness_minimal
        value: category
    description: "A signal representing demand for a category of items.  Covers standing\
      \ interests, time-bounded campaigns, and specific beneficiary requests under\
      \ a single unified model.\ncategory's range is BaseCategoryEnum (core.yaml)\
      \ \u2014 dispatch_to resolves to the bare Tier 1 category mixin only, since\
      \ a demand signal describes what's wanted, not a physical item in hand: assessment_result\
      \ and lifecycle_state-gated visibility never apply here."
