      coicop_division:
        tag: coicop_division
        value: '03.2'
      season_ui_hint:
        tag: season_ui_hint
        value: Fragment compiler may pre-fill is_winter_suitable=true for boots and
          is_winter_suitable=false for sandals. Sorter can override.
      label_en:
        tag: label_en
        value: Footwear
      label_de:
        tag: label_de
        value: Schuhe
      aliases_en:
        tag: aliases_en
        value: '[''footwear'', ''shoes'', ''boots'', ''sandals'', ''slippers'']'
      aliases_de:
        tag: aliases_de
        value: '[''Schuhe'', ''Stiefel'', ''Sandalen'', ''Hausschuhe'']'
    description: 'Mixin for footwear slots and UC rules. Applied to FootwearItem via
