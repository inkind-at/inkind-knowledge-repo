    definition_uri: https://inkind-at.github.io/inkind-knowledge-repo/MobilityAssessmentMixin
    annotations:
      completeness_minimal:
        tag: completeness_minimal
        value: subcategory, assessment_result
      completeness_standard:
        tag: completeness_standard
        value: subcategory, assessment_result, usage
      completeness_detailed:
        tag: completeness_detailed
        value: subcategory, assessment_result, usage
      coicop_divisions:
        tag: coicop_divisions
        value: 06.1.3, 06.2
      open_eligibility_category:
        tag: open_eligibility_category
        value: Assistive Technology
    description: "Shared physical-item dispatch target for Mobility Aids \u2014 used\
      \ identically by DonationItem, StorageCollection, and SortedCollection. Adds\
      \ assessment_result and its UC rules on top of MobilityAidsCategory. Never used\
      \ by DemandSignal."
    from_schema: https://inkind-at.github.io/inkind-knowledge-repo/categories/mobility_aids
    is_a: MobilityAidsCategory
    mixin: true
    mixins:
    - MobilityAidsContextRulesMixin
    slots:
    - material
    - MobilityAidsCategory_subcategory
