    mixins:
    - FoodContextRulesMixin
    slots:
    - FoodCategory_subcategory
    - FoodCategory_expiry_date
    - FoodCategory_packaging_intact
    - FoodCategory_storage_requirement
    - net_content_value
    - net_content_unit
    class_uri: inkind_knowledge_repo:FoodPhysicalItemMixin
  FoodCategory:
    name: FoodCategory
    definition_uri: https://inkind-at.github.io/inkind-knowledge-repo/FoodCategory
    annotations:
      completeness_minimal:
        tag: completeness_minimal
        value: subcategory, packaging_intact, storage_requirement
      completeness_standard:
        tag: completeness_standard
        value: subcategory, packaging_intact, storage_requirement, usage
      completeness_detailed:
        tag: completeness_detailed
        value: subcategory, packaging_intact, storage_requirement, expiry_date, net_content_value,
          net_content_unit, usage
      coicop_division:
        tag: coicop_division
        value: '01'
      phase:
        tag: phase
        value: Phase 1 stub
      label_en:
        tag: label_en
        value: Food
      label_de:
        tag: label_de
        value: Lebensmittel
      aliases_en:
        tag: aliases_en
        value: '[''food'', ''food item'']'
      aliases_de:
        tag: aliases_de
        value: '[''Essen'', ''Lebensmittel'']'
    description: 'Mixin for food-specific slots, value maps, and UC rules. Applied
      to FoodItem via mixins: [FoodCategory].'
    from_schema: https://inkind-at.github.io/inkind-knowledge-repo/categories/food
    see_also:
    - foodon:00001006
    - http://purl.obolibrary.org/obo/foodon.owl
    mixin: true
    slots:
    - FoodCategory_subcategory
    - FoodCategory_expiry_date
    - FoodCategory_packaging_intact
    - FoodCategory_storage_requirement
    - net_content_value
    - net_content_unit
    slot_usage:
      subcategory:
        name: subcategory
        annotations:
          label_en:
            tag: label_en
            value: food type
          label_de:
            tag: label_de
            value: Lebensmitteltyp
        description: Primary food type classification. Grounded in FoodOn food product
          taxonomy. Determines valid storage_requirement values via value map.
        see_also:
        - foodon:00001017
        range: FoodTypeEnum
        required: true
      packaging_intact:
        name: packaging_intact
        required: false
      storage_requirement:
        name: storage_requirement
        required: false
      expiry_date:
        name: expiry_date
        annotations:
          uc_action:
            tag: uc_action
            value: block
          uc_suggest:
            tag: uc_suggest
            value: disposal
          uc_note:
            tag: uc_note
            value: "Dynamic date comparison \u2014 runtime enforcement"
        description: 'Expiry or best-before date as printed on the packaging. UC block:
          expiry_date < today (runtime check by Django model clean()).'
        see_also:
        - foodon:00001043
    class_uri: inkind_knowledge_repo:FoodCategory
    rules:
    - preconditions:
        slot_conditions:
          packaging_intact:
            name: packaging_intact
            equals_string: 'false'
          subcategory:
            name: subcategory
            any_of:
            - equals_string: fruit_vegetables
            - equals_string: dairy_eggs
            - equals_string: meat_fish
            - equals_string: baby_food
            - equals_string: ready_meals
      postconditions:
        slot_conditions:
          lifecycle_state:
            name: lifecycle_state
            none_of:
            - equals_string: stored
            - equals_string: distributed
      description: "Perishable items with compromised packaging must not be redistributed.\
        \ Food safety principle \u2014 perishable items cannot be safely redistributed\
        \ once packaging integrity is lost. action: block."
      title: uc-packaging-perishable-block
    - preconditions: {}
      annotations:
        enforcement:
          tag: enforcement
          value: application_layer
        uc_action:
          tag: uc_action
          value: block
        uc_suggest:
          tag: uc_suggest
          value: disposal
        uc_note:
          tag: uc_note
          value: "expiry_date < today \u2014 runtime check by Django model clean()"
      description: "Items past expiry date must not be redistributed. Runtime check\
        \ \u2014 dynamic date comparison not expressible as a static LinkML rule.\
        \ Enforced by Django model clean() at save time."
      title: uc-expiry-date-past-block
    - preconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            equals_string: bread_bakery
      postconditions:
        slot_conditions:
          storage_requirement:
            name: storage_requirement
            any_of:
            - equals_string: ambient
            - equals_string: frozen
      description: "Bread and bakery goods are ambient or frozen \u2014 never refrigerated."
      title: vm-storage-bread-bakery
    - preconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            equals_string: fruit_vegetables
      postconditions:
        slot_conditions:
          storage_requirement:
            name: storage_requirement
            any_of:
            - equals_string: ambient
            - equals_string: refrigerated
            - equals_string: frozen
      description: Fruit and vegetables may be stored ambient, refrigerated, or frozen.
      title: vm-storage-fruit-vegetables
    - preconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            equals_string: meat_fish
      postconditions:
        slot_conditions:
          storage_requirement:
            name: storage_requirement
            any_of:
            - equals_string: refrigerated
            - equals_string: frozen
      description: "Meat and fish require refrigerated or frozen storage \u2014 never\
        \ ambient, for food safety."
      title: vm-storage-meat-fish
    - preconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            equals_string: dairy_eggs
      postconditions:
        slot_conditions:
          storage_requirement:
            name: storage_requirement
            any_of:
            - equals_string: refrigerated
            - equals_string: frozen
      description: Dairy and eggs require refrigerated or frozen storage.
      title: vm-storage-dairy-eggs
    - preconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            equals_string: dry_goods
      postconditions:
        slot_conditions:
          storage_requirement:
            name: storage_requirement
            any_of:
            - equals_string: ambient
            - equals_string: dry_cool
      description: "Dry goods are shelf-stable \u2014 ambient or dry_cool storage\
        \ only."
      title: vm-storage-dry-goods
    - preconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            equals_string: canned_goods
      postconditions:
        slot_conditions:
          storage_requirement:
            name: storage_requirement
            equals_string: ambient
      description: "Canned goods are shelf-stable \u2014 ambient storage only."
      title: vm-storage-canned
    - preconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            equals_string: beverages
      postconditions:
        slot_conditions:
          storage_requirement:
            name: storage_requirement
            any_of:
            - equals_string: ambient
            - equals_string: refrigerated
      description: Beverages are stored ambient or refrigerated.
      title: vm-storage-beverages
    - preconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            equals_string: confectionery_sweets
      postconditions:
        slot_conditions:
          storage_requirement:
            name: storage_requirement
            equals_string: ambient
      description: "Confectionery and sweets are shelf-stable \u2014 ambient storage\
        \ only."
      title: vm-storage-confectionery-sweets
    - preconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            equals_string: condiments
      postconditions:
        slot_conditions:
          storage_requirement:
            name: storage_requirement
            any_of:
            - equals_string: ambient
            - equals_string: refrigerated
      description: Condiments are stored ambient or refrigerated (once opened).
      title: vm-storage-condiments
    - preconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            equals_string: ready_meals
      postconditions:
        slot_conditions:
          storage_requirement:
            name: storage_requirement
            any_of:
            - equals_string: ambient
            - equals_string: refrigerated
            - equals_string: frozen
      description: Ready meals may be shelf-stable ambient, chilled, or frozen, depending
        on preparation.
      title: vm-storage-ready-meals
    - preconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            equals_string: baby_food
      postconditions:
        slot_conditions:
          storage_requirement:
            name: storage_requirement
            any_of:
            - equals_string: ambient
            - equals_string: refrigerated
      description: Baby food is stored ambient or refrigerated (once opened).
      title: vm-storage-baby-food
  OtherPhysicalItemMixin:
    name: OtherPhysicalItemMixin
    definition_uri: https://inkind-at.github.io/inkind-knowledge-repo/OtherPhysicalItemMixin
    description: "Shared physical-item dispatch target for the Other category, used\
      \ identically by DonationItem, StorageCollection, and SortedCollection. Pure\
      \ composition \u2014 no slots or rules of its own."
    from_schema: https://inkind-at.github.io/inkind-knowledge-repo/categories/other
    is_a: OtherCategory
    mixin: true
    mixins:
    - OtherContextRulesMixin
    slots:
    - OtherCategory_item_description
    - OtherCategory_condition_grade
    class_uri: inkind_knowledge_repo:OtherPhysicalItemMixin
  OtherCategory:
    name: OtherCategory
    definition_uri: https://inkind-at.github.io/inkind-knowledge-repo/OtherCategory
    annotations:
      label_en:
        tag: label_en
        value: Other
      label_de:
        tag: label_de
        value: Sonstiges
      aliases_en:
        tag: aliases_en
        value: '[''other'']'
      aliases_de:
        tag: aliases_de
        value: '[''sonstiges'']'
    description: "Mixin for the catch-all OtherItem category. Minimal slots only (item_description\
      \ + condition_grade) \u2014 no category-specific value maps or UC rules. Deliberately\
      \ no completeness tier annotations."
    from_schema: https://inkind-at.github.io/inkind-knowledge-repo/categories/other
    mappings:
    - schema:Product
    mixin: true
    slots:
    - OtherCategory_item_description
    - OtherCategory_condition_grade
    slot_usage:
      item_description:
        name: item_description
        required: true
      condition_grade:
        name: condition_grade
        range: UsedConditionGradeEnum
        required: false
    class_uri: schema:Product
  ProvenanceRecord:
    name: ProvenanceRecord
    definition_uri: https://inkind-at.github.io/inkind-knowledge-repo/ProvenanceRecord
    description: "A single provenance record capturing one completed process step\
      \ \u2014 who did it, when, on which device, at what configured cost, and what\
      \ observations were submitted.  Corresponds to prov:Activity in W3C PROV-O."
    from_schema: https://inkind-at.github.io/inkind-knowledge-repo/provenance
    mappings:
    - prov:Activity
    slots:
    - id
    - step_type_ref
    - actor_ref
    - ProvenanceRecord_actor_role_ref
    - ProvenanceRecord_org
    - device
    - started_at
    - completed_at
    - duration_seconds
    - cost_configured
    - observations_ref
    - override_flag
    - override_reason
    slot_usage:
      org:
        name: org
        range: SocialOrganisation
        required: true
      actor_role_ref:
        name: actor_role_ref
        range: ActorRoleEnum
        required: true
    class_uri: prov:Activity
  ClothingContextRulesMixin:
    name: ClothingContextRulesMixin
    definition_uri: https://inkind-at.github.io/inkind-knowledge-repo/ClothingContextRulesMixin
    description: lc-* rules for the Clothing category only. Mixed into ClothingPhysicalItemMixin
      (categories/clothing.yaml) and DonationItem's real ClothingItem subclass (entities/donation_item.yaml).
    from_schema: https://inkind-at.github.io/inkind-knowledge-repo/categories/_context_rules
    mixin: true
    class_uri: inkind_knowledge_repo:ClothingContextRulesMixin
    rules:
    - preconditions:
        slot_conditions:
          lifecycle_state:
            name: lifecycle_state
            equals_string: sorted
          subcategory:
            name: subcategory
            any_of:
            - equals_string: tops
            - equals_string: bottoms
            - equals_string: outerwear
            - equals_string: nightwear
      postconditions:
        slot_conditions:
          is_winter_suitable:
            name: is_winter_suitable
            required: true
      description: "is_winter_suitable required at sorted state for tops, bottoms,\
        \ outerwear, and nightwear. Not required for underwear (thermally neutral\
        \ base layer) or sportswear (assessed differently by the SportsItem category).\
        \ The thermal character of a garment is independent of usage \u2014 sorters\
        \ assess what they hold."
      title: lc-sorted-clothing-is-winter-suitable-required
    - preconditions:
        slot_conditions:
          usage:
            name: usage
            equals_string: used
          lifecycle_state:
            name: lifecycle_state
            equals_string: sorted
      postconditions:
        slot_conditions:
          condition_grade:
            name: condition_grade
            required: true
      description: For used clothing (usage = used), condition_grade is required.
      title: lc-used-clothing-condition-grade-required
    - preconditions:
        slot_conditions:
          lifecycle_state:
            name: lifecycle_state
            equals_string: sorted
      postconditions:
        slot_conditions:
          demographic:
            name: demographic
            required: true
      description: demographic required at sorted state for all ClothingItem instances.
        Drives demand signal matching (e.g. "adult female tops, size M").
      title: lc-sorted-clothing-demographic-required
    - preconditions:
        slot_conditions:
          lifecycle_state:
            name: lifecycle_state
            equals_string: sorted
      postconditions:
        slot_conditions:
          size:
            name: size
            required: true
      description: size required at sorted state. Drives demand signal matching and
        storage slot assignment.
      title: lc-sorted-clothing-size-required
    - preconditions:
        slot_conditions:
          lifecycle_state:
            name: lifecycle_state
            equals_string: sorted
      postconditions:
        slot_conditions:
          subcategory:
            name: subcategory
            required: true
      description: "subcategory required at sorted state. Drives demand signal matching,\
        \ UC rule evaluation (underwear constraints), and storage routing. Not required\
        \ at received state \u2014 category is known but subcategory is determined\
        \ during sorting."
      title: lc-sorted-clothing-subcategory-required
  AccessoriesContextRulesMixin:
    name: AccessoriesContextRulesMixin
    definition_uri: https://inkind-at.github.io/inkind-knowledge-repo/AccessoriesContextRulesMixin
    description: lc-* rules for the Accessories category only. Mixed into AccessoriesPhysicalItemMixin
      (categories/accessories.yaml) and DonationItem's real AccessoriesItem subclass.
