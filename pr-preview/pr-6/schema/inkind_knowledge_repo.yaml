    see_also:
    - schema:material
    permissible_values:
      leather:
        text: leather
        description: Genuine or faux leather (PU/synthetic leather). Predominant material
          for bags, belts, wallets, and some gloves and watch straps. Requires specialist
          conditioning care.
        annotations:
          label_en:
            tag: label_en
            value: Leather / Faux Leather
          label_de:
            tag: label_de
            value: Leder / Kunstleder
          aliases_en:
            tag: aliases_en
            value: '[''Leather'', ''Faux Leather'', ''PU Leather'', ''Synthetic Leather'']'
          aliases_de:
            tag: aliases_de
            value: '[''Leder'', ''Kunstleder'', ''PU Leder'', ''Synthetisches Leder'']'
        see_also:
        - pto:Leather
      wool:
        text: wool
        description: Wool, merino, cashmere, or wool-dominant blend. Primary material
          for scarves, hats, and gloves. Allergen signal for wool-sensitive beneficiaries.
        annotations:
          label_en:
            tag: label_en
            value: Wool
          label_de:
            tag: label_de
            value: Wolle
          aliases_en:
            tag: aliases_en
            value: '[''Wool'', ''Merino'', ''Cashmere'']'
          aliases_de:
            tag: aliases_de
            value: '[''Wolle'', ''Merino'', ''Camel'']'
        see_also:
        - pto:Wool
      cotton:
        text: cotton
        description: Cotton or cotton-dominant woven fabric. Common in fabric hats,
          canvas bags, and some gloves and scarves. All-season versatile.
        annotations:
          label_en:
            tag: label_en
            value: Cotton / Canvas Fabric
          label_de:
            tag: label_de
            value: Baumwolle / Segeltuch
          aliases_en:
            tag: aliases_en
            value: '[''Cotton'', ''Canvas Fabric'']'
          aliases_de:
            tag: aliases_de
            value: '[''Baumwolle'', ''Segeltuch'']'
        see_also:
        - pto:Cotton
      silk:
        text: silk
        description: Silk or silk-blend. Typical for elegant scarves and ties. Requires
          specialist care (hand wash or dry clean).
        annotations:
          label_en:
            tag: label_en
