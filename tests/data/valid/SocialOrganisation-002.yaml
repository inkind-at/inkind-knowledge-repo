id: https://hdfp.at/#org
name: "Haus der Frau - Verein zur Hilfe für Frauen und Kinder in Notsituationen"
is_active: true
mission_statement: >-
  Schutz, Unterkunft, Beratung und Begleitung für Frauen und ihre Kinder, die
  von häuslicher und sexualisierter Gewalt betroffen oder bedroht sind —
  unabhängig von Nationalität, Religion oder Einkommen. Krisenaufnahme rund
  um die Uhr; Platz für 18 Frauen und ihre Kinder, begleitet durch
  Sozialarbeiterinnen und Sozialpädagoginnen.
