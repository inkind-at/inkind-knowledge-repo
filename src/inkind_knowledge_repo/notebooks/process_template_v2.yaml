      - {step_type: set_attributes, sequence: 4, is_optional: false}

  - id: inkind_knowledge_repo:process_template/register_demand_signal_urgent
    label: Register urgent demand signal
    process_path_type: demand_signal_urgent
    entity_type: demand_signal
    launchable_from_states: [draft]
    completeness_tier: minimal
    is_default: false
    estimated_duration_minutes: 1.0
    preconditions: []
    category_affinity: []
    variant_of: inkind_knowledge_repo:process_template/register_demand_signal
    steps:
      - {step_type: set_category,    sequence: 1, is_optional: false}
      - {step_type: set_signal_type, sequence: 2, is_optional: false}
      - {step_type: set_priority,    sequence: 3, is_optional: false}
      - {step_type: set_attributes,  sequence: 4, is_optional: false}
...
