---
id: https://inkind-at.github.io/inkind-knowledge-repo/donation_item
name: donation_item
title: Donation Item Schema
description: >-
  All donation item types in a single schema file.

  DonationItem is abstract; ClothingItem, FurnitureItem, etc. are its real
  is_a concrete subclasses, declared below with class-specific slots/enums
  and rules coming from mixins, not local declarations. Each subclass mixes
  in its category mixin (categories/*.yaml — Tier 1, or a Tier 2
  *AssessmentMixin for the six categories with assessment_result) plus that
  category's own <Category>ContextRulesMixin (categories/_context_rules.yaml)
  for lifecycle-aware (lc-*) rules.

  category's range is SortingCategoryEnum (core.yaml); dispatch for the UI
  descriptor generator is driven entirely by that enum's dispatch_to
  annotations, not by these real subclasses or designates_type.

  Category grouping is grounded in COICOP 2018 and UNHCR NFI standards; see
  core.yaml's BaseCategoryEnum for per-category references.

license: MIT
see_also:
  - https://schema.org/Product
  - https://unstats.un.org/unsd/classifications/Family/Detail/2094
  - https://emergency.unhcr.org/emergency-assistance/core-relief-items/kind-non-food-item-distribution

prefixes:
  inkind_knowledge_repo: https://inkind-at.github.io/inkind-knowledge-repo/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  cpi: http://www.ebusiness-unibw.org/ontologies/cpi/ns#
  pto: http://www.productontology.org/id/
  foodon: http://purl.obolibrary.org/obo/FOODON_

default_prefix: inkind_knowledge_repo
default_range: string

imports:
  - linkml:types
  - ../core
  - ../categories/clothing
  - ../categories/accessories
  - ../categories/footwear
  - ../categories/furniture
  - ../categories/bedding_textiles
  - ../categories/household
  - ../categories/electronics
  - ../categories/toys
  - ../categories/sports
  - ../categories/books
  - ../categories/stationery
  - ../categories/personal_care
  - ../categories/mobility_aids
  - ../categories/baby_infant
  - ../categories/food
  - ../categories/other
  - ../categories/_context_rules


classes:

  # ════════════════════════════════════════════════════════════════════════════
  # Abstract base
  # ════════════════════════════════════════════════════════════════════════════

  DonationItem:
    abstract: true
    class_uri: schema:Product
    description: >-
      Abstract base for all donation items. Never instantiated directly.

      attribute_completeness is set by the fragment engine when a sorting
      episode completes; it records data quality, not episode completion
      (lifecycle_state = sorted records that — see AttributeCompletenessEnum
      in core.yaml).

      Lifecycle state machine is documented in ItemLifecycleStateEnum
      (core.yaml). Transitions are enforced by Django model clean(); the
      sorting_in_progress state prevents concurrent edits by two sorters.
    see_also:
      - schema:Product
    slots:
      - id
      - usage
      - category
      - lifecycle_state
      - attribute_completeness
      - donation_source
      - storage_unit
      - sorting_notes
      - created_at
      - updated_at
    slot_usage:
      category:
        range: SortingCategoryEnum
        required: true
      lifecycle_state:
        range: ItemLifecycleStateEnum
        required: true
      usage:
        range: ItemUsageEnum
        required: false
      attribute_completeness:
        range: AttributeCompletenessEnum
        required: false
      source_collection:
        range: DonationCollection
        required: false
      donation_source:
        range: DonationSource
        required: false
      storage_unit:
        range: StorageLocation
        required: false
    annotations:
      completeness_minimal:  "category"
      completeness_standard: "category, usage, sorting_notes"
      completeness_detailed: "category, usage, donation_source, sorting_notes"
      label_en: "Donation Item"
      label_de: "Spendenartikel"

  # ════════════════════════════════════════════════════════════════════════════
  # APPAREL GROUP — COICOP Division 03 (Clothing and footwear)
  # ════════════════════════════════════════════════════════════════════════════

  ClothingItem:
    is_a: DonationItem
    mixins:
      - ClothingCategory
      - ClothingContextRulesMixin
    class_uri: cpi:ClothingAndAccessories
    description: >-
      Clothing garments: tops, bottoms, outerwear, underwear, nightwear,
      sportswear. COICOP 03.1. Assessment: condition_grade (wear grade).
    see_also:
      - http://www.ebusiness-unibw.org/ontologies/cpi/ns#ClothingAndAccessories


  AccessoriesItem:
    is_a: DonationItem
    mixins:
      - AccessoriesCategory
      - AccessoriesContextRulesMixin
    class_uri: pto:Fashion_accessory
    description: >-
      Fashion and personal accessories: hats, scarves, gloves, belts, bags,
      jewellery, sunglasses, watches. COICOP 03.1, grouped with clothing but
      kept separate here — no demographic→size value map, no clothing UC
      rules, simpler age-only AccessoriesDemographicEnum. Assessment:
      condition_grade (wear grade).
    see_also:
      - http://www.productontology.org/id/Fashion_accessory


  FootwearItem:
    is_a: DonationItem
    mixins:
      - FootwearCategory
      - FootwearContextRulesMixin
    class_uri: pto:Footwear
    description: >-
      Footwear: shoes, boots, sandals, slippers. COICOP 03.2. Separated from
      ClothingItem for shoe-specific sizing (EU/UK/US/CM) and pair
      completeness. Assessment: condition_grade (wear grade).
    see_also:
      - http://www.productontology.org/id/Footwear


  # ════════════════════════════════════════════════════════════════════════════
  # HOME GROUP — COICOP Division 05 (Housing, water, household goods)
  # ════════════════════════════════════════════════════════════════════════════

  FurnitureItem:
    is_a: DonationItem
    mixins:
      - FurnitureAssessmentMixin
      - FurnitureContextRulesMixin
    class_uri: pto:Furniture
    description: >-
      Structural furniture: chairs, tables, beds, wardrobes, shelving.
      COICOP 05.1. Assessment: FurnitureAssessmentEnum — structural
      soundness is the primary redistribution signal (a scratched but solid
      chair is redistributable; a wobbly but clean one is not).
      assessment_result required regardless of usage since flatpack
      furniture can have assembly/manufacturing defects.
    see_also:
      - http://www.productontology.org/id/Furniture


  BeddingTextilesItem:
    is_a: DonationItem
    mixins:
      - BeddingAssessmentMixin
      - BeddingContextRulesMixin
    class_uri: pto:Bedding
    description: >-
      Bedding and household textiles: blankets, duvets, mattresses, pillows,
      sleeping bags, towels, curtains. COICOP 05.2. Separated from
      HouseholdItem — UNHCR NFI standards list blankets/sleeping mats as
      core relief items, and hygiene assessment differs from wear grading.
      Assessment: BeddingAssessmentEnum (hygiene primary signal — a worn but
      clean blanket is redistributable, a stained mattress is not).
      assessment_result required regardless of usage.
    see_also:
      - http://www.productontology.org/id/Bedding
      - https://emergency.unhcr.org/emergency-assistance/core-relief-items/kind-non-food-item-distribution


  HouseholdItem:
    is_a: DonationItem
    mixins:
      - HouseholdCategory
      - HouseholdContextRulesMixin
    class_uri: pto:Household_goods
    description: >-
      Household and kitchen goods: cookware, crockery, small appliances,
      cleaning tools, home decor, garden tools. COICOP 05.3–05.5. Bedding
      and textiles (05.2) are BeddingTextilesItem, not this class.
      Assessment: condition_grade (wear grade).
    see_also:
      - http://www.productontology.org/id/Household_goods


  # ════════════════════════════════════════════════════════════════════════════
  # TECHNOLOGY GROUP — COICOP Division 09 (Recreation and culture)
  # ════════════════════════════════════════════════════════════════════════════

  ElectronicsItem:
    is_a: DonationItem
    mixins:
      - ElectronicsAssessmentMixin
      - ElectronicsContextRulesMixin
    class_uri: pto:Consumer_electronics
    description: >-
      Consumer electronics: phones, tablets, laptops, cameras, audio devices,
      cables, gaming consoles. COICOP 09.1–09.2. Assessment:
      ElectronicsAssessmentEnum — functional state is the primary
      redistribution signal (a cracked-screen phone that works beats a
      pristine one that doesn't). assessment_result required regardless of
      usage. Data wiping is enforced by the fragment engine, not a schema rule.
    see_also:
      - http://www.productontology.org/id/Consumer_electronics


  ToysItem:
    is_a: DonationItem
    mixins:
      - ToysCategory
      - ToysContextRulesMixin
    class_uri: pto:Toy
    description: >-
      Toys and games. COICOP 09.3. Age grading follows EU Toy Safety
      Directive 2009/48/EC; the small-parts choking-hazard UC rule also
      references ASTM F963. Assessment: condition_grade (wear grade).
    see_also:
      - http://www.productontology.org/id/Toy
      - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32009L0048


  SportsItem:
    is_a: DonationItem
    mixins:
      - SportsProtectiveAssessmentMixin
      - SportsContextRulesMixin
    class_uri: pto:Sporting_goods
    description: >-
      Sports and fitness equipment. COICOP 09.4. Bicycles are placed here by
      domain convention (COICOP assigns them to Division 07). Dual-track
      assessment: protective_gear subcategory uses
      SportsProtectiveAssessmentEnum (wear grade can't catch impact damage
      not visible under an intact shell); everything else uses
      condition_grade.
    see_also:
      - http://www.productontology.org/id/Sporting_goods


  # ════════════════════════════════════════════════════════════════════════════
  # LEARNING GROUP — COICOP Division 09 (Recreation and culture)
  # ════════════════════════════════════════════════════════════════════════════

  BooksItem:
    is_a: DonationItem
    mixins:
      - BooksCategory
      - BooksContextRulesMixin
    class_uri: schema:Book
    description: >-
      Books and educational materials. COICOP 09.5. No demographic/size
      dimension — age_range (BookAgeRangeEnum) is broader and non-gendered.
      Assessment: condition_grade (wear grade).
    see_also:
      - schema:Book


  StationeryItem:
    is_a: DonationItem
    mixins:
      - StationeryCategory
      - StationeryContextRulesMixin
    class_uri: pto:Stationery
    description: >-
      Stationery and office supplies: pens, notebooks, art supplies,
      calculators. COICOP 09.5. Separated from BooksItem — different sorting
      paths, condition vocabulary, and demand patterns. Assessment:
      condition_grade (wear grade).
    see_also:
      - http://www.productontology.org/id/Stationery


  # ════════════════════════════════════════════════════════════════════════════
  # CARE GROUP — COICOP Divisions 06 (Health) + 12 (Personal care)
  # ════════════════════════════════════════════════════════════════════════════

  PersonalCareItem:
    is_a: DonationItem
    mixins:
      - PersonalCareCategory
      - PersonalCareContextRulesMixin
    class_uri: pto:Personal_hygiene
    description: >-
      Personal care, hygiene, and health products. Merges COICOP 06.1 and
      12.1 — the operative safety rules (sealed required, used tools
      blocked, expiry enforced) are identical across both. Assessment:
      is_sealed + expiry_date, no condition_grade — a wear grade is
      meaningless for a tube of toothpaste.
    see_also:
      - http://www.productontology.org/id/Personal_hygiene
      - http://www.productontology.org/id/Cosmetics
      - https://company.auntbertha.com/openeligibility/


  MobilityAidsItem:
    is_a: DonationItem
    mixins:
      - MobilityAssessmentMixin
      - MobilityAidsContextRulesMixin
    class_uri: pto:Assistive_technology
    description: >-
      Mobility aids and assistive devices: wheelchairs, crutches, walking
      frames, hearing aids, orthotics, daily living aids. COICOP 06.1.3 and
      06.2. Assessment: MobilityAssessmentEnum, capturing structural
      soundness, functional state, and body-contact hygiene in one enum.
      assessment_result required regardless of usage.
    see_also:
      - http://www.productontology.org/id/Assistive_technology
      - https://company.auntbertha.com/openeligibility/


  # ════════════════════════════════════════════════════════════════════════════
  # LIFE STAGE GROUP
  # ════════════════════════════════════════════════════════════════════════════

  BabyInfantItem:
    is_a: DonationItem
    mixins:
      - BabyEquipmentAssessmentMixin
      - BabyInfantContextRulesMixin
    class_uri: pto:Baby_transport
    description: >-
      Baby and infant supplies: pushchairs, cots, car seats, infant formula,
      feeding bottles, baby monitors, bath equipment. Baby clothing belongs
      in ClothingItem (demographic=baby). Treated as a first-class category
      (COICOP otherwise scatters these across Divisions 01/03/05), following
      Open Eligibility and UNHCR NFI kit practice.

      Three-track assessment: Track 1 — safety-critical equipment
      (BabyEquipmentAssessmentEnum): pushchairs, cots, car seats, carriers,
      high chairs, sleeping bags (EN 1888/716/14344/16781). Baby sleeping
      bags are Track 1, not BeddingTextilesItem, since EN 16781 differs from
      adult sleeping-bag hygiene checks. Track 2 — consumables (is_sealed +
      expiry_date): infant formula, feeding bottles/teats, baby food.
      Track 3 — general gear (condition_grade): bath, changing, monitors,
      bouncers.
    see_also:
      - http://www.productontology.org/id/Baby_transport
      - http://www.productontology.org/id/Infant_bed
      - https://company.auntbertha.com/openeligibility/
      - https://emergency.unhcr.org/emergency-assistance/core-relief-items/kind-non-food-item-distribution


  FoodItem:
    is_a: DonationItem
    mixins:
      - FoodCategory
      - FoodContextRulesMixin
    class_uri: foodon:00001006
    description: >-
      Food donation item. COICOP Division 01. Phase 1 stub — fully declared
      to establish the schema; the sort_food process path activates once
      food-bank organisations are onboarded. Assessment: packaging_intact +
      expiry_date — food safety is binary, no condition_grade.
    see_also:
      - foodon:00001006
      - http://purl.obolibrary.org/obo/foodon.owl


  # ════════════════════════════════════════════════════════════════════════════
  # CATCH-ALL
  # ════════════════════════════════════════════════════════════════════════════

  OtherItem:
    is_a: DonationItem
    mixins:
      - OtherCategory
      - OtherContextRulesMixin
    class_uri: schema:Product
    description: >-
      Catch-all for donation items not fitting any other category.
      Minimal slots only (item_description + condition_grade), via
      OtherCategory (categories/other.yaml). Use sparingly: if a new item
      type appears frequently in operations, it warrants a proper subclass
      with a category mixin and dedicated sorting fragment rather than
      accumulating in OtherItem.


# ── Slots declared in this schema ─────────────────────────────────────────────

slots:

  source_collection:
    range: DonationCollection
    description: >-
      FK — the DonationCollection (arrival type) this item was registered from.
      Null for items not arriving as part of a collection.

  storage_unit:
    range: StorageLocation
    description: >-
      FK — set when lifecycle_state transitions to stored.
      Null until the item reaches stored state.