---
id: https://inkind-at.github.io/inkind-knowledge-repo/demand_signal
name: demand_signal
title: Demand Signal Schema
description: >-
  Demand-side entity — what an organisation wants.  Unifies standing stock
  interests and time-bounded campaign requests under one model with a
  `signal_type` discriminator.
license: MIT
see_also:
  - http://schema.org/Demand

prefixes:
  inkind_knowledge_repo: https://inkind-at.github.io/inkind-knowledge-repo/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  openeligibility: https://openeligibility.org/

default_prefix: inkind_knowledge_repo
default_range: string

imports:
  - linkml:types
  - ../core
  - ../categories/clothing
  - ../categories/accessories
  - ../categories/footwear
  - ../categories/furniture
  - ../categories/bedding_textiles
  - ../categories/household
  - ../categories/electronics
  - ../categories/toys
  - ../categories/sports
  - ../categories/books
  - ../categories/stationery
  - ../categories/personal_care
  - ../categories/mobility_aids
  - ../categories/baby_infant
  - ../categories/food
  - ../categories/other

classes:

  DemandSignal:
    description: >-
      A signal representing demand for a category of items.  Covers standing
      interests, time-bounded campaigns, and specific beneficiary requests
      under a single unified model.

      category's range is BaseCategoryEnum (core.yaml) — dispatch_to
      resolves to the bare Tier 1 category mixin only, since a demand
      signal describes what's wanted, not a physical item in hand:
      assessment_result and lifecycle_state-gated visibility never apply
      here.
    slots:
      - id
      - category
      - urgency_tier
      - household_situation
      - lifecycle_state
    see_also:
      - schema:Demand
    slot_usage:
      org:
        range: SocialOrganisation
        required: true
      category:
        range: BaseCategoryEnum
        required: true
        see_also:
          - openeligibility:ServiceTag
      lifecycle_state:
        range: DemandSignalLifecycleEnum
        required: true
      urgency_tier:
        range: UrgencyTierEnum
        required: false
        see_also:
          - openeligibility:HumanSituation
    annotations:
      completeness_minimal: "category"
      completeness_standard: "urgency_tier, household_situation"

slots:

  signal_type:
    range: DemandSignalTypeEnum
    required: true
    description: >-
      Discriminator — standing (permanent interest), campaign (time-bounded),
      or specific (concrete beneficiary request).

  urgency_tier:
    range: UrgencyTierEnum
    description: >-
      Urgency classification.  Null for standing signals; set for campaign and
      specific types.

  household_situation:
    range: HouseholdSituationEnum
    description: >-
      Household composition of the beneficiary/holder this signal concerns —
      informs suitability of matched items.
    annotations:
      label_en: "Household situation"
      label_de: "Haushaltsform"

enums:

  DemandSignalTypeEnum:
    description: >-
      Discriminator for the type of demand signal.
    permissible_values:
      standing:
        description: >-
          Permanent standing interest in a category.  No deadline, no quantity
          target.  Stays active until explicitly withdrawn.
      campaign:
        description: >-
          Time-bounded coordinated effort tied to a Campaign.  Has deadline
          and quantity target.
      specific:
        description: >-
          Concrete request for a specific beneficiary or holder.  Has urgency
          tier.

  UrgencyTierEnum:
    description: Urgency classification for campaign and specific demand signals.
    permissible_values:
      low:
        description: "Low urgency — no immediate deadline pressure."
        annotations:
          label_en: "Low"
          label_de: "Niedrig"
          hint_en: "4+ weeks"
          hint_de: "4+ Wochen"
          color_hint: "info"
          deadline_days: 28
      medium:
        description: "Medium urgency."
        annotations:
          label_en: "Medium"
          label_de: "Mittel"
          hint_en: "within 2 weeks"
          hint_de: "innerhalb 2 Wochen"
          color_hint: "amber"
          deadline_days: 14
      high:
        description: "High urgency — deadline approaching or need is acute."
        annotations:
          label_en: "High"
          label_de: "Hoch"
          hint_en: "within 1 week"
          hint_de: "innerhalb 1 Woche"
          color_hint: "warm_red"
          deadline_days: 7
      critical:
        description: "Critical — immediate fulfilment required."
        annotations:
          label_en: "Critical"
          label_de: "Kritisch"
          hint_en: "within 3 days"
          hint_de: "innerhalb 3 Tage"
          color_hint: "warm_red"
          deadline_days: 3
          triggers_notification: true

  HouseholdSituationEnum:
    description: Household composition classification for a demand signal.
    permissible_values:
      single_adult:
        description: "Single adult household."
        annotations:
          label_en: "Single adult"
          label_de: "Einzelpersonen"
      couple_no_children:
        description: "Couple without children."
        annotations:
          label_en: "Couple without children"
          label_de: "Paar ohne Kinder"
      single_parent:
        description: "Single parent with one or more children."
        annotations:
          label_en: "Single parent"
          label_de: "Alleinerziehende"
      family_with_children:
        description: "Family with two parents/carers and one or more children."
        annotations:
          label_en: "Family with children"
          label_de: "Familie mit Kindern"
      multigenerational:
        description: "Household spanning multiple generations."
        annotations:
          label_en: "Multigenerational"
          label_de: "Mehrgenerationenhaushalte"
      other:
        description: "Household composition not covered by the above."
        annotations:
          label_en: "Other"
          label_de: "Andere"

  DemandSignalLifecycleEnum:
    description: >-
      Lifecycle states for a DemandSignal.  Standing signals stay `active`
      permanently; campaign and specific signals follow the full lifecycle.
    permissible_values:
      active:
        description: Signal is active and accepting matched items.
      partially_fulfilled:
        description: Some items matched but quantity_requested not yet reached.
      fulfilled:
        description: All requested items matched.
      expired:
        description: >-
          Deadline passed without full fulfilment (campaign/specific types
          only).
      withdrawn:
        description: Organisation explicitly cancelled this signal.
...
