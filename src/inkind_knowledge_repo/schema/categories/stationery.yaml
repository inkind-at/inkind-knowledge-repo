---
id: https://inkind-at.github.io/inkind-knowledge-repo/categories/stationery
name: stationery
title: Stationery & Office Supplies Category Schema
description: >-
  Defines StationeryCategory mixin applied to StationeryItem. COICOP
  Division 09.5 (grouped with books by COICOP; kept separate here —
  different sorting paths and condition vocabularies: "poor condition"
  means worn pages for a book, dried-out ink for a pen). Ontology
  grounding: Product Types Ontology (pto:Stationery and per-subcategory
  IRIs).

  Assessment: condition_grade (wear grade). No UC block rules —
  condition_grade=poor captures unusable items; sorters use judgement for
  partially-used consumables.

license: MIT
see_also:
  - http://www.productontology.org/id/Stationery
  - https://unstats.un.org/unsd/classifications/Family/Detail/2094

prefixes:
  inkind_knowledge_repo: https://inkind-at.github.io/inkind-knowledge-repo/
  linkml: https://w3id.org/linkml/
  pto: http://www.productontology.org/id/

default_prefix: inkind_knowledge_repo
default_range: string

imports:
  - linkml:types
  - ./_base
  - ./_context_rules


classes:

  StationeryPhysicalItemMixin:
    mixin: true
    is_a: StationeryCategory
    mixins: [StationeryContextRulesMixin]
    description: >-
      Shared physical-item dispatch target for the Stationery category,
      used identically by DonationItem, StorageCollection, and
      SortedCollection. Pure composition — no slots or rules of its own.

  StationeryCategory:
    mixin: true
    is_a: CategoryMixin
    description: >-
      Mixin for stationery and office supply slots.
      Applied to StationeryItem via mixins: [StationeryCategory].
    see_also:
      - http://www.productontology.org/id/Stationery
    slots:
      - subcategory
      - is_set_complete
      - condition_grade
    slot_usage:
      subcategory:
        range: StationerySubcategoryEnum
        required: true
      condition_grade:
        range: UsedConditionGradeEnum
        required: false
    annotations:
      completeness_minimal:  "subcategory"
      completeness_standard: "subcategory, is_set_complete, usage, condition_grade"
      completeness_detailed: "subcategory, is_set_complete, usage, condition_grade"
      coicop_division: "09.5"
      label_en: "Stationery"
      label_de: "Schreibwaren"
      aliases_en: ["stationery"]
      aliases_de: ["Schreibwaren"]


enums:

  StationerySubcategoryEnum:
    description: Stationery and office supply subcategories.
    permissible_values:
      pens_pencils:           {description: "Ballpoint pens, pencils, felt-tips, highlighters, markers.", see_also: [pto:Pen], annotations: {label_en: "Pens & Pencils", label_de: "Stifte & Bleistifte", aliases_en: ["Pen", "Pencil", "Writing Instrument", "Highlighter", "Marker"], aliases_de: ["Stift", "Schreibgeräte", "Bleistift", "Textmarker", "Marker"]}}
      writing_sets:           {description: "Pencil cases, pen sets, calligraphy sets.", annotations: {label_en: "Writing Sets", label_de: "Schreibsets", aliases_en: ["Writing Set", "Pen Set", "Pencil Case", "Calligraphy Set"], aliases_de: ["Schreibset", "Federmäppchen", "Kalligraphie-Set"]}}
      notebooks_paper:        {description: "Notebooks, exercise books, loose-leaf paper, drawing pads.", see_also: [pto:Notebook], annotations: {label_en: "Notebooks & Paper", label_de: "Notizbücher & Papier", aliases_en: ["Notebook", "Exercise Book", "Loose-Leaf Paper", "Drawing Pad"], aliases_de: ["Notizbuch", "Übungsbuch", "Losblatt-Papier", "Zeichnungsblock"]}}
      envelopes_cards:        {description: "Envelopes, postcards, greeting cards.", annotations: {label_en: "Envelopes & Cards", label_de: "Briefumschläge & Karten", aliases_en: ["Envelope", "Card", "Postcard", "Greeting Card"], aliases_de: ["Briefumschlag", "Karte", "Postkarte", "Grußkarte"]}}
      folders_binders:        {description: "Ring binders, lever arch files, document wallets.", see_also: [pto:Binder], annotations: {label_en: "Folders & Binders", label_de: "Ordner & Mappen", aliases_en: ["Folder", "Binder", "Ring Binder", "Lever Arch File", "Document Wallet"], aliases_de: ["Ordner", "Mappe", "Ringordner", "Hebelordner", "Dokumentenmappe"]}}
      organisers:             {description: "Desk organisers, filing trays, clipboards, planners, diaries.", annotations: {label_en: "Organisers & Planners", label_de: "Planer & Kalender", aliases_en: ["Organiser", "Planner", "Desk Organiser", "Filing Tray", "Clipboard", "Planner", "Diary"], aliases_de: ["Organizer", "Planer", "Schreibtisch-Organizer", "Ablagekorb", "Klemmbrett", "Planer", "Tagebuch"]}}
      art_supplies:           {description: "Paints, brushes, colouring pencils, pastels, canvases.", see_also: [pto:Art_supply], annotations: {label_en: "Art & Drawing Supplies", label_de: "Mal- & Zeichenbedarf", aliases_en: ["Art Supply", "Paint", "Brush", "Colouring Pencil", "Pastel", "Canvas"], aliases_de: ["Kunstbedarf", "Farbe", "Pinsel", "Buntstift", "Pastellkreide", "Leinwand"]}}
      craft_supplies:         {description: "Scissors, glue, tape, staplers, hole punches, rulers.", annotations: {label_en: "Craft Supplies", label_de: "Bastelbedarf", aliases_en: ["Craft Supply", "Scissors", "Glue", "Tape", "Stapler", "Hole Punch", "Ruler"], aliases_de: ["Bastelbedarf", "Schere", "Kleber", "Klebeband", "Tacker", "Locher", "Lineal"]}}
      calculators:            {description: "Scientific, graphing, and basic calculators.", see_also: [pto:Calculator], annotations: {label_en: "Calculators", label_de: "Taschenrechner", aliases_en: ["Calculator", "Scientific Calculator", "Graphing Calculator", "Basic Calculator"], aliases_de: ["Taschenrechner", "Wissenschaftlicher Taschenrechner", "Grafikrechner", "Einfacher Taschenrechner"]}}
      office_equipment_small: {description: "Staplers, hole punches, sharpeners, correction tape.", annotations: {label_en: "Small Office Supplies", label_de: "Bürobedarf", aliases_en: ["Small Office Equipment", "Small Office Supplies", "Stapler", "Hole Punch", "Sharpener", "Correction Tape"], aliases_de: ["Bürobedarf", "Kleine Bürogeräte", "Tacker", "Locher", "Anspitzer", "Korrekturband"]}}
      storage_supplies:       {description: "Labels, sticky notes, index cards, dividers.", annotations: {label_en: "Storage & Organisation Supplies", label_de: "Ordnung & Ablage", aliases_en: ["Storage and Organisation Supplies", "Label", "Sticky Note", "Index Card", "Divider"], aliases_de: ["Lager- und Organisationsbedarf", "Ablage", "Etikett", "Haftnotiz", "Karteikarte", "Trennblatt"]}}
      other:                  {description: "Stationery not fitting above subcategories.", annotations: {label_en: "Other Stationery", label_de: "Sonstige Schreibwaren"}}
