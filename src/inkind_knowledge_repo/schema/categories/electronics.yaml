---
id: https://inkind-at.github.io/inkind-knowledge-repo/categories/electronics
name: electronics
title: Electronics Category Schema
description: >-
  Defines ElectronicsCategory mixin applied to ElectronicsItem. COICOP
  Division 09.1 (audio-visual, photographic, information processing
  equipment). Ontology grounding: Product Types Ontology
  (pto:Consumer_electronics and per-subcategory IRIs).

  Uses ElectronicsAssessmentEnum (functional + cosmetic) instead of
  condition_grade — functional state is the primary redistribution signal
  (a cracked-screen phone that works beats a pristine one that doesn't).
  assessment_result required regardless of usage since new devices can have
  factory defects or dead batteries. untested is valid at received state
  but blocked at sorted state (lc-sorted-electronics-not-untested).

  Data wiping is a process concern enforced by the sort_electronics fragment
  step, not a schema constraint.

license: MIT
see_also:
  - http://www.productontology.org/id/Consumer_electronics
  - https://unstats.un.org/unsd/classifications/Family/Detail/2094

prefixes:
  inkind_knowledge_repo: https://inkind-at.github.io/inkind-knowledge-repo/
  linkml: https://w3id.org/linkml/
  pto: http://www.productontology.org/id/

default_prefix: inkind_knowledge_repo
default_range: string

imports:
  - linkml:types
  - ./_base
  - ./_context_rules


classes:

  ElectronicsCategory:
    mixin: true
    is_a: CategoryMixin
    description: >-
      Mixin for electronics slots and UC rules.
      Applied to ElectronicsItem via mixins: [ElectronicsCategory].
      assessment_result and its UC rule live on ElectronicsAssessmentMixin
      (below) so DemandSignal can dispatch to this bare mixin without
      assessment content that only applies to a physical item in hand.
    see_also:
      - http://www.productontology.org/id/Consumer_electronics
    slots:
      - subcategory
      - includes_charger
      - includes_original_packaging
    slot_usage:
      subcategory:
        range: ElectronicsSubcategoryEnum
        required: true
    annotations:
      completeness_minimal:  "subcategory"
      completeness_standard: "subcategory, usage"
      completeness_detailed: "subcategory, includes_charger, includes_original_packaging, usage"
      coicop_division: "09.1"
      data_wipe_note: >-
        Data wiping is enforced by the sort_electronics process path fragment
        step, not by a UC rule in this schema.
      label_en: "Electronics"
      label_de: "Elektronik"
      aliases_en: ["electronic devices", "gadgets", "electronic"]
      aliases_de: ["Elektronikgeräte", "Gadgets", "Elektronik"]

  ElectronicsAssessmentMixin:
    mixin: true
    is_a: ElectronicsCategory
    mixins: [ElectronicsContextRulesMixin]
    description: >-
      Shared physical-item dispatch target for Electronics — used identically
      by DonationItem, StorageCollection, and SortedCollection. Adds
      assessment_result and its UC rule on top of ElectronicsCategory.
      Never used by DemandSignal.
    slots:
      - assessment_result
    slot_usage:
      assessment_result:
        range: ElectronicsAssessmentEnum
        required: true
        description: Functional and cosmetic assessment. Required regardless of usage.
    annotations:
      completeness_minimal:  "subcategory, assessment_result"
      completeness_standard: "subcategory, assessment_result, usage"
      completeness_detailed: "subcategory, assessment_result, includes_charger, includes_original_packaging, usage"
      coicop_division: "09.1"
    rules:
      - title: uc-electronics-non-functional-warn
        description: >-
          Non-functional items require sorter confirmation before redistribution.
          Applies to both new (factory defect) and used items.
          Sorter should note whether repair referral is appropriate.
          action: warn — sorting_notes required.
        preconditions:
          slot_conditions:
            assessment_result:
              equals_string: non_functional
        postconditions:
          slot_conditions:
            sorting_notes:
              required: true


slots:

  includes_charger:
    range: boolean
    description: >-
      Whether a compatible charger is included. Affects redistribution value —
      a device without a charger is significantly less useful.
      Optional — detailed completeness tier.
    annotations:
      label_en: "Includes Charger"
      label_de: "Ladegerät vorhanden"

  includes_original_packaging:
    range: boolean
    description: >-
      Whether original retail packaging is present. Optional — detailed tier.
    annotations:
      label_en: "Includes Original Packaging"
      label_de: "Originalverpackung vorhanden"


enums:

  ElectronicsAssessmentEnum:
    description: >-
      Structured functional and cosmetic assessment for electronic items.
      Combines functional state with cosmetic condition in one vocabulary.
      Required at sorting regardless of usage — new devices can have defects.
    permissible_values:
      fully_functional:
        description: >-
          Powers on; all features operate correctly; cosmetic condition
          good or better. Ready for redistribution.
          Appropriate for new items with no observed defects.
        annotations:
          label_en: "Fully Functional"
          label_de: "Voll funktionsfähig"
      functional_minor_cosmetic:
        description: >-
          Fully functional but with minor cosmetic issues (light scratches,
          small scuffs) that do not affect operation. Redistributable.
        annotations:
          label_en: "Functional (Minor Cosmetic)"
          label_de: "Leichte Gebrauchsspuren, funktionstüchtig"
      functional_significant_cosmetic:
        description: >-
          Fully functional but with significant cosmetic damage (cracked bezel,
          major scratches, missing casing components). Functional but appearance
          notably affected.
        annotations:
          label_en: "Functional (Significant Cosmetic)"
          label_de: "Deutliche Gebrauchsspuren, funktionstüchtig"
      functional_with_issues:
        description: >-
          Powers on but has functional issues (cracked screen still displays,
          missing key, camera not working, port not functioning). Redistributable
          with explicit description — sorting_notes required.
        annotations:
          label_en: "Functional (With Issues)"
          label_de: "Eingeschränkt funktionstüchtig"
      non_functional:
        description: >-
          Does not power on, or major functionality failure rendering it unusable.
          action: warn — sorting_notes required. Consider repair referral or
          electronics recycling.
        annotations:
          label_en: "Non-Functional"
          label_de: "Nicht funktionstüchtig"
      untested:
        description: >-
          Not yet tested. Valid only at received state — blocked at sorted state
          by lc-sorted-electronics-not-untested rule in donation_item.yaml.
        annotations:
          label_en: "Untested"
          label_de: "Nicht getestet"

  ElectronicsSubcategoryEnum:
    description: Electronics subcategories. Grounded in Product Types Ontology.
    permissible_values:
      smartphones:       {description: "Mobile phones and smartphones.", see_also: [pto:Smartphone], annotations: {label_en: "Smartphones", label_de: "Smartphones"}}
      tablets:           {description: "Tablet computers and e-readers.", see_also: [pto:Tablet_computer], annotations: {label_en: "Tablets", label_de: "Tablets"}}
      laptops:           {description: "Laptop and notebook computers.", see_also: [pto:Laptop], annotations: {label_en: "Laptops", label_de: "Laptops"}}
      desktop_computers: {description: "Desktop computers and all-in-ones.", see_also: [pto:Desktop_computer], annotations: {label_en: "Desktop Computers", label_de: "Desktop-Computer"}}
      monitors:          {description: "Computer monitors and display screens.", see_also: [pto:Computer_monitor], annotations: {label_en: "Monitors", label_de: "Monitore"}}
      cameras:           {description: "Digital cameras and camcorders.", see_also: [pto:Camera], annotations: {label_en: "Cameras", label_de: "Kameras"}}
      audio:             {description: "Headphones, speakers, radios, MP3 players.", see_also: [pto:Audio_equipment], annotations: {label_en: "Audio Equipment", label_de: "Audiogeräte"}}
      cables_chargers:   {description: "USB cables, charging adapters, power banks, extension leads.", annotations: {label_en: "Cables & Chargers", label_de: "Kabel & Ladegeräte"}}
      peripherals:       {description: "Keyboards, mice, printers, webcams.", see_also: [pto:Computer_hardware], annotations: {label_en: "Peripherals", label_de: "Peripheriegeräte"}}
      gaming:            {description: "Gaming consoles, controllers, handheld gaming devices.", see_also: [pto:Video_game_console], annotations: {label_en: "Gaming", label_de: "Gaming"}}
      other:             {description: "Electronics not fitting above subcategories.", annotations: {label_en: "Other", label_de: "Andere"}}