  ClothingMaterialEnum:
    description: >-
      Primary fibre or fabric composition of a clothing item. Records the
      predominant material; for blends, select the dominant fibre or use
      synthetic_blend. Grounded in Product Types Ontology (pto:) per-value
      IRIs and schema:material as the fallback anchor. See file header for
      the allergen-filtering / seasonality-hinting / care-matching use cases.
    see_also:
      - schema:material
    permissible_values:
      cotton:
        description: >-
          Cotton or cotton-dominant blend (>50% cotton). The most common
          natural fibre. All-season versatile; thermal weight varies by
          weave and weight (a thin cotton t-shirt vs. a heavy flannel shirt).
        see_also: [pto:Cotton]
        annotations:
          label_en: "Cotton"
          label_de: "Baumwolle"
      wool:
        description: >-
          Wool, merino, lambswool, cashmere, or wool-dominant blend.
          Primary natural indicator of winter suitability.
        see_also: [pto:Wool]
        annotations:
          label_en: "Wool"
          label_de: "Wolle"
          winter_hint: "true"
      linen:
        description: >-
          Linen (flax) fabric. Lightweight and breathable natural fibre.
          Primarily summer-weight.
        see_also: [pto:Linen]
        annotations:
          label_en: "Linen"
          label_de: "Leinen"
          winter_hint: "false"
      silk:
        description: >-
          Silk or silk-blend. Lightweight natural fibre; typically summer
          or formal wear. Requires specialist care (dry clean or hand wash).
          Fragment compiler may pre-fill is_winter_suitable=false.
        see_also: [pto:Silk]
        annotations:
          label_en: "Silk"
          label_de: "Seide"
          winter_hint: "false"
      denim:
        description: >-
          Denim (woven cotton twill). Used for jeans, jackets, and skirts.
          Seasonality varies by weight — standard denim is spring_autumn;
          heavy or lined denim may be winter-suitable. Sorter decides.
        see_also: [pto:Denim]
        annotations:
          label_en: "Denim"
          label_de: "Denim"
      leather:
        description: >-
          Leather or leather-look (genuine, PU, or faux leather).
          Primarily for outerwear (jackets, coats). Typically spring_autumn
          or winter-suitable depending on lining. Requires specialist care.
        see_also: [pto:Leather]
        annotations:
          label_en: "Leather / Faux Leather"
          label_de: "Leder / Kunstleder"
      fleece:
        description: >-
          Polar fleece or other synthetic-pile insulating fabric. Warm and
          lightweight. Fragment compiler may pre-fill is_winter_suitable=true.
          This value covers synthetic-pile fleece only — use wool for merino
          or lambswool fleece.
        see_also: [pto:Polar_fleece]
        annotations:
          label_en: "Fleece"
          label_de: "Fleece"
          winter_hint: "true"
      down:
        description: >-
          Down-filled or feather-filled insulating garments (puffer jackets,
          gilets, down coats). Fragment compiler may pre-fill
          is_winter_suitable=true.
        see_also: [pto:Down_feather]
        annotations:
          label_en: "Down / Fill"
          label_de: "Daunen"
          winter_hint: "true"
      polyester:
        description: >-
          Polyester or polyester-dominant synthetic. Common in sportswear,
          activewear, and everyday garments. All-season; thermal weight varies
          by fabric construction.
        see_also: [pto:Polyester]
        annotations:
          label_en: "Polyester"
          label_de: "Polyester"
      nylon:
        description: >-
          Nylon (polyamide) fabric. Common in sportswear, windbreakers, and
          tights. Strong, lightweight, and moisture-resistant.
        see_also: [pto:Nylon]
        annotations:
          label_en: "Nylon"
          label_de: "Nylon"
      synthetic_blend:
        description: >-
          Mixed synthetic fibres or a synthetic + natural blend where no single
          fibre dominates and a more specific value does not apply.
          Examples: polyester/spandex (activewear), nylon/cotton blends,
          acrylic/polyester blends.
        see_also: [schema:material]
        annotations:
          label_en: "Synthetic Blend"
          label_de: "Synthetische Mischung"
      other:
        description: >-
          Materials not covered above — e.g. viscose/rayon, bamboo, modal,
          technical fabrics, specialty textiles. Record the specific material
          in sorting_notes when known and intact_labels=true.
        see_also: [schema:material]
        annotations:
          label_en: "Other"
          label_de: "Andere"
