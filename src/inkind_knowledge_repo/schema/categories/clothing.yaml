---
id: https://inkind-at.github.io/inkind-knowledge-repo/categories/clothing
name: clothing
title: Clothing Category Schema
description: >-
  Defines ClothingCategory mixin applied to ClothingItem in donation_item.yaml.
  Covers wearable garments only: tops, bottoms, outerwear, underwear,
  nightwear, sportswear, swimwear. COICOP Division 03.1.

  Ontology grounding: CPI (cpi:ClothingAndAccessories) for demographic/size;
  schema.org wearable size groups/systems; Product Types Ontology (pto:) for
  ClothingMaterialEnum values; schema:material as the fallback anchor for
  values with no discrete pto: IRI.

  material (detailed tier) records predominant fibre — used for allergen
  filtering (paired with intact_labels), seasonality hinting (wool/fleece/
  down → winter; linen/silk → summer, sorter can override), and care-need
  matching (silk/leather).

  Separated from AccessoriesItem — no demographic→size value map or
  underwear UC rules apply to accessories; see categories/accessories.yaml.

  Seasonality model: is_winter_suitable (boolean, standard tier, sorter's
  explicit call) and season (SeasonEnum, multivalued, detailed tier) are
  intentionally both present — inference from subcategory/material was
  rejected since it fails on common cases (a thin cotton top vs. a heavy
  flannel shirt are both "tops"). VM rules auto-derive is_winter_suitable
  from season at its unambiguous values (winter/summer/all_season);
  spring_autumn leaves it to the sorter.

license: MIT
see_also:
  - http://www.ebusiness-unibw.org/ontologies/cpi/ns#ClothingAndAccessories
  - https://unstats.un.org/unsd/classifications/Family/Detail/2094
  - http://www.productontology.org/id/Cotton
  - https://schema.org/material

prefixes:
  inkind_knowledge_repo: https://inkind-at.github.io/inkind-knowledge-repo/
  linkml: https://w3id.org/linkml/
  cpi: http://www.ebusiness-unibw.org/ontologies/cpi/ns#
  schema: http://schema.org/
  pto: http://www.productontology.org/id/

default_prefix: inkind_knowledge_repo
default_range: string

imports:
  - linkml:types
  - ./_base
  - ./_context_rules


classes:

  ClothingPhysicalItemMixin:
    mixin: true
    is_a: ClothingCategory
    mixins: [ClothingContextRulesMixin]
    description: >-
      Shared physical-item dispatch target for the Clothing category, used
      identically by DonationItem, StorageCollection, and SortedCollection.
      Pure composition — no slots or rules of its own.

  ClothingCategory:
    mixin: true
    is_a: CategoryMixin
    description: >-
      Mixin carrying clothing-specific slots, value maps, and UC rules.
      Applied to ClothingItem via mixins: [ClothingCategory]. Does NOT
      include accessories — see AccessoriesCategory (accessories.yaml).
      Domain-level rules only; lifecycle-aware (lc-*) rules live in
      ClothingContextRulesMixin (categories/_context_rules.yaml).
    see_also:
      - http://www.ebusiness-unibw.org/ontologies/cpi/ns#ClothingAndAccessories
    slots:
      - condition_grade
      - subcategory
      - tops_subcategory
      - bottoms_subcategory
      - material
      - is_winter_suitable
      - demographic
      - is_maternity
      - size
      - season
      - intact_labels
    slot_usage:
      subcategory:
        range: ClothingSubcategoryEnum
        required: false
        description: "Subcategory becomes a required field on DonationItem when item's lifecycle is sorted."
      tops_subcategory:
        range: TopsSubcategoryEnum
        required: false
      bottoms_subcategory:
        range: BottomsSubcategoryEnum
        required: false
      demographic:
        range: DemographicEnum
        required: false
      size:
        range: ClothingSizeEnum
        multivalued: true
        required: false
      is_winter_suitable:
        range: boolean
        required: false
        description: >-
          Whether this garment provides meaningful warmth in cold-weather
          conditions. Required at standard completeness for tops, bottoms,
          outerwear, nightwear. The sorter's direct assessment — not inferred
          from subcategory or material. The primary emergency distribution
          filter: "all winter-suitable clothing for adults."
      season:
        range: SeasonEnum
        required: false
        multivalued: true
        description: >-
          Seasonal suitability. Optional — detailed completeness tier.
          Multivalued: a garment may span seasons (e.g. spring_autumn +
          summer). VM rules auto-derive is_winter_suitable for the extreme
          values (winter, summer, all_season); spring_autumn leaves the
          sorter to set is_winter_suitable explicitly.
      material:
        range: ClothingMaterialEnum
        required: false
        description: >-
          Primary fibre or fabric composition. Optional — detailed completeness
          tier. Select the dominant fibre for blended fabrics; use
          synthetic_blend when no single synthetic dominates. Exact fibre
          percentages from legible care labels may be noted in sorting_notes.
          See ClothingMaterialEnum for full vocabulary and ontology grounding.
      condition_grade:
        range: UsedConditionGradeEnum
        required: false
    annotations:
      completeness_minimal:  "subcategory, tops_subcategory, bottoms_subcategory"
      completeness_standard: "subcategory, tops_subcategory, bottoms_subcategory, demographic, is_maternity, size, is_winter_suitable, usage, condition_grade"
      completeness_detailed: "subcategory, tops_subcategory, bottoms_subcategory, demographic, is_maternity, size, is_winter_suitable, season, material, usage, condition_grade, intact_labels"
      coicop_division: "03.1"
      material_winter_hint: >-
        Fragment compiler may pre-fill is_winter_suitable=true when
        material in [wool, fleece, down] and is_winter_suitable=false when
        material in [linen, silk]. Sorter can always override.
      season_ui_hint: >-
        Fragment compiler may pre-fill is_winter_suitable=true when
        subcategory=outerwear and is_winter_suitable=false when
        subcategory=swimwear. Sorter can override.
      label_en: "Clothing"
      label_de: "Kleidung"
      aliases_en: ["clothing", "clothes", "garment", "apparel"]
      aliases_de: ["Kleidung", "Bekleidung", "Kleidungsstück", "Apparel", "Gewand", "Kleidungsartikel"]
    rules:
      # ── UC: underwear ─────────────────────────────────────────────────────
      - title: uc-underwear-condition-block
        description: >-
          Underwear must be new or like_new condition. fair or poor graded
          underwear must not be redistributed. Reflects universal hygiene
          policy across social organisations.
          action: block, suggest: disposal.
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: underwear
            condition_grade:
              any_of:
                - equals_string: fair
                - equals_string: poor
        postconditions:
          slot_conditions:
            lifecycle_state:
              none_of:
                - equals_string: stored
                - equals_string: distributed
      - title: uc-underwear-adult-used-block
        description: >-
          Used adult underwear (adult_male or adult_female demographic) must
          not be redistributed. usage must be new. Reflects hygiene and
          dignity standards applied universally in the social sector.
          action: block.
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: underwear
            demographic:
              any_of:
                - equals_string: adult_male
                - equals_string: adult_female
            usage:
              equals_string: used
        postconditions:
          slot_conditions:
            lifecycle_state:
              none_of:
                - equals_string: stored
                - equals_string: distributed

      # ── UC: swimwear ──────────────────────────────────────────────────────
      - title: uc-swimwear-condition-block
        description: >-
          Swimwear must be new or like_new condition. fair or poor graded
          swimwear must not be redistributed. Worn against skin like
          underwear — same hygiene policy applies.
          action: block, suggest: disposal.
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: swimwear
            condition_grade:
              any_of:
                - equals_string: fair
                - equals_string: poor
        postconditions:
          slot_conditions:
            lifecycle_state:
              none_of:
                - equals_string: stored
                - equals_string: distributed
      - title: uc-swimwear-adult-used-block
        description: >-
          Used adult swimwear (adult_male or adult_female demographic) must
          not be redistributed. usage must be new. Same hygiene and dignity
          standard as adult underwear.
          action: block.
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: swimwear
            demographic:
              any_of:
                - equals_string: adult_male
                - equals_string: adult_female
            usage:
              equals_string: used
        postconditions:
          slot_conditions:
            lifecycle_state:
              none_of:
                - equals_string: stored
                - equals_string: distributed

      # ── UC: condition ─────────────────────────────────────────────────────
      - title: uc-poor-condition-block
        description: >-
          Items in poor condition should not be distributed.
          action: block, suggest: disposal.
        preconditions:
          slot_conditions:
            condition_grade:
              equals_string: poor
        postconditions:
          slot_conditions:
            lifecycle_state:
              none_of:
                - equals_string: stored
                - equals_string: distributed
      # ── LC: tops_subcategory ─────────────────────────────────────────────────────
      - title: lc-tops-subcategory-required
        description: >-
          Tops subcategory is required for tops items.
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: tops
        postconditions:
          slot_conditions:
            tops_subcategory:
              required: true
      # ── LC: bottoms_subcategory ─────────────────────────────────────────────────────
      - title: lc-bottoms-subcategory-required
        description: >-
          Bottoms subcategory is required for bottoms items.
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: bottoms
        postconditions:
          slot_conditions:
            bottoms_subcategory:
              required: true

      # ── VM: demographic value map ─────────────────────────────────────────
      - title: vm-demographic-underwear
        description: >-
          Underwear subcategory restricts demographic to baby, child,
          adult_male, adult_female. Unisex is not a valid demographic
          for underwear — underwear is always gender-specific at the
          redistribution level.
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: underwear
        postconditions:
          slot_conditions:
            demographic:
              any_of:
                - equals_string: baby
                - equals_string: child
                - equals_string: adult_male
                - equals_string: adult_female
 
      # ── VM: size maps ─────────────────────────────────────────────────────
      - title: vm-size-baby
        description: baby demographic constrains size to infant size codes.
        preconditions:
          slot_conditions:
            demographic:
              equals_string: baby
        postconditions:
          slot_conditions:
            size:
              any_of:
                - equals_string: baby_50
                - equals_string: baby_56
                - equals_string: baby_62
                - equals_string: baby_68
                - equals_string: baby_74
                - equals_string: baby_80
                - equals_string: baby_86
                - equals_string: baby_92

      - title: vm-size-child
        description: child demographic constrains size to children's size codes.
        preconditions:
          slot_conditions:
            demographic:
              equals_string: child
        postconditions:
          slot_conditions:
            size:
              any_of:
                - equals_string: child_98
                - equals_string: child_104
                - equals_string: child_110
                - equals_string: child_116
                - equals_string: child_122
                - equals_string: child_128
                - equals_string: child_134
                - equals_string: child_140
                - equals_string: child_146
                - equals_string: child_152
                - equals_string: child_158
                - equals_string: child_164
                - equals_string: child_170  
      - title: vm-size-adult
        description: adult/unisex demographics constrain size to adult size codes.
        preconditions:
          slot_conditions:
            demographic:
              any_of:
                - equals_string: adult_male
                - equals_string: adult_female
                - equals_string: unisex
        postconditions:
          slot_conditions:
            size:
              any_of:
                - equals_string: size_xs
                - equals_string: size_s
                - equals_string: size_m
                - equals_string: size_l
                - equals_string: size_xl
                - equals_string: size_xxl_plus

      # ── VM: season → is_winter_suitable auto-derivation ───────────────────
      - title: vm-season-winter
        description: >-
          season = winter implies is_winter_suitable = true.
          A garment explicitly tagged winter must be winter-suitable.
        preconditions:
          slot_conditions:
            season:
              equals_string: winter
        postconditions:
          slot_conditions:
            is_winter_suitable:
              equals_string: "true"

      - title: vm-season-not-winter-suitable
        description: >-
          is_winter_suitable = false implies that season cannot be winter and all season.
        preconditions:
          slot_conditions:
            is_winter_suitable:
              equals_string: "false"
        postconditions:
          slot_conditions:
            season:
              any_of:
                - equals_string: summer
                - equals_string: spring_autumn

      - title: vm-season-summer
        description: >-
          season = summer implies is_winter_suitable = false.
          A garment explicitly tagged summer-only is not winter-suitable.
          Note: if a sorter tags both summer and spring_autumn, the
          is_winter_suitable value is their explicit call — no rule fires.
        preconditions:
          slot_conditions:
            season:
              equals_string: summer
        postconditions:
          slot_conditions:
            is_winter_suitable:
              equals_string: "false"

      - title: vm-season-all
        description: >-
          season = all_season implies is_winter_suitable = true.
          All-season items are by definition suitable in winter.
        preconditions:
          slot_conditions:
            season:
              equals_string: all_season
        postconditions:
          slot_conditions:
            is_winter_suitable:
              equals_string: "true"

      # ── LC: maternity ─────────────────────────────────────────────────────
      - title: lc-maternity-demographic-subcategory
        description: >-
          is_maternity is only meaningful for adult female wear and category tops, bottoms, outerwear.
        preconditions:
          slot_conditions:
            demographic:
              equals_string: adult_female
            subcategory:
              any_of:
                - equals_string: tops
                - equals_string: bottoms
                - equals_string: outerwear
                - equals_string: swimwear
        postconditions:
          slot_conditions:
            is_maternity:
              required: true

slots:

  tops_subcategory:
    range: TopsSubcategoryEnum
    description: >-
      Finer-grained garment type within tops (t-shirt, shirt/blouse, sweater,
      etc.). Optional UI refinement only — not part of any completeness tier
      and carries no UC/VM rules. Shown in the sorting UI only when
      subcategory=tops.
    annotations:
      show_if: "subcategory in [tops]"
      label_en: "Tops Type"
      label_de: "Oberteil-Typ"

  bottoms_subcategory:
    range: BottomsSubcategoryEnum
    description: >-
      Finer-grained garment type within bottoms (trousers, shorts, skirt,
      etc.). Optional UI refinement only — not part of any completeness tier
      and carries no UC/VM rules. Shown in the sorting UI only when
      subcategory=bottoms.
    annotations:
      show_if: "subcategory in [bottoms]"
      label_en: "Bottoms Type"
      label_de: "Unterteil-Typ"

  size:
    range: ClothingSizeEnum
    description: >-
      Size of the clothing item. Valid values constrained by demographic
      via value map rules (vm-size-baby, vm-size-child, vm-size-adult).
      Grounded in cpi:ClothingSize and schema.org size systems.
    see_also:
      - cpi:ClothingSize
      - schema:WearableSizeGroupAdult
      - schema:WearableSizeSystemEU
    annotations:
      label_en: "Size"
      label_de: "Größe"

  is_winter_suitable:
    range: boolean
    description: >-
      Whether this item provides meaningful warmth in cold-weather conditions.
      Primary emergency distribution filter. Set explicitly by the sorter
      (fragment compiler may pre-fill as a UI hint only). Auto-derived from
      season at its unambiguous values via vm-season-* rules. Also declared
      on FootwearCategory and BeddingTextilesCategory for the same purpose.
    see_also:
      - schema:itemCondition
    annotations:
      label_en: "Winter Suitable"
      label_de: "Wintertauglich"

  season:
    range: SeasonEnum
    multivalued: true
    description: >-
      Seasonal suitability. Optional — detailed completeness tier.
      Multivalued: a garment may span seasons. Record all that apply.
      VM rules auto-derive is_winter_suitable for winter, summer, and
      all_season. spring_autumn leaves is_winter_suitable to the sorter.
    see_also:
      - schema:itemCondition
    annotations:
      label_en: "Season"
      label_de: "Saison"

  intact_labels:
    range: boolean
    description: >-
      Whether care and composition labels are present and legible.
      Improves match quality for beneficiaries with care requirements
      (e.g. allergy to certain materials). Detailed completeness tier.
    annotations:
      show_if: "subcategory in [tops, bottoms, outerwear, underwear, nightwear, sportswear, swimwear]"
      label_en: "Intact care and composition labels"
      label_de: "Pflege- und Materialetikett vorhanden"

  is_maternity:
    range: boolean
    description: >-
      Whether this garment is cut for pregnancy (belly panel, stretch
      waistband). Orthogonal to demographic and size — a maternity top
      is still demographic=adult_female, size=m_l, is_maternity=true.
      Optional, detailed completeness tier.
    annotations:
      show_if: "subcategory in [tops, bottoms, outerwear, swimwear]"
      label_en: "Maternity"
      label_de: "Umstandsmode"
      aliases_en: ["Maternity", "Pregnancy"]
      aliases_de: ["Umstandsmode", "Schwangerschaft"]

enums:

  SeasonEnum:
    description: >-
      Seasonal suitability of a clothing or footwear item. Used on
      ClothingCategory (season slot) and FootwearCategory (season slot).

      Design notes:
        - Four values only — fine enough for redistribution decisions,
          coarse enough for fast sorting.
        - spring_autumn is a single value because the thermal characteristics
          that define a transitional garment are the same regardless of
          which shoulder season it appears in.
        - all_season covers items with no meaningful seasonal constraint
          (e.g. a plain cotton t-shirt, a lightweight fleece) — distinct from
          "we don't know" (absence of the field) and from "suitable in all
          conditions including winter" (is_winter_suitable=true + all_season).
        - Multivalued: a linen blazer might be both spring_autumn and summer.
          Record all applicable values.
    permissible_values:
      winter:
        description: >-
          Primarily suitable for cold weather. Implies is_winter_suitable=true.
          Examples: heavy winter coat, thermal base layer, fleece-lined trousers,
          woollen jumper, ski jacket.
        annotations:
          label_en: "Winter"
          label_de: "Winter"
          aliases_en: ["Winter", "Padded", "Warm"]
          aliases_de: ["Winter", "Gefüttert", "Warm"]
      spring_autumn:
        description: >-
          Suitable for mild transitional seasons. Thermal weight between
          winter and summer. is_winter_suitable is sorter's call.
          Examples: light jacket, cardigan, jeans, hoodie, trench coat.
        annotations:
          label_en: "Spring/Autumn"
          label_de: "Frühling/Herbst"
          aliases_en: ["Spring", "Autumn", "Transitional"]
          aliases_de: ["Frühling", "Herbst", "Übergang"]
      summer:
        description: >-
          Suitable for warm weather; not appropriate for cold conditions.
          Implies is_winter_suitable=false.
          Examples: t-shirt, shorts, sundress, swimwear, linen top.Household and kitchen goods: cookware, crockery, small appliances,
      cleaning tools, home decor, garden tools. COICOP 05.3–05.5. Bedding
      and textiles (05.2) are BeddingTextilesItem, not this class.
      Assessment: condition_grade (wear grade).
        annotations:
          label_en: "Summer"
          label_de: "Sommer"
          aliases_en: ["Summer", "Leicht"]
          aliases_de: ["Sommer", "Light"]
      all_season:
        description: >-
          No meaningful seasonal constraint — appropriate across all seasons
          or in climate-controlled environments. Implies is_winter_suitable=true
          (all-season items are by definition usable in winter).
          Examples: underwear, plain cotton t-shirt used as a base layer,
          school uniform shirt.
        annotations:
          label_en: "All Season"
          label_de: "Ganzjährig"
          aliases_en: ["All Season", "Year-round"]
          aliases_de: ["Alle Jahreszeiten", "Ganzjährig"]

  ClothingSubcategoryEnum:
    description: >-
      Clothing garment subcategories. Accessories are NOT here —
      they are in AccessoriesSubcategoryEnum (accessories.yaml) on a separate
      item class. Separation enables clean progressive disclosure in the UI.
    see_also:
      - http://www.ebusiness-unibw.org/ontologies/cpi/ns#ClothingAndAccessories
    permissible_values:
      tops:
        description: >-
          T-shirts, shirts, blouses, sweaters, upper-body garments.
          is_winter_suitable varies widely — a linen shirt and a wool jumper
          are both tops. Sorter must set explicitly.
        see_also: [cpi:ClothingAndAccessories]
        annotations:
          label_en: "Tops"
          label_de: "Oberteile"
          aliases_en: ["Shirt", "Blouse", "T-shirt", "Sweater", "Hoodie", "Upper-body garments", "Top"]
          aliases_de: ["Hemd", "Bluse", "T-Shirt", "Wollpullover", "Hoodie", "Oberkörperkleidung", "Oberteile", "Top", "Laibel"]
      bottoms:
        description: >-
          Trousers, skirts, shorts, leggings, lower-body garments.
          is_winter_suitable varies — shorts are summer; thermal leggings are winter.
        annotations:
          label_en: "Bottoms"
          label_de: "Unterteile"
          aliases_en: ["Trousers", "Pants", "Skirt", "Shorts", "Leggings", "Lower-body garments", "Bottom"]
          aliases_de: ["Hose", "Rock", "Shorts", "Leggings", "Unterkörperkleidung", "Unterteile", "Bottom"]
      one_piece:
        description: >-
          One-piece garments: dresses, jumpsuits, rompers, overalls.
        annotations:
          label_en: "One-piece"
          label_de: "Einteiler"
          aliases_en: ["Dress", "Jumpsuit", "Romper", "Overall", "One-piece"]
          aliases_de: ["Kleid", "Jumpsuit", "Overall", "Einteiler", "Strampler"]
      outerwear:
        description: >-
          Jackets, coats, outer layers. Fragment compiler may pre-fill
          is_winter_suitable=true; sorter can override for summer-weight jackets.
        see_also: [pto:Coat]
        annotations:
          label_en: "Outerwear"
          label_de: "Oberbekleidung"
          aliases_en: ["Jacket", "Coat", "Outer layer", "Outerwear", "Parka"]
          aliases_de: ["Jacke", "Mantel", "Oberbekleidung", "Parka"]
      underwear:
        description: >-
          Underwear and intimate apparel. UC constraints apply.
          Thermal underwear should be tagged is_winter_suitable=true.
          Standard underwear → all_season / is_winter_suitable=true (base layer).
        annotations:
          label_en: "Underwear"
          label_de: "Unterwäsche"
          aliases_en: ["Underwear", "Undies", "Panties", "Bras"]
          aliases_de: ["Unterhose", "Unterhosen", "BH", "BHs", "Unterwäsche"]
      nightwear:
        description: >-
          Pyjamas, nightgowns, dressing gowns, sleep sets.
          Seasonal weight varies — lightweight vs. fleece nightwear.
        annotations:
          label_en: "Nightwear"
          label_de: "Nachtwäsche"
          aliases_en: ["Pyjamas", "Nightgown", "Dressing gown", "Sleep set"]
          aliases_de: ["Pyjama", "Nachtanzug", "Bademantel", "Schlafset"]
      sportswear:
        description: >-
          Athletic wear, gym tops, leggings, base layers. Non-specialist —
          specialist sports clothing (wetsuits, cycling jerseys) belongs in
          SportsItem. Swimwear is a separate subcategory — see swimwear.
        annotations:
          label_en: "Sportswear"
          label_de: "Sportbekleidung"
          aliases_en: ["Athletic wear", "Gym top", "Leggings", "Base layer"]
          aliases_de: ["Sportbekleidung", "Sportartikel", "Sportleggings", "Sporttop"]
      swimwear:
        description: >-
          Swimwear and bathing garments: swimsuits, bikinis, swim trunks,
          board shorts. Always summer-only (see SeasonEnum) — unlike
          sportswear's other examples (e.g. thermal base layers), which can
          be winter-suitable. Separated from sportswear for hygiene
          handling: worn against skin like underwear, so the same UC
          condition/usage rules apply (uc-swimwear-condition-block,
          uc-swimwear-adult-used-block).
        annotations:
          label_en: "Swimwear"
          label_de: "Bademode"
          aliases_en: ["Swimwear", "Swimsuit", "Bathing suit", "Bikini", "Swim trunks", "Board shorts"]
          aliases_de: ["Bademode", "Badebekleidung", "Badeanzug", "Bikini", "Badehose", "Schwimmhose"]
      other:
        description: Clothing garments not fitting above subcategories.
        annotations:
          label_en: "Other"
          label_de: "Andere"

  TopsSubcategoryEnum:
    description: >-
      Finer-grained garment type within the tops subcategory. UI-only
      refinement of ClothingSubcategoryEnum's tops value — not a separate
      hierarchy level, no UC/VM rules reference it.
    permissible_values:
      t_shirt:
        description: "T-shirts, tank tops."
        annotations:
          label_en: "T-Shirt"
          label_de: "T-Shirt"
          aliases_en: ["T-shirt", "Tank top"]
          aliases_de: ["T-Shirt", "Tanktop"]
