---
id: https://inkind-at.github.io/inkind-knowledge-repo/categories/toys
name: toys
title: Toys & Games Category Schema
description: >-
  Defines ToysCategory mixin applied to ToysItem. COICOP Division 09.3.
  Ontology grounding: Product Types Ontology (pto:Toy and per-subcategory
  IRIs), schema:material as fallback anchor.

  material (detailed tier) is operationally relevant under EU Toy Safety
  Directive 2009/48/EC Annex II (hazardous substances): old plastic/PVC toys
  may carry lead paint or phthalate concerns; rubber is a latex allergen
  signal; wood is a durability/demand-matching signal.

  Age grading follows the same Directive; ASTM F963 (US) is cited
  secondarily. uc-toys-small-parts-under3-block implements the Directive's
  choking-hazard requirement: toys with small parts must not be assigned to
  age_0_to_3. Assessment: condition_grade (wear grade).

license: MIT
see_also:
  - http://www.productontology.org/id/Toy
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32009L0048
  - https://unstats.un.org/unsd/classifications/Family/Detail/2094
  - https://schema.org/material

prefixes:
  inkind_knowledge_repo: https://inkind-at.github.io/inkind-knowledge-repo/
  linkml: https://w3id.org/linkml/
  pto: http://www.productontology.org/id/
  schema: http://schema.org/

default_prefix: inkind_knowledge_repo
default_range: string

imports:
  - linkml:types
  - ./_base
  - ./_context_rules


classes:

  ToysPhysicalItemMixin:
    mixin: true
    is_a: ToysCategory
    mixins: [ToysContextRulesMixin]
    description: >-
      Shared physical-item dispatch target for the Toys category, used
      identically by DonationItem, StorageCollection, and SortedCollection.
      Pure composition — no slots or rules of its own.

  ToysCategory:
    mixin: true
    is_a: CategoryMixin
    description: >-
      Mixin for toys and games slots and UC rules.
      Applied to ToysItem via mixins: [ToysCategory].
    see_also:
      - http://www.productontology.org/id/Toy
      - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32009L0048
    slots:
      - subcategory
      - material
      - age_range
      - is_set_complete
      - has_small_parts
      - condition_grade
    slot_usage:
      subcategory:
        range: ToysSubcategoryEnum
        required: true
      age_range:
        range: ToyAgeRangeEnum
        required: false
      material:
        range: ToysMaterialEnum
        required: false
        description: >-
          Primary construction material. Optional — detailed completeness
          tier.
      condition_grade:
        range: UsedConditionGradeEnum
        required: false
    annotations:
      completeness_minimal:  "subcategory"
      completeness_standard: "subcategory, age_range, is_set_complete, usage, condition_grade"
      completeness_detailed: "subcategory, material, age_range, is_set_complete, has_small_parts, usage, condition_grade"
      coicop_division: "09.3"
      regulatory_reference: "EU Toy Safety Directive 2009/48/EC; ASTM F963"
      label_en: "Toys and Games"
      label_de: "Spielzeug und Spiele"
      aliases_en: ["toys", "games"]
      aliases_de: ["Spielzeug", "Spiele"]
    rules:
      - title: uc-toys-small-parts-under3-block
        description: >-
          Toys with small parts must not be assigned to age_0_to_3.
          Implements EU Toy Safety Directive 2009/48/EC choking hazard
          requirement (also ASTM F963 for US-market toys).
          action: block.
        preconditions:
          slot_conditions:
            has_small_parts:
              equals_string: "true"
        postconditions:
          slot_conditions:
            age_range:
              any_of:
                - equals_string: age_3_to_6
                - equals_string: age_6_to_12
                - equals_string: age_12_plus
                - equals_string: adult

      - title: uc-toys-incomplete-set-warn
        description: >-
          Incomplete sets require sorter confirmation — missing pieces may
          render the toy unusable or unsafe for its intended purpose.
          action: warn — sorting_notes required.
        preconditions:
          slot_conditions:
            is_set_complete:
              equals_string: "false"
        postconditions:
          slot_conditions:
            sorting_notes:
              required: true


slots:

  has_small_parts:
    range: boolean
    description: >-
      Whether the item contains small parts posing a choking hazard.
      UC block: has_small_parts=true → age_range must exclude age_0_to_3.
      Implements EU Toy Safety Directive 2009/48/EC.
    annotations:
      label_en: "Contains Small Parts"
      label_de: "Enthält Kleinteile"


enums:

  ToysMaterialEnum:
    description: >-
      Primary construction material of a toy or game item. Operationally
      relevant under EU Toy Safety Directive 2009/48/EC Annex II (hazardous
      substance restrictions) — see per-value descriptions for specific
      chemical/allergen concerns. Grounded in pto:Wood/pto:Rubber where
      discrete IRIs exist, schema:material as fallback anchor.
    see_also:
      - schema:material
      - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32009L0048
    permissible_values:
      plastic:
        description: >-
          Plastic (various types — ABS, PP, HDPE, PVC). The most common
          primary toy material. PVC is of particular concern under the
          Directive (phthalate restrictions for toys for under-3s). Sorters
          should note in sorting_notes if item appears to be vintage PVC
          (typically pre-2005 soft plastic with characteristic flexibility
          and smell).
        see_also: [schema:material]
        annotations:
          label_en: "Plastic"
          label_de: "Kunststoff"
      wood:
        description: >-
          Solid wood or wood composite. Positive signal for durability and
          repairability. Common in building blocks, puzzles, pull toys,
          and wooden vehicles. Supports demand matching for natural-material
          toy preferences.
        see_also: [pto:Wood]
        annotations:
          label_en: "Wood"
          label_de: "Holz"
      fabric_plush:
        description: >-
          Soft fabric or plush textile. Primary material for stuffed animals,
          cloth dolls, fabric books, and cloth puzzles. Dust-mite allergen
          signal — laundering before redistribution is recommended best practice.
          Check that soft toys do not have small detachable decorative parts
          (choking hazard for age_0_to_3 — see has_small_parts).
        see_also: [schema:material]
        annotations:
          label_en: "Fabric / Plush"
          label_de: "Stoff / Plüsch"
      rubber_silicone:
        description: >-
          Rubber or silicone. Common in bath toys, teething rings, and some
          bouncy balls. Natural rubber is a known latex allergen — relevant
          for teething rings and squeeze toys for very young children
          (age_0_to_3). Synthetic rubber (TPR, TPE, silicone) is latex-free.
          Record in sorting_notes if natural rubber is identifiable.
        see_also: [pto:Rubber]
        annotations:
          label_en: "Rubber / Silicone"
          label_de: "Gummi / Silikon"
      metal:
        description: >-
          Metal (steel, aluminium, tin, die-cast alloy). Common in die-cast
          model vehicles, metal construction toys, and some board game
          pieces. Older die-cast toys may contain lead alloys — sorters
          should note in sorting_notes for visibly very old metal toys.
        see_also: [schema:material]
        annotations:
          label_en: "Metal"
          label_de: "Metall"
      cardboard_paper:
        description: >-
          Cardboard or paper. Primary material for board games, jigsaw
          puzzles, card games, memory games, and paper craft kits.
          Condition signal: check for water damage, missing pieces.
        see_also: [schema:material]
        annotations:
          label_en: "Cardboard / Paper"
          label_de: "Pappe / Papier"
      foam:
        description: >-
          Foam (EVA, polyurethane, or other foam). Common in foam building
          blocks, play mats, foam sports toys, and puzzle mats.
          Check for crumbling or deterioration — degraded foam can
          produce small particles.
        see_also: [schema:material]
        annotations:
          label_en: "Foam"
          label_de: "Schaumstoff"
      mixed:
        description: >-
          Mixed or composite materials where no single material dominates
          — e.g. a board game with a cardboard board, plastic pieces, and
          paper cards.
        see_also: [schema:material]
        annotations:
          label_en: "Mixed"
          label_de: "Materialmix"
      other:
        description: >-
          Materials not covered above. Record the specific material in
          sorting_notes when known.
        see_also: [schema:material]
        annotations:
          label_en: "Other"
          label_de: "Sonstiges"

  ToysSubcategoryEnum:
    description: Toys subcategories. Grounded in Product Types Ontology.
    permissible_values:
      construction:     {description: "Building blocks, LEGO-style, construction sets.", see_also: [pto:Construction_toy], annotations: {label_en: "Construction toys", label_de: "Bau- & Konstruktionsspielzeug", aliases_en: ["Construction Toy", "Building Blocks", "LEGO", "Construction Set"], aliases_de: ["Konstruktionsspielzeug", "Bausteine", "LEGO", "Konstruktionsset"]}}
      dolls_figures:    {description: "Dolls, action figures, puppets, plush toys.", see_also: [pto:Doll], annotations: {label_en: "Dolls & figures", label_de: "Puppen & Figuren", aliases_en: ["Doll", "Action Figure", "Puppet", "Plush Toy"], aliases_de: ["Puppe", "Actionfigur", "Puppe", "Plüschtier"]}}
      board_games:      {description: "Board games, card games, dice games.", see_also: [pto:Board_game], annotations: {label_en: "Board & card games", label_de: "Karten- & Brettspiele", aliases_en: ["Board Game", "Card Game", "Dice Game"], aliases_de: ["Brettspiel", "Kartenspiel", "Würfelspiel"]}}
      puzzles:          {description: "Jigsaw puzzles, 3D puzzles, shape sorters.", see_also: [pto:Puzzle], annotations: {label_en: "Puzzles", label_de: "Puzzles", aliases_en: ["Puzzle", "Jigsaw Puzzle", "3D Puzzle", "Shape Sorter"], aliases_de: ["Puzzle", "Puzzles", "3D-Puzzle", "Formen-Sortierer"]}}
      outdoor_toys:     {description: "Balls, kites, skipping ropes, sandpit toys.", annotations: {label_en: "Outdoor toys", label_de: "Outdoor-Spielzeug", aliases_en: ["Outdoor Toy", "Ball", "Kite", "Skipping Rope", "Sandpit Toy"], aliases_de: ["Draußen-Spielzeug", "Ball", "Drachen", "Springseil", "Sandspielzeug"]}}
      ride_on:          {description: "Tricycles, balance bikes, scooters, ride-on cars.", see_also: [pto:Ride-on_toy], annotations: {label_en: "Ride-on toys", label_de: "Kinderfahrzeuge", aliases_en: ["Ride-on Toy", "Tricycle", "Balance Bike", "Scooter", "Ride-on Car"], aliases_de: ["Rutschfahrzeug", "Dreirad", "Laufrad", "Roller", "Rutschauto"]}}
      arts_crafts:      {description: "Colouring books, craft kits, modelling clay, paint sets.", annotations: {label_en: "Arts & Crafts", label_de: "Malen & Basteln", aliases_en: ["Arts & Crafts", "Colouring Book", "Craft Kit", "Modelling Clay", "Paint Set"], aliases_de: ["Kunst & Basteln", "Malbuch", "Bastelset", "Modelliermasse", "Malkasten"]}}
      educational:      {description: "Educational games and learning toys.", see_also: [pto:Educational_toy], annotations: {label_en: "Educational toys", label_de: "Lernspielzeug", aliases_en: ["Educational Toy", "Learning Toy", "Educational Game"], aliases_de: ["Lernspielzeug", "Lernspiel", "Lernspielzeug"]}}
      plush:            {description: "Soft toys and stuffed animals.", see_also: [pto:Stuffed_animal], annotations: {label_en: "Plush toys", label_de: "Plüschtiere", aliases_en: ["Plush Toy", "Stuffed Animal", "Soft Toy"], aliases_de: ["Plüschtier", "Stofftier", "Weiches Spielzeug"]}}
      other:            {description: "Toys not fitting above subcategories.", annotations: {label_en: "Other", label_de: "Sonstiges"}}

  ToyAgeRangeEnum:
    description: >-
      Age suitability for toys. Values aligned with EU Toy Safety Directive
      2009/48/EC age-grading categories. The age_0_to_3 value is the critical
      boundary for the small parts choking hazard rule.
    see_also:
      - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32009L0048
    permissible_values:
      age_0_to_3:  {description: "0-3 years. MUST NOT have small parts (EU Toy Safety Directive 2009/48/EC).", annotations: {label_en: "0-3 years", label_de: "0-3 Jahre"}}
      age_3_to_6:  {description: "3-6 years.", annotations: {label_en: "3-6 years", label_de: "3-6 Jahre"}}
      age_6_to_12: {description: "6-12 years.", annotations: {label_en: "6-12 years", label_de: "6-12 Jahre"}}
      age_12_plus: {description: "12 years and above.", annotations: {label_en: "12+ years", label_de: "Ab 12 Jahren"}}
      adult:       {description: "Adult games / collector items; not for children.", annotations: {label_en: "Adults", label_de: "Erwachsene"}}
      all_ages:    {description: "Suitable for all ages.", annotations: {label_en: "All ages", label_de: "Alle Altersgruppen"}}
