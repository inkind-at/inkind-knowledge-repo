---
id: https://inkind-at.github.io/inkind-knowledge-repo/categories/personal_care
name: personal_care
title: Personal Care Category Schema
description: >-
  Defines PersonalCareCategory mixin applied to PersonalCareItem. Merges
  former HygieneItem and HealthBeautyItem — COICOP 06.1 (medical products)
  and 12.1 (personal care) share identical operative safety rules (sealed
  required for consumables, used tools blocked, expiry enforced), and Open
  Eligibility already uses one "Personal Care Items" node for both.
  Ontology grounding: Product Types Ontology (pto:Personal_hygiene and
  per-subcategory IRIs).

  Uses NEITHER condition_grade NOR assessment_result — is_sealed +
  expiry_date is the complete vocabulary (a wear grade is meaningless for a
  tube of toothpaste). Same pattern as FoodCategory.

  Baby nappies and baby-specific toiletries are NOT here — they route to
  BabyInfantSubcategoryEnum's baby_care/nappies subcategories (same
  is_sealed/expiry_date assessment, grouped there for UX with other baby
  items donated/requested together). Only adult incontinence_products stay
  here.

  Prescription medications must never be accepted; flagging for safe
  disposal is operational procedure, not a schema rule.

license: MIT
see_also:
  - http://www.productontology.org/id/Personal_hygiene
  - http://www.productontology.org/id/Cosmetics
  - http://www.productontology.org/id/Health_care
  - https://company.auntbertha.com/openeligibility/
  - https://unstats.un.org/unsd/classifications/Family/Detail/2094

prefixes:
  inkind_knowledge_repo: https://inkind-at.github.io/inkind-knowledge-repo/
  linkml: https://w3id.org/linkml/
  pto: http://www.productontology.org/id/

default_prefix: inkind_knowledge_repo
default_range: string

imports:
  - linkml:types
  - ./_base
  - ./_context_rules


classes:

  PersonalCarePhysicalItemMixin:
    mixin: true
    is_a: PersonalCareCategory
    mixins: [PersonalCareContextRulesMixin]
    description: >-
      Shared physical-item dispatch target for the Personal Care category,
      used identically by DonationItem, StorageCollection, and
      SortedCollection. Pure composition — no slots or rules of its own.

  PersonalCareCategory:
    mixin: true
    is_a: CategoryMixin
    description: >-
      Mixin for personal care, hygiene, and health product slots and UC rules.
      Applied to PersonalCareItem via mixins: [PersonalCareCategory].
    see_also:
      - http://www.productontology.org/id/Personal_hygiene
      - https://company.auntbertha.com/openeligibility/
    slots:
      - subcategory
      - is_sealed
      - expiry_date
      - net_content_value
      - net_content_unit
    slot_usage:
      subcategory:
        range: PersonalCareSubcategoryEnum
        required: true
      is_sealed:
        required: false
        description: >-
          Whether the item's original packaging/seal is intact.
          UC block for most consumable subcategories when false.
          Primary safety signal for personal care items — replaces condition_grade.
      expiry_date:
        range: date
        description: >-
          Expiry or best-before date from the packaging.
          UC block: expiry_date < today (runtime check by Django model clean()).
          Secondary safety signal — important for medications, skincare, food.
        annotations:
          uc_action: block
          uc_suggest: disposal
          uc_note: "Dynamic date comparison — runtime enforcement by Django model clean()"
    annotations:
      completeness_minimal:  "subcategory, is_sealed"
      completeness_standard: "subcategory, is_sealed, expiry_date, usage"
      completeness_detailed: "subcategory, is_sealed, expiry_date, net_content_value, net_content_unit, usage"
      coicop_divisions: "06.1, 12.1"
      prescription_medication_note: >-
        Prescription medications must NOT be accepted. Flag for pharmaceutical
        disposal. This is operational procedure — not enforceable by schema rule.
      label_en: "Personal Care"
      label_de: "Personalhygiene"
      aliases_en: ["personal care", "hygiene"]
      aliases_de: ["Personalhygiene", "Hygiene"]
    rules:
      - title: uc-personal-care-unsealed-consumables-block
        description: >-
          Unsealed consumable personal care products must not be redistributed.
          A PC (Policy Constraint) override at the org level can permit
          specific subcategories (e.g. bulk bar soap) if org policy allows.
          action: block.
        preconditions:
          slot_conditions:
            is_sealed:
              equals_string: "false"
            subcategory:
              any_of:
                - equals_string: soap_body_wash
                - equals_string: shampoo_conditioner
                - equals_string: dental
                - equals_string: deodorant
                - equals_string: sanitary_products
                - equals_string: incontinence_products
                - equals_string: skincare
                - equals_string: cosmetics
                - equals_string: hair_styling
                - equals_string: otc_medication
                - equals_string: first_aid
                - equals_string: medical_consumables
        postconditions:
          slot_conditions:
            lifecycle_state:
              none_of:
                - equals_string: stored
                - equals_string: distributed

      - title: uc-personal-care-used-tools-block
        description: >-
          Used personal care tools must not be redistributed. Health and
          sanitary safety — no PC override permitted.
          action: block.
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: personal_care_tools
            usage:
              equals_string: used
        postconditions:
          slot_conditions:
            lifecycle_state:
              none_of:
                - equals_string: stored
                - equals_string: distributed

      - title: uc-personal-care-expired-block
        description: >-
          Items past expiry date must not be redistributed.
          Runtime check — dynamic date comparison not expressible as a static
          LinkML rule. Enforced by Django model clean() at save time.
        preconditions: {}
        annotations:
          enforcement: application_layer
          uc_action: block
          uc_suggest: disposal
          uc_note: "expiry_date < today — runtime check by Django model clean()"


enums:

  PersonalCareSubcategoryEnum:
    description: >-
      Personal care, hygiene, and health product subcategories.
      Covers COICOP 06.1 (medical products) and 12.1 (personal care).
    permissible_values:
      soap_body_wash:       {description: "Bar soap, liquid soap, body wash, hand sanitiser. Must be sealed. (Baby wash → BabyInfantItem, see baby_care subcategory.)", see_also: [pto:Soap], annotations: {label_en: "Soap and Body Wash", label_de: "Seife und Duschgel", aliases_en: ["soap", "body wash", "hand sanitiser"], aliases_de: ["Seife", "Duschgel", "Handdesinfektionsmittel"]}}
      shampoo_conditioner:  {description: "Shampoo, conditioner, dry shampoo. Must be sealed. (Baby shampoo → BabyInfantItem, see baby_care subcategory.)", see_also: [pto:Hair_care], annotations: {label_en: "Shampoo and Conditioner", label_de: "Shampoo und Conditioner", aliases_en: ["Shampoo", "Conditioner", "Dry shampoo"], aliases_de: ["Shampoo", "Conditioner", "Trockenshampoo"]}}
      dental:               {description: "Toothpaste, mouthwash, dental floss. Must be sealed. (Toothbrushes → personal_care_tools).", see_also: [pto:Oral_hygiene], annotations: {label_en: "Dental Care", label_de: "Zahnpflege", aliases_en: ["toothpaste", "mouthwash", "dental floss"], aliases_de: ["Zahnpasta", "Mundspülung", "Zahnseide"]}}
      deodorant:            {description: "Deodorant and antiperspirant. Must be sealed.", annotations: {label_en: "Deodorant", label_de: "Deodorant", aliases_en: ["deodorant", "antiperspirant"], aliases_de: ["Deodorant", "Schweißhemmer"]}}
      sanitary_products:    {description: "Menstrual pads, tampons, menstrual cups. Must be sealed.", annotations: {label_en: "Sanitary Products", label_de: "Damenhygieneprodukte", aliases_en: ["sanitary pad", "tampon", "menstrual cup"], aliases_de: ["Damenhygiene", "Tampon", "Menstruationsbeutel", "Damenbinde"]}}
      incontinence_products: {description: "Adult incontinence pads, pull-ups, bed pads. Must be sealed. (Baby nappies → BabyInfantItem, see nappies subcategory.)", annotations: {label_en: "Incontinence Products", label_de: "Inkontinenzprodukte", aliases_en: ["incontinence product", "incontinence pad", "pull-up", "bed pad"], aliases_de: ["Inkontinenzprodukt", "Inkontinenzeinlage", "Inkontinenzhose", "Bettschutzeinlage"]}}
      toilet_paper_tissue:  {description: "Toilet paper, facial tissue. Must be sealed/wrapped.", annotations: {label_en: "Toilet Paper and Facial Tissue", label_de: "Toilettenpapier und Taschentücher", aliases_en: ["toilet paper", "facial tissue"], aliases_de: ["Toilettenpapier", "Taschentücher"]}}
      personal_care_tools:  {description: "Toothbrushes, razors, nail clippers, tweezers, combs. UC block: used → never redistribute.", annotations: {label_en: "Personal Care Tools", label_de: "Persönliche Pflegewerkzeuge", aliases_en: ["toothbrush", "razor", "nail clippers", "tweezers", "comb"], aliases_de: ["Zahnbürste", "Rasierer", "Nagelknipser", "Pinzette", "Kamm"]}}
      skincare:             {description: "Moisturisers, sunscreen, face wash, lip balm. Must be sealed. (Baby lotion/oil/powder/rash cream/sunscreen → BabyInfantItem, see baby_care subcategory.)", see_also: [pto:Skin_care], annotations: {label_en: "Skincare", label_de: "Hautpflege", aliases_en: ["skincare", "moisturiser", "sunscreen", "face wash", "lip balm"], aliases_de: ["Hautpflege", "Feuchtigkeitscreme", "Sonnencreme", "Gesichtsreiniger", "Lippenbalsam"]}}
      cosmetics:            {description: "Foundation, lipstick, mascara, nail polish. Must be sealed/unused.", see_also: [pto:Cosmetics], annotations: {label_en: "Cosmetics", label_de: "Kosmetik", aliases_en: ["cosmetics", "foundation", "lipstick", "mascara", "nail polish"], aliases_de: ["Kosmetik", "Foundation", "Lippenstift", "Mascara", "Nagellack"]}}
      hair_styling:         {description: "Hair gel, mousse, hairspray, hair dye. Must be sealed.", annotations: {label_en: "Hair Styling", label_de: "Haarstyling", aliases_en: ["hair styling", "hair gel", "mousse", "hairspray", "hair dye"], aliases_de: ["Haarstyling", "Haar Gel", "Mousse", "Haarspray", "Haarfärbemittel"]}}
      otc_medication:       {description: "OTC pain relief, vitamins, cold medicine. Sealed + expiry enforced. NO prescription medications.", see_also: [pto:Over-the-counter_drug], annotations: {label_en: "Over-the-Counter Medication", label_de: "Freiverkäufliche Medikamente", aliases_en: ["OTC medication", "over-the-counter medication", "pain relief", "vitamins", "cold medicine"], aliases_de: ["Freiverkäufliche Medikamente", "Schmerzmittel", "Vitamine", "Erkältungsmedizin"]}}
      first_aid:            {description: "First aid kits, plasters, antiseptic, sterile dressings. Sealed required.", see_also: [pto:First_aid], annotations: {label_en: "First Aid Supplies", label_de: "Erste-Hilfe-Ausrüstung", aliases_en: ["first aid", "first aid kit", "plaster", "antiseptic", "sterile dressing"], aliases_de: ["Erste-Hilfe-Ausrüstung", "Pflaster", "Antiseptikum", "Sterile Verbände"]}}
      medical_consumables:  {description: "Disposable gloves, masks, syringes (sealed). Sealed + expiry.", see_also: [pto:Medical_device], annotations: {label_en: "Medical Consumables", label_de: "Medizinische Verbrauchsmaterialien", aliases_en: ["medical consumables", "disposable gloves", "masks", "syringes"], aliases_de: ["Medizinische Verbrauchsmaterialien", "Einweghandschuhe", "Masken", "Spritzen"]}}
      medical_devices_small: {description: "Thermometers, blood pressure monitors, reading glasses. Not durable aids (→ MobilityAidsItem).", annotations: {label_en: "Small Medical Devices", label_de: "Kleine Medizinische Geräte", aliases_en: ["small medical device", "thermometer", "blood pressure monitor", "reading glass"], aliases_de: ["Kleine Medizinische Geräte", "Thermometer", "Blutdruckmessgerät", "Leseglas"]}}
      other:                {description: "Personal care products not fitting above subcategories.", annotations: {label_en: "Other Personal Care", label_de: "Sonstige Körperpflege"}}