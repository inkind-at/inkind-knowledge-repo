---
id: https://inkind-at.github.io/inkind-knowledge-repo/categories/household
name: household
title: Household & Kitchen Category Schema
description: >-
  Defines HouseholdCategory mixin applied to HouseholdItem. COICOP Divisions
  05.3 (appliances), 05.4 (glassware, tableware, utensils), 05.5 (house and
  garden tools). Household textiles (05.2) are in BeddingTextilesItem, not
  here.

  Ontology grounding: Product Types Ontology (pto:Household_goods and
  per-value IRIs), schema:material as fallback anchor.

  material (detailed tier) is used for allergen filtering (nickel, copper)
  and care-requirement matching (cast iron, wood, non-stick).

  Assessment: condition_grade (wear grade) — appropriate here since the
  redistribution signal for cookware, appliances, and decor is how
  worn/functional the item appears, not a structured safety checklist.

license: MIT
see_also:
  - http://www.productontology.org/id/Household_goods
  - https://unstats.un.org/unsd/classifications/Family/Detail/2094
  - https://schema.org/material

prefixes:
  inkind_knowledge_repo: https://inkind-at.github.io/inkind-knowledge-repo/
  linkml: https://w3id.org/linkml/
  pto: http://www.productontology.org/id/
  schema: http://schema.org/

default_prefix: inkind_knowledge_repo
default_range: string

imports:
  - linkml:types
  - ./_base
  - ./_context_rules


classes:

  HouseholdPhysicalItemMixin:
    mixin: true
    is_a: HouseholdCategory
    mixins: [HouseholdContextRulesMixin]
    description: >-
      Shared physical-item dispatch target for the Household category, used
      identically by DonationItem, StorageCollection, and SortedCollection.
      Pure composition — no slots or rules of its own.

  HouseholdCategory:
    mixin: true
    is_a: CategoryMixin
    description: >-
      Mixin for household and kitchen goods slots.
      Applied to HouseholdItem via mixins: [HouseholdCategory].
    see_also:
      - http://www.productontology.org/id/Household_goods
    slots:
      - subcategory
      - material
      - is_set_complete
      - condition_grade
    slot_usage:
      subcategory:
        range: HouseholdSubcategoryEnum
        required: true
      material:
        range: HouseholdMaterialEnum
        required: false
        description: >-
          Primary construction material. Optional — detailed completeness
          tier.
      condition_grade:
        range: UsedConditionGradeEnum
        required: false
    annotations:
      completeness_minimal:  "subcategory"
      completeness_standard: "subcategory, is_set_complete, usage, condition_grade"
      completeness_detailed: "subcategory, material, is_set_complete, usage, condition_grade"
      coicop_divisions: "05.3, 05.4, 05.5"
      label_en: "Household"
      label_de: "Haushaltswaren"
      aliases_en: ["household goods", "domestic items"]
      aliases_de: ["Haushaltsgegenstände", "Domestikum"]


enums:

  HouseholdMaterialEnum:
    description: >-
      Primary construction material of a household or kitchen item. Records
      the dominant material; use mixed when none dominates. Grounded in
      Product Types Ontology (pto:), consistent with FurnitureMaterialEnum.
      Used for allergen filtering (nickel, copper) and care-requirement
      matching (cast iron, copper, wood, non-stick).
    see_also:
      - schema:material
    permissible_values:
      stainless_steel:
        description: >-
          Stainless steel. Most common material for cutlery, pots, pans,
          kettles, and small appliances.
        see_also: [pto:Stainless_steel]
        annotations:
          label_en: "Stainless steel"
          label_de: "Edelstahl"
      wood:
        description: >-
          Solid wood or wood-composite (including bamboo, which is functionally
          similar). Common for utensils, chopping boards, salad bowls, and
          home decor. Requires periodic oiling; not dishwasher-safe.
        see_also: [pto:Wood]
        annotations:
          label_en: "Wood / Bamboo"
          label_de: "Holz / Bambus"
      ceramic:
        description: >-
          Ceramic, earthenware, stoneware, or porcelain. Predominant for
          crockery (plates, bowls, mugs), baking dishes, and decorative items.
          May include a glazed finish.
        see_also: [pto:Ceramic]
        annotations:
          label_en: "Ceramic / Porcelain"
          label_de: "Keramik / Porzellan"
      glass:
        description: >-
          Glass (borosilicate or soda-lime). Used for drinking glasses,
          storage jars, glass baking dishes, and glass decor items.
          Fragility relevant to packaging during storage and distribution.
        see_also: [schema:material]
        annotations:
          label_en: "Glass"
          label_de: "Glas"
      cast_iron:
        description: >-
          Cast iron cookware (frying pans, casseroles, trivets).
          Requires seasoning and cannot be soaked or put in the dishwasher.
          Heavy — relevant for storage slot load-bearing assessment.
        see_also: [pto:Cast_iron]
        annotations:
          label_en: "Cast Iron"
          label_de: "Gusseisen"
      copper:
        description: >-
          Copper or copper-clad cookware and decor. Requires specialist
          polishing to prevent tarnishing.
        see_also: [pto:Copper]
        annotations:
          label_en: "Copper"
          label_de: "Kupfer"
      aluminium:
        description: >-
          Aluminium cookware and baking trays. Lightweight and common in
          baking trays, roasting pans, and budget cookware.
        see_also: [pto:Aluminium]
        annotations:
          label_en: "Aluminium"
          label_de: "Aluminium"
      non_stick:
        description: >-
          Non-stick coated cookware (PTFE/Teflon or ceramic-coated pans).
          Requires specific care: no metal utensils, hand-wash only.
          Record the base material in sorting_notes when visible (typically
          aluminium or stainless steel with non-stick coating).
        see_also: [schema:material]
        annotations:
          label_en: "Non-Stick Coated"
          label_de: "Antihaftbeschichtet"
      plastic:
        description: >-
          Plastic (various types). Common for containers, food storage
          boxes, some appliances, and kitchen organisation items.
        see_also: [schema:material]
        annotations:
          label_en: "Plastic"
          label_de: "Kunststoff"
      silicone:
        description: >-
          Silicone. Used for baking molds, spatulas, oven gloves, and
          ice cube trays. Heat-resistant and dishwasher-safe.
        see_also: [pto:Silicone]
        annotations:
          label_en: "Silicone"
          label_de: "Silikon"
      mixed:
        description: >-
          Mixed or composite materials where no single material dominates
          — e.g. a saucepan with a stainless steel body and plastic handle.
        see_also: [schema:material]
        annotations:
          label_en: "Mixed"
          label_de: "Gemischt"
      other:
        description: >-
          Materials not covered above. Record the specific material in
          sorting_notes when known.
        see_also: [schema:material]
        annotations:
          label_en: "Other"
          label_de: "Andere"

  HouseholdSubcategoryEnum:
    description: >-
      Household and kitchen goods subcategories aligned with COICOP 05.3-05.5.
      Bedding, towels, and curtains (COICOP 05.2) belong in
      BeddingTextilesSubcategoryEnum.
    permissible_values:
      cookware:             {description: "Pots, pans, baking trays, woks, pressure cookers. COICOP 05.4.", see_also: [pto:Cookware], annotations: {label_en: "Cookware", label_de: "Kochgeschirr", aliases_en: ["Kitchenware", "Pot", "pan", "baking dish", "wok", "pressure cooker"], aliases_de: ["Küchenutensilien", "Topf", "Pfanne", "Backform", "Wok", "Schnellkochtopf"]}}
      crockery:             {description: "Plates, bowls, mugs, cups, serving dishes. COICOP 05.4.", see_also: [pto:Tableware], annotations: {label_en: "Crockery", label_de: "Geschirr", aliases_en: ["Tableware", "Dish", "Plate", "Bowl", "Mug", "Cup"], aliases_de: ["Tafelgeschirr", "Teller", "Schüssel", "Tasse", "Becher", "Serviergeschirr", "Geschirr"]}}
      cutlery:              {description: "Knives, forks, spoons, serving utensils. COICOP 05.4.", see_also: [pto:Cutlery], annotations: {label_en: "Cutlery", label_de: "Besteck", aliases_en: ["Silverware", "Flatware", "Knife", "Fork", "Spoon"], aliases_de: ["Essbesteck", "Messer", "Gabel", "Löffel", "Servierbesteck", "Besteck"]}}
      glassware:            {description: "Drinking glasses, jugs, functional glassware. COICOP 05.4.", see_also: [pto:Glassware], annotations: {label_en: "Glassware", label_de: "Gläser", aliases_en: ["Drinking glasses", "Jug", "Functional glassware"], aliases_de: ["Trinkgläser", "Krug", "Funktionale Glaswaren", "Glass"]}}
      small_appliances:     {description: "Toasters, kettles, blenders, microwaves, irons, hairdryers. COICOP 05.3.", see_also: [pto:Home_appliance], annotations: {label_en: "Small appliances", label_de: "Kleine Haushaltsgeräte", aliases_en: ["Appliances", "Toaster", "Kettle", "Blender", "Microwave", "Iron", "Hairdryer"], aliases_de: ["Haushaltsgeräte", "Toaster", "Wasserkocher", "Mixer", "Mikrowelle", "Bügeleisen", "Föhn"]}}
      cleaning:             {description: "Mops, brushes, buckets, vacuum cleaners, brooms. COICOP 05.6.", annotations: {label_en: "Cleaning supplies", label_de: "Putzen & Reinigen", aliases_en: ["Cleaning tools", "Mop", "Brush", "Bucket", "Vacuum cleaner", "Broom"], aliases_de: ["Reinigungswerkzeuge", "Mopp", "Bürste", "Eimer", "Staubsauger", "Besen"]}}
      storage_organisation: {description: "Storage boxes, baskets, coat hangers, drawer organisers.", annotations: {label_en: "Storage Organisation", label_de: "Lagernorganisation", aliases_en: ["Storage", "Organisation", "Storage box", "Basket", "Coat hanger", "Drawer organiser"], aliases_de: ["Lagerung", "Organisation", "Aufbewahrungsbox", "Korb", "Kleiderbügel", "Schubladenorganisator"]}}
      home_decor:           {description: "Picture frames, vases, candles, mirrors, clocks, lamps.", see_also: [pto:Decorative_arts], annotations: {label_en: "Home decor", label_de: "Wohnaccessoires & Deko", aliases_en: ["Decor", "Decoration", "Picture frame", "Vase", "Candle", "Mirror", "Clock", "Lamp"], aliases_de: ["Dekoration", "Bilderrahmen", "Vase", "Kerze", "Spiegel", "Uhr", "Lampe"]}}
      garden_tools:         {description: "Spades, trowels, secateurs, watering cans. COICOP 05.5.", see_also: [pto:Garden_tool], annotations: {label_en: "Garden tools", label_de: "Gartenwerkzeuge", aliases_en: ["Garden", "Tools", "Spade", "Trowel", "Secateurs", "Watering can"], aliases_de: ["Garten", "Werkzeuge", "Spaten", "Kelle", "Gartenschere", "Gießkanne"]}}
      other:                {description: "Household items not fitting above subcategories.", annotations: {label_en: "Other", label_de: "Sonstiges"}}
