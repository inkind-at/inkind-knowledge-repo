---
id: https://inkind-at.github.io/inkind-knowledge-repo/categories/furniture
name: furniture
title: Furniture Category Schema
description: >-
  Defines FurnitureCategory mixin applied to FurnitureItem. COICOP Division
  05.1. Ontology grounding: Product Types Ontology (pto:Furniture and
  per-value IRIs), schema:material, schema:SizeSpecification (dimensions).

  Uses FurnitureAssessmentEnum (structured structural assessment) instead of
  condition_grade — structural soundness, not wear, is the primary
  redistribution signal (a scratched but solid chair is redistributable; a
  clean but wobbly one is not). assessment_result required regardless of
  usage since flatpack/new furniture can have manufacturing or assembly
  defects.

  Valid materials are constrained per subcategory by vm-material-* rules
  (e.g. beds/tables exclude fabric). dimensions required for tables/beds.

license: MIT
see_also:
  - http://www.productontology.org/id/Furniture
  - https://unstats.un.org/unsd/classifications/Family/Detail/2094

prefixes:
  inkind_knowledge_repo: https://inkind-at.github.io/inkind-knowledge-repo/
  linkml: https://w3id.org/linkml/
  pto: http://www.productontology.org/id/
  schema: http://schema.org/

default_prefix: inkind_knowledge_repo
default_range: string

imports:
  - linkml:types
  - ./_base
  - ./_context_rules


classes:

  FurnitureCategory:
    mixin: true
    is_a: CategoryMixin
    description: >-
      Mixin for furniture slots, value maps, and UC rules.
      Applied to FurnitureItem via mixins: [FurnitureCategory].
      assessment_result and its UC rules live on FurnitureAssessmentMixin
      (below) so DemandSignal can dispatch to this bare mixin without
      assessment content that only applies to a physical item in hand.
    see_also:
      - http://www.productontology.org/id/Furniture
    slots:
      - subcategory
      - material
      - dimensions
      - style
    slot_usage:
      subcategory:
        range: FurnitureSubcategoryEnum
        required: true
      material:
        range: FurnitureMaterialEnum
        required: false
    annotations:
      completeness_minimal:  "subcategory"
      completeness_standard: "subcategory, material, usage"
      completeness_detailed: "subcategory, material, dimensions, style, usage"
      coicop_division: "05.1"
      label_en: "Furniture"
      label_de: "Möbel"
      aliases_en: ["furniture", "furnishings"]
      aliases_de: ["Möbel", "Einrichtung"]
    rules:
      - title: vm-material-beds
        description: >-
          Beds accept structural materials only (wood, metal, mixed).
          Fabric and plastic are not valid primary materials for beds.
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: beds
        postconditions:
          slot_conditions:
            material:
              any_of:
                - equals_string: wood
                - equals_string: metal
                - equals_string: mixed

      - title: vm-material-tables
        description: Tables do not use fabric as primary material.
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: tables
        postconditions:
          slot_conditions:
            material:
              any_of:
                - equals_string: wood
                - equals_string: metal
                - equals_string: plastic
                - equals_string: glass
                - equals_string: mixed

  FurnitureAssessmentMixin:
    mixin: true
    is_a: FurnitureCategory
    mixins: [FurnitureContextRulesMixin]
    description: >-
      Shared physical-item dispatch target for Furniture — used identically
      by DonationItem, StorageCollection, and SortedCollection. Adds
      assessment_result and its UC rules on top of FurnitureCategory.
      Never used by DemandSignal.
    slots:
      - assessment_result
    slot_usage:
      assessment_result:
        range: FurnitureAssessmentEnum
        required: false
        description: Structural and quality assessment. Required regardless of usage.
    annotations:
      completeness_minimal:  "subcategory, assessment_result"
      completeness_standard: "subcategory, material, assessment_result, usage"
      completeness_detailed: "subcategory, material, assessment_result, dimensions, style, usage"
      coicop_division: "05.1"
    rules:
      - title: uc-furniture-compromised-block
        description: >-
          Items assessed as structurally_compromised must not be redistributed.
          Applies to both new items (manufacturing defect) and used items.
          action: block, suggest: disposal or repair referral.
        preconditions:
          slot_conditions:
            assessment_result:
              equals_string: structurally_compromised
        postconditions:
          slot_conditions:
            lifecycle_state:
              none_of:
                - equals_string: stored
                - equals_string: distributed

      - title: uc-furniture-repairable-warn
        description: >-
          Items assessed as functional_with_repairs require sorter confirmation.
          action: warn — sorting_notes required.
        preconditions:
          slot_conditions:
            assessment_result:
              equals_string: functional_with_repairs
        postconditions:
          slot_conditions:
            sorting_notes:
              required: true

      - title: uc-furniture-seating-beds-cosmetic-warn
        description: >-
          Seating and beds with significant cosmetic damage require sorter
          confirmation. action: warn — sorting_notes required.
        preconditions:
          slot_conditions:
            subcategory:
              any_of:
                - equals_string: seating
                - equals_string: beds
            assessment_result:
              equals_string: significant_cosmetic_damage
        postconditions:
          slot_conditions:
            sorting_notes:
              required: true


slots:
  dimensions:
    range: string
    description: >-
      Physical dimensions in centimetres, e.g. "100*50*75 cm" (W*D*H).
      Required for tables and beds to enable storage slot assignment and
      demand signal matching.
    see_also:
      - schema:SizeSpecification
    annotations:
      required_if: "subcategory in [tables, beds]"

  style:
    range: string
    description: >-
      Style or design description (e.g. "Scandinavian", "Industrial",
      "Rustic"). Free text. Optional — detailed completeness tier.
      Supports demand signal matching for beneficiaries with style preferences.


enums:

  FurnitureAssessmentEnum:
    description: >-
      Structured assessment of furniture structural integrity and quality,
      distinguishing cosmetic damage from structural compromise. Required at
      sorting regardless of usage.
    permissible_values:
      structurally_sound:
        description: >-
          All load-bearing components intact; no cracks, wobbling, or unsafe
          instability. Safe for redistribution without qualification.
          Appropriate for new items with no observed defects.
        annotations:
          label_en: "Structurally Sound"
          label_de: "Strukturell Unbeschädigt"
      minor_cosmetic_damage:
        description: >-
          Scratches, scuffs, minor surface damage. Structural integrity
          unaffected. Fully redistributable.
        annotations:
            label_en: "Minor Cosmetic Damage"
            label_de: "Geringe Kosmetische Schäden"
      significant_cosmetic_damage:
        description: >-
          Visible staining, discolouration, or notable surface damage.
          Structurally sound but appearance significantly affected.
          action: warn for seating/beds — sorting_notes required.
        annotations:
          label_en: "Significant Cosmetic Damage"
          label_de: "Erhebliche Kosmetische Schäden"
      functional_with_repairs:
        description: >-
          Item is usable but benefits from minor repair before redistribution
          (loose screw, wobbly leg, minor adjustment needed).
          action: warn — sorting_notes required.
        annotations:
          label_en: "Functional with Repairs"
          label_de: "Funktionstüchtig mit Reparaturen"
      structurally_compromised:
        description: >-
          Load-bearing components cracked, broken, or unsafe. Must not be
          redistributed. Applies to new items (manufacturing defect) and used.
          action: block, suggest: disposal or repair referral.
        annotations:
          label_en: "Structurally Compromised"
          label_de: "Strukturell Beeinträchtigt"

  FurnitureSubcategoryEnum:
    description: Furniture subcategories. Grounded in Product Types Ontology.
    permissible_values:
      seating:       {description: "Chairs, sofas, armchairs, benches.", see_also: [pto:Chair], annotations: {label_en: "Seating", label_de: "Sitzmöbel", aliases_en: ["Seating", "Chair", "Sofa", "Armchair", "Bench"], aliases_de: ["Sitzmöbel", "Stuhl", "Sofa", "Sessel", "Bank"]}}
      tables:        {description: "Dining tables, coffee tables, desks. dimensions required.", see_also: [pto:Table], annotations: {label_en: "Tables", label_de: "Tische", aliases_en: ["Tables", "Table"], aliases_de: ["Tische", "Tisch"]}}
      beds:          {description: "Bed frames and divans. dimensions required.", see_also: [pto:Bed], annotations: {label_en: "Beds", label_de: "Betten", aliases_en: ["Beds", "Bed"], aliases_de: ["Betten", "Bett"]}}
      storage_units: {description: "Wardrobes, cabinets, chests of drawers.", see_also: [pto:Cabinet], annotations: {label_en: "Storage Units", label_de: "Aufbewahrungseinheiten", aliases_en: ["Storage units", "Wardrobe", "Cabinet", "Chest of drawers"], aliases_de: ["Aufbewahrungseinheiten", "Kleiderschrank", "Schrank", "Kommode"]}}
      shelving:      {description: "Shelving units, bookcases, wall-mounted shelves.", annotations: {label_en: "Shelving", label_de: "Regale", aliases_en: ["Shelving", "Bookcase", "Shelf"], aliases_de: ["Regale", "Bücherregal", "Regal"]}}
      other:         {description: "Furniture not fitting above subcategories.", annotations: {label_en: "Other Furniture", label_de: "Sonstige Möbel"}}

  FurnitureMaterialEnum:
    description: >-
      Primary furniture construction material. Grounded in schema:material
      (schema.org property on schema:Product, superseding GoodRelations
      gr:qualitativeProductOrServiceProperty). Valid values per subcategory
      constrained by vm-material-* rules.
    permissible_values:
      wood:    {description: "Solid wood or wood-composite (MDF, plywood, chipboard).", see_also: [pto:Wood, schema:material], annotations: {label_en: "Wood", label_de: "Holz"}}
      metal:   {description: "Metal frame (steel, aluminium, iron).", see_also: [schema:material], annotations: {label_en: "Metal", label_de: "Metall"}}
      plastic: {description: "Plastic or synthetic polymer primary construction.", see_also: [schema:material], annotations: {label_en: "Plastic", label_de: "Kunststoff"}}
      fabric:  {description: "Upholstered fabric (sofas, chairs). Not valid for tables or beds.", see_also: [schema:material], annotations: {label_en: "Fabric", label_de: "Stoff"}}
      glass:   {description: "Glass panels or surface (glass-top tables). Not valid for beds.", see_also: [schema:material], annotations: {label_en: "Glass", label_de: "Glas"}}
      mixed:   {description: "Mixed or composite materials.", see_also: [schema:material], annotations: {label_en: "Mixed", label_de: "Gemischt"}}