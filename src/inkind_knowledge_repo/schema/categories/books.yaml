---
id: https://inkind-at.github.io/inkind-knowledge-repo/categories/books
name: books
title: Books & Education Category Schema
description: >-
  Defines BooksCategory mixin applied to BooksItem. COICOP Division 09.5
  (grouped with stationery by COICOP; kept separate here — different
  sorting paths, condition vocabularies, and demand patterns). Ontology
  grounding: schema:Book, Product Types Ontology per-subcategory IRIs.

  age_range (BookAgeRangeEnum) is broader and non-gendered compared to
  DemographicEnum — content suitability doesn't need a gender split.
  Assessment: condition_grade (wear grade).

license: MIT
see_also:
  - http://schema.org/Book
  - https://unstats.un.org/unsd/classifications/Family/Detail/2094

prefixes:
  inkind_knowledge_repo: https://inkind-at.github.io/inkind-knowledge-repo/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  pto: http://www.productontology.org/id/

default_prefix: inkind_knowledge_repo
default_range: string

imports:
  - linkml:types
  - ./_base
  - ./_context_rules


classes:

  BooksPhysicalItemMixin:
    mixin: true
    is_a: BooksCategory
    mixins: [BooksContextRulesMixin]
    description: >-
      Shared physical-item dispatch target for the Books category, used
      identically by DonationItem, StorageCollection, and SortedCollection.
      Pure composition — no slots or rules of its own.

  BooksCategory:
    mixin: true
    is_a: CategoryMixin
    description: >-
      Mixin for books and educational materials slots.
      Applied to BooksItem via mixins: [BooksCategory].
      No UC block rules beyond the cross-cutting condition rule.
    see_also:
      - http://schema.org/Book
    slots:
      - subcategory
      - language
      - age_range
      - condition_grade
    slot_usage:
      subcategory:
        range: BooksSubcategoryEnum
        required: true
      age_range:
        range: BookAgeRangeEnum
        required: false
      condition_grade:
        range: UsedConditionGradeEnum
        required: false
    annotations:
      completeness_minimal:  "subcategory"
      completeness_standard: "subcategory, age_range, usage, condition_grade"
      completeness_detailed: "subcategory, age_range, language, usage, condition_grade"
      coicop_division: "09.5"
      label_en: "Books"
      label_de: "Bücher"
      aliases_en: ["books"]
      aliases_de: ["Bücher"]


slots:

  language:
    range: string
    description: >-
      Language of item content (ISO 639-1 code, e.g. "de", "en", "ar", "fa").
      Important for demand signal matching — organisations serving specific
      language communities have targeted language preferences.
      Optional — detailed completeness tier.
    annotations:
      label_en: "Language"
      label_de: "Sprache"

enums:

  BooksSubcategoryEnum:
    description: Books and educational materials subcategories.
    permissible_values:
      fiction:               {description: "Novels, short stories, graphic novels, comics.", see_also: [pto:Fiction], annotations: {label_en: "Fiction", label_de: "Belletristik"}}
      non_fiction:           {description: "Biographies, history, science, self-help, cookbooks.", see_also: [pto:Non-fiction], annotations: {label_en: "Non-Fiction", label_de: "Sachbücher"}}
      childrens_books:       {description: "Picture books, board books, early readers.", annotations: {label_en: "Children's Books", label_de: "Kinderbücher"}}
      textbooks:             {description: "School and university textbooks, reference books.", see_also: [pto:Textbook], annotations: {label_en: "Textbooks", label_de: "Lehrbücher"}}
      language_learning:     {description: "Language learning books, dictionaries, phrasebooks.", annotations: {label_en: "Language Learning", label_de: "Sprachlernmaterialien"}}
      religious:             {description: "Religious texts and devotional books.", annotations: {label_en: "Religious", label_de: "Religiöse Bücher"}}
      educational_materials: {description: "Workbooks, flashcards, educational posters, school supplies.", annotations: {label_en: "Educational Materials", label_de: "Lernmaterialien"}}
      other:                 {description: "Books and educational materials not fitting above subcategories.", annotations: {label_en: "Other", label_de: "Sonstige"}}

  BookAgeRangeEnum:
    description: >-
      Age suitability for books. Broader and non-gendered compared to
      DemographicEnum — content suitability does not require gender split.
    permissible_values:
      children_0_5:  {description: "Picture books, board books, early learning (0-5 years)", annotations: {label_en: "Children (0-5)", label_de: "Kinder (0-5 Jahre)"}}
      children_6_12: {description: "Middle-grade readers, chapter books (6-12 years)", annotations: {label_en: "Children (6-12)", label_de: "Kinder (6-12 Jahre)"}}
      young_adult:   {description: "Young adult (13-17 years)", annotations: {label_en: "Young Adult", label_de: "Jugendliche"}}
      adult:         {description: "Adult readership", annotations: {label_en: "Adult", label_de: "Erwachsene"}}
      all_ages:      {description: "Suitable for all ages", annotations: {label_en: "All Ages", label_de: "Alle Altersgruppen"}}