---
id: https://inkind-at.github.io/inkind-knowledge-repo/categories/accessories
name: accessories
title: Accessories Category Schema
description: >-
  Defines AccessoriesCategory mixin applied to AccessoriesItem.
  Covers fashion and personal accessories: hats, scarves, gloves, belts,
  bags, jewellery, sunglasses, watches, wallets. COICOP Division 03.1
  (grouped with clothing by COICOP; separated here for schema/UI clarity).

  Ontology grounding: Product Types Ontology (pto:Fashion_accessory and
  per-value material IRIs), CPI ontology for subcategory terms, schema:material
  as the fallback anchor.

  material (detailed tier) records the dominant identifiable material — used
  for allergen filtering (wool, nickel) and care-requirement matching
  (leather, silk).

  Deliberately simpler than ClothingCategory: no size dimension, no
  demographic→size value map, no underwear UC rules, and a simpler
  age-only AccessoriesDemographicEnum — see donation_item.yaml for the
  full rationale for keeping this separate from ClothingItem.

license: MIT
see_also:
  - http://www.productontology.org/id/Fashion_accessory
  - http://www.ebusiness-unibw.org/ontologies/cpi/ns#ClothingAndAccessories
  - https://unstats.un.org/unsd/classifications/Family/Detail/2094
  - https://schema.org/material

prefixes:
  inkind_knowledge_repo: https://inkind-at.github.io/inkind-knowledge-repo/
  linkml: https://w3id.org/linkml/
  pto: http://www.productontology.org/id/
  cpi: http://www.ebusiness-unibw.org/ontologies/cpi/ns#
  schema: http://schema.org/

default_prefix: inkind_knowledge_repo
default_range: string

imports:
  - linkml:types
  - ./_base
  - ./_context_rules


classes:

  AccessoriesPhysicalItemMixin:
    mixin: true
    is_a: AccessoriesCategory
    mixins: [AccessoriesContextRulesMixin]
    description: >-
      Shared physical-item dispatch target for the Accessories category,
      used identically by DonationItem, StorageCollection, and
      SortedCollection. Pure composition — no slots or rules of its own.

  AccessoriesCategory:
    mixin: true
    is_a: CategoryMixin
    description: >-
      Mixin for fashion and personal accessories.
      Applied to AccessoriesItem via mixins: [AccessoriesCategory].
    see_also:
      - http://www.productontology.org/id/Fashion_accessory
    slots:
      - subcategory
      - demographic
      - material
      - condition_grade
    slot_usage:
      subcategory:
        range: AccessoriesSubcategoryEnum
        required: true
      demographic:
        range: AccessoriesDemographicEnum
        required: false
        description: >-
          Optional age group. Not applicable to most accessories (bags,
          jewellery, belts are generally adult by default). Use for clearly
          age-targeted items: children's hats, baby mittens, baby carriers
          (though carriers belong in BabyInfantItem).
      material:
        range: AccessoriesMaterialEnum
        required: false
        description: >-
          Primary construction material of the accessory. Optional — detailed
          completeness tier. Record the dominant material; use other and
          note the specific material in sorting_notes when known.
          See AccessoriesMaterialEnum for full vocabulary and ontology grounding.
      condition_grade:
        range: UsedConditionGradeEnum
        required: false
    annotations:
      completeness_minimal:  "subcategory"
      completeness_standard: "subcategory, usage, condition_grade"
      completeness_detailed: "subcategory, demographic, material, usage, condition_grade"
      coicop_division: "03.1"
      label_en: "Accessories"
      label_de: "Accessoires"
      aliases_en: ["accessories", "accessory", "fashion accessory"]
      aliases_de: ["Accesoires", "Accessoire", "Modeaccessoire"]



enums:

  AccessoriesSubcategoryEnum:
    description: >-
      Fashion and personal accessories subcategories.
      Deliberately separate from ClothingSubcategoryEnum to enable clean
      progressive disclosure in the sorting UI.
      Grounded in Product Types Ontology (pto:) terms.
    permissible_values:
      hats_headwear:
        description: Hats, caps, beanies, headscarves, berets.
        see_also: [pto:Hat]
        annotations:
          label_en: "Headwear"
          label_de: "Kopfbedeckungen"
          aliases_en: ["Hat", "Headwear", "Cap", "Beanie", "Headscarf", "Beret"]
          aliases_de: ["Hut", "Kopfbedeckung", "Mütze", "Beanie", "Kopftuch", "Baretts", "Haube", "Hüte"]
      scarves:
        description: Scarves and shawls worn at neck or shoulders.
        see_also: [pto:Scarf]
        annotations:
          label_en: "Scarves & shawls"
          label_de: "Schals & Tücher"
          aliases_en: ["Scarf", "Shawl"]
          aliases_de: ["Schal", "Schleier"]
      gloves_mittens:
        description: Gloves and mittens (all ages).
        see_also: [pto:Glove]
        annotations:
          label_en: "Gloves"
          label_de: "Handschuhe"
          aliases_en: ["Gloves", "Mittens"]
          aliases_de: ["Handschuhe", "Fäustlinge"]
      belts:
        description: Belts, braces, and waist accessories.
        see_also: [pto:Belt]
        annotations:
          label_en: "Belts"
          label_de: "Gürtel"
          aliases_en: ["Belt", "Braces", "Waist Accessory", "Suspenders"]
          aliases_de: ["Gürtel", "Hosenträger", "Taillenzubehör", "Hosengürtel"]
      bags_luggage:
        description: >-
          Handbags, tote bags, backpacks, shoulder bags, wallets, purses,
          clutch bags, small luggage items.
        see_also: [pto:Bag]
        annotations:
          label_en: "Bags"
          label_de: "Taschen"
          aliases_en: ["Handbag", "Tote Bag", "Backpack", "Shoulder Bag", "Wallet", "Purse", "Clutch Bag", "Luggage", "Clutch", "Briefcase", "Satchel"]
          aliases_de: ["Handtasche", "Tasche", "Rucksack", "Schultertasche", "Brieftasche", "Purse", "Clutch-Tasche", "Reisegepäck", "Geldbörse", "Portemonnaie", "Clutch", "Aktentasche", "Umhängetasche"]
      jewellery:
        description: Necklaces, bracelets, rings, earrings, brooches.
        see_also: [pto:Jewellery]
        annotations:
          label_en: "Jewellery"
          label_de: "Schmuck"
          aliases_en: ["Necklace", "Bracelet", "Ring", "Earring", "Brooch"]
          aliases_de: ["Halskette", "Armband", "Ring", "Ohrring", "Brosche"]
      sunglasses:
        description: Sunglasses and fashion spectacle frames.
        see_also: [pto:Sunglasses]
        annotations:
          label_en: "Sunglasses"
          label_de: "Sonnenbrillen"
          aliases_en: ["Sunglasses", "Spectacle Frames"]
          aliases_de: ["Sonnenbrille", "Brillenfassung"]
      watches:
        description: Wristwatches and pocket watches.
        see_also: [pto:Watch]
        annotations:
          label_en: "Watches"
          label_de: "Uhren"
          aliases_en: ["Watch", "Wristwatch", "Pocket watch"]
          aliases_de: ["Uhr", "Armbanduhr", "Brieftaschen Uhr"]
      other:
        description: Accessories not fitting above subcategories.
        annotations:
          label_en: "Other"
          label_de: "Andere"
          aliases_en: ["Other", "Miscellaneous", "Unknown"]
          aliases_de: ["Sonstiges", "Verschiedenes", "Unbekannt"]

  AccessoriesMaterialEnum:
    description: >-
      Primary construction material of a fashion or personal accessory.
      Records the dominant material the sorter can identify quickly (e.g. a
      watch has metal case + leather strap + glass face — record the most
      prominent element). Grounded in Product Types Ontology (pto:), aligned
      with ClothingMaterialEnum's fibre values for consistency.
    see_also:
      - schema:material
    permissible_values:
      leather:
        description: >-
          Genuine or faux leather (PU/synthetic leather). Predominant material
          for bags, belts, wallets, and some gloves and watch straps.
          Requires specialist conditioning care.
        see_also: [pto:Leather]
        annotations:
          label_en: "Leather / Faux Leather"
          label_de: "Leder / Kunstleder"
          aliases_en: ["Leather", "Faux Leather", "PU Leather", "Synthetic Leather"]
          aliases_de: ["Leder", "Kunstleder", "PU Leder", "Synthetisches Leder"]
      wool:
        description: >-
          Wool, merino, cashmere, or wool-dominant blend. Primary material for
          scarves, hats, and gloves. Allergen signal for wool-sensitive beneficiaries.
        see_also: [pto:Wool]
        annotations:
          label_en: "Wool"
          label_de: "Wolle"
          aliases_en: ["Wool", "Merino", "Cashmere"]
          aliases_de: ["Wolle", "Merino", "Kamelhaar"]
      cotton:
        description: >-
          Cotton or cotton-dominant woven fabric. Common in fabric hats,
          canvas bags, and some gloves and scarves. All-season versatile.
        see_also: [pto:Cotton]
        annotations:
          label_en: "Cotton / Canvas"
          label_de: "Baumwolle / Canvas"
          aliases_en: ["Cotton", "Canvas"]
          aliases_de: ["Baumwolle", "Canvas"]
      silk:
        description: >-
          Silk or silk-blend. Typical for elegant scarves and ties.
          Requires specialist care (hand wash or dry clean).
        see_also: [pto:Silk]
        annotations:
          label_en: "Silk"
          label_de: "Seide"
          aliases_en: ["Silk"]
          aliases_de: ["Seide"]
      metal:
        description: >-
          Metal (gold, silver, base metal, stainless steel, or alloy).
          Predominant for jewellery, watch cases, belt buckles, and eyewear
          frames. Nickel in base metal alloys is a common allergen.
        see_also: [schema:material]
        annotations:
          label_en: "Metal"
          label_de: "Metall"
          aliases_en: ["Metal", "Gold", "Silver", "Stainless Steel", "Alloy"]
          aliases_de: ["Metall", "Gold", "Silber", "Edelstahl", "Legierung"]
      plastic:
        description: >-
          Plastic or acrylic. Common for sunglasses frames, costume jewellery,
          and some bags. Wide range of types — record specifics in sorting_notes
          if relevant (e.g. recycled plastic, BPA-free for baby accessories).
        see_also: [schema:material]
        annotations:
          label_en: "Plastic"
          label_de: "Kunststoff"
          aliases_en: ["Plastic", "Acrylic"]
          aliases_de: ["Kunststoff", "Acryl"]
      synthetic:
        description: >-
          Synthetic fabric or material — nylon, polyester, or other man-made
          fibres. Common in nylon bags, polyester scarves, and synthetic gloves.
          Distinct from leather_faux_leather (which mimics leather texture).
        see_also: [schema:material]
        annotations:
          label_en: "Synthetic"
          label_de: "Synthetik"
          aliases_en: ["Synthetic", "Nylon", "Polyester"]
          aliases_de: ["Synthetisch", "Nylon", "Polyester"]
      natural_fibre:
        description: >-
          Natural plant-based fibres other than cotton — straw, raffia,
          jute, bamboo, rattan, wicker. Common in summer hats and baskets.
        see_also: [schema:material]
        annotations:
          label_en: "Natural Fibre (Straw / Raffia / Wicker)"
          label_de: "Naturfaser (Stroh / Bast / Weide)"
          aliases_en: ["Natural Fibre", "Straw", "Raffia", "Wicker"]
          aliases_de: ["Naturfaser", "Stroh", "Bast", "Weide"]
      glass_crystal:
        description: >-
          Glass or crystal elements. Common in costume jewellery (glass beads,
          crystal pendants) and some decorative accessories.
        see_also: [schema:material]
        annotations:
          label_en: "Glass / Crystal"
          label_de: "Glas / Kristall"
          aliases_en: ["Glass", "Crystal"]
          aliases_de: ["Glas", "Kristall"]
      other:
        description: >-
          Materials not covered above. Record the specific material in
          sorting_notes when known.
        see_also: [schema:material]
        annotations:
          label_en: "Other"
          label_de: "Andere"
          aliases_en: ["Other", "Miscellaneous", "Unknown"]
          aliases_de: ["Sonstige", "Verschiedenes", "Unbekannt"]
  AccessoriesDemographicEnum:
    description: >-
      Simplified age-group demographic for accessories. Gender split not
      modelled — gender is not a meaningful dimension for most accessories
      at the sorting level. This contrasts with DemographicEnum (clothing.yaml)
      which carries adult_male/adult_female because clothing size systems
      are gender-differentiated. Use only when the item clearly targets a
      specific age group (e.g. children's hat, baby mittens).
    permissible_values:
      baby:
        description: "Baby (0-24 months). e.g. baby hats, scratch mittens."
        annotations:
          label_en: "Baby"
          label_de: "Baby"
          aliases_en: ["Baby", "Infant", "Newborn"]
          aliases_de: ["Baby", "Säugling", "Neugeborenes"]
      child:
        description: "Child (2-14 years). e.g. children's hats, gloves."
        annotations:
          label_en: "Children"
          label_de: "Kinder"
          aliases_en: ["Child", "Minor"]
          aliases_de: ["Kind", "Minderjähriger"]
      adult:
        description: "Adult. Default for most accessories when demographic matters."
        annotations:
          label_en: "Adults"
          label_de: "Erwachsene"
          aliases_en: ["Adult", "General"]
          aliases_de: ["Erwachsene", "Allgemein"]
      all_ages:
        description: "Suitable for all ages or demographic not applicable."
        annotations:
          label_en: "All ages"
          label_de: "Alle"
          aliases_en: ["All", "Universal", "Unisex"]
          aliases_de: ["Alle", "Universell", "Unisex"]
