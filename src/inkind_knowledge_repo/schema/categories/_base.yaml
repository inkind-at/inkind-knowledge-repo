---
id: https://inkind-at.github.io/inkind-knowledge-repo/categories/_base
name: _base
title: Base Category Schema
description: >-
  Common slots and the abstract CategoryMixin base shared across all
  item category schemas.

  Each category file defines a concrete mixin class (e.g. ClothingCategory)
  extending CategoryMixin, carrying category-specific slots, value map
  rules (vm-*), domain UC rules (uc-*), and completeness tier annotations.
  Category files are the single source of truth for everything that varies
  by item type — domain experts editing clothing constraints only touch
  categories/clothing.yaml. Lifecycle-aware rules (lc-*, preconditions
  referencing lifecycle_state) can't live here since lifecycle_state is a
  DonationItem slot invisible to the mixin — those live on the item
  subclasses in donation_item.yaml.

  CategoryMixin deliberately declares no condition rule — condition
  approaches are incompatible across categories (condition_grade for
  wear-graded categories, a category-specific assessment_result enum for
  assessment categories, packaging_intact+expiry_date for FoodCategory,
  which for this reason doesn't extend CategoryMixin at all).

  Completeness annotations (completeness_minimal/standard/detailed) are
  read by the fragment compiler to configure the sorting UI, and by the
  match engine via attribute_completeness to filter demand signal matching.

  Category structure follows COICOP 2018, UNHCR NFI standards, and Open
  Eligibility taxonomy — see core.yaml's BaseCategoryEnum for per-category
  grounding.

license: MIT
see_also:
  - https://unstats.un.org/unsd/classifications/Family/Detail/2094
  - https://emergency.unhcr.org/emergency-assistance/core-relief-items/kind-non-food-item-distribution
  - https://company.auntbertha.com/openeligibility/

prefixes:
  inkind_knowledge_repo: https://inkind-at.github.io/inkind-knowledge-repo/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/

default_prefix: inkind_knowledge_repo
default_range: string

imports:
  - linkml:types
  - ../core

classes:

  CategoryMixin:
    mixin: true
    description: >-
      Abstract mixin base for all category classes except FoodCategory (see
      schema description above for why). Provides shared slots (material).
      Does not declare a condition rule — each category type handles
      condition differently.
    slots:
      - material


slots:
  
  demographic:
    range: DemographicEnum
    description: >-
      Combined age-and-gender demographic suitability of clothing items.
      Valid values depend on subcategory (see value_map above).
      Grounded in cpi:designatedFor and schema.org wearable size groups.
      Not applicable to AccessoriesItem — accessories use the simpler
      AccessoriesDemographicEnum (baby/child/adult/all_ages).
    see_also:
      - cpi:designatedFor
      - schema:WearableSizeGroupBaby
      - schema:WearableSizeGroupChildrens
      - schema:WearableSizeGroupAdult
    annotations:
      label_en: "Demographic"
      label_de: "Geeignet für"

  is_set_complete:
    range: boolean
    description: >-
      Whether all components of the set are present. Optional — standard completeness tier.
    annotations:
      label_en: "Set Complete"
      label_de: "Set vollständig"

  age_range:
    range: string
    description: >-
      Age suitability. Range overridden per class:
        ToysItem  → ToyAgeRangeEnum
        BooksItem → BookAgeRangeEnum
    annotations:
      label_en: "Age Range"
      label_de: "Altersempfehlung"

  expiry_date:
    range: date
    description: >-
      Expiry or best-before date. UC block: expiry_date < today (runtime check).
    annotations:
      uc_action: block
      uc_suggest: disposal
      uc_note: "Dynamic date comparison — runtime enforcement"
      label_en: "Expiry Date"
      label_de: "Ablaufdatum"

  is_sealed:
    range: boolean
    description: >-
      Whether the item's original packaging/seal is intact.
      UC block for most consumable subcategories when false.
      Primary safety signal for personal care items — replaces condition_grade.
    annotations:
      label_en: "Sealed Packaging"
      label_de: "Originalverpackt"
