---
id: https://inkind-at.github.io/inkind-knowledge-repo/categories/food
name: food
title: Food Category Schema
description: >-
  Defines FoodCategory mixin applied to FoodItem. COICOP Division 01.
  Referenced also by UNHCR (food is a parallel core relief stream to NFIs)
  and Open Eligibility ("Food" top-level category parallel to "Goods").
  Ontology grounding: FoodOn (OBO Foundry food ontology), per-value foodon:
  IRIs on FoodTypeEnum.

  Phase 1 stub — fully declared to establish the schema; the sort_food
  process path activates once food-bank organisations are onboarded.

  Uses NEITHER condition_grade NOR assessment_result — packaging_intact +
  expiry_date is the complete vocabulary (a wear grade is meaningless for a
  tin of beans), same pattern as PersonalCareCategory's is_sealed +
  expiry_date. Does NOT extend CategoryMixin, since that would pull in
  slots (notes, material) that don't apply to food.

  Valid storage_requirement values are constrained per subcategory by
  vm-storage-* rules (e.g. meat_fish excludes ambient).

license: MIT
see_also:
  - http://purl.obolibrary.org/obo/foodon.owl
  - https://unstats.un.org/unsd/classifications/Family/Detail/2094
  - https://emergency.unhcr.org/emergency-assistance/core-relief-items/
  - https://company.auntbertha.com/openeligibility/

prefixes:
  inkind_knowledge_repo: https://inkind-at.github.io/inkind-knowledge-repo/
  linkml: https://w3id.org/linkml/
  foodon: http://purl.obolibrary.org/obo/FOODON_

default_prefix: inkind_knowledge_repo
default_range: string

imports:
  - linkml:types
  - ../core
  - ./_context_rules


classes:

  FoodPhysicalItemMixin:
    mixin: true
    is_a: FoodCategory
    mixins: [FoodContextRulesMixin]
    description: >-
      Shared physical-item dispatch target for the Food category, used
      identically by DonationItem, StorageCollection, and SortedCollection.
      Pure composition — no slots or rules of its own.

  FoodCategory:
    mixin: true
    # Intentionally does NOT extend CategoryMixin — see schema description.
    description: >-
      Mixin for food-specific slots, value maps, and UC rules.
      Applied to FoodItem via mixins: [FoodCategory].
    see_also:
      - foodon:00001006
      - http://purl.obolibrary.org/obo/foodon.owl
    slots:
      - subcategory
      - expiry_date
      - packaging_intact
      - storage_requirement
      - net_content_value
      - net_content_unit
    slot_usage:
      subcategory:
        range: FoodTypeEnum
        required: true
        description: >-
          Primary food type classification. Grounded in FoodOn food product
          taxonomy. Determines valid storage_requirement values via value map.
        see_also:
          - foodon:00001017
        annotations:
          label_en: "Food category"
          label_de: "Lebensmittelgruppen"
      packaging_intact:
        required: false
      storage_requirement:
        required: false
      expiry_date:
        description: >-
          Expiry or best-before date as printed on the packaging.
          UC block: expiry_date < today (runtime check by Django model clean()).
        see_also:
          - foodon:00001043
        annotations:
          uc_action: block
          uc_suggest: disposal
          uc_note: "Dynamic date comparison — runtime enforcement"
    annotations:
      completeness_minimal:  "subcategory, storage_requirement"
      completeness_standard: "subcategory, packaging_intact, storage_requirement, usage"
      completeness_detailed: "subcategory, packaging_intact, storage_requirement, expiry_date, net_content_value, net_content_unit, usage"
      coicop_division: "01"
      phase: "Phase 1 stub"
      label_en: "Food"
      label_de: "Lebensmittel"
      aliases_en: ["food", "food item"]
      aliases_de: ["Essen", "Lebensmittel"]
    rules:
      - title: lc-food-packaging-intact-required
        description: >-
          packaging_intact required, except for subcategories commonly
          donated without commercial packaging: bread_bakery (loose bakery
          excess), fruit_vegetables (loose fresh produce), and meat_fish
          (butcher-paper wrapping isn't tamper-evident commercial packaging
          either). Forcing an answer for these risks a sorter recording
          packaging_intact=false for a genuinely unpackaged item, which would
          incorrectly trigger uc-packaging-perishable-block. No
          lifecycle_state precondition — FoodCategory is shared with
          DemandSignal, which has no lifecycle_state slot.
        preconditions:
          slot_conditions:
            subcategory:
              none_of:
                - equals_string: bread_bakery
                - equals_string: fruit_vegetables
                - equals_string: meat_fish
                - equals_string: other
        postconditions:
          slot_conditions:
            packaging_intact:
              required: true

      - title: uc-packaging-perishable-block
        description: >-
          Perishable items with compromised packaging must not be redistributed.
          Food safety principle — perishable items cannot be safely redistributed
          once packaging integrity is lost. action: block.
        preconditions:
          slot_conditions:
            packaging_intact:
              equals_string: "false"
            subcategory:
              any_of:
                - equals_string: fruit_vegetables
                - equals_string: dairy_eggs
                - equals_string: meat_fish
                - equals_string: baby_food
                - equals_string: ready_meals
        postconditions:
          slot_conditions:
            lifecycle_state:
              none_of:
                - equals_string: stored
                - equals_string: distributed

      - title: uc-expiry-date-past-block
        description: >-
          Items past expiry date must not be redistributed. Runtime check —
          dynamic date comparison not expressible as a static LinkML rule.
          Enforced by Django model clean() at save time.
        preconditions: {}
        annotations:
          enforcement: application_layer
          uc_action: block
          uc_suggest: disposal
          uc_note: "expiry_date < today — runtime check by Django model clean()"

      # ── VM: storage requirements by food type ─────────────────────────────
      # "other" is intentionally unconstrained — it already spans the full
      # StorageRequirementEnum range, so a rule would be a no-op.
      - title: vm-storage-bread-bakery
        description: Bread and bakery goods are ambient or frozen — never refrigerated.
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: bread_bakery
        postconditions:
          slot_conditions:
            storage_requirement:
              any_of:
                - equals_string: ambient
                - equals_string: frozen

      - title: vm-storage-fruit-vegetables
        description: Fruit and vegetables may be stored ambient, refrigerated, or frozen.
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: fruit_vegetables
        postconditions:
          slot_conditions:
            storage_requirement:
              any_of:
                - equals_string: ambient
                - equals_string: refrigerated
                - equals_string: frozen

      - title: vm-storage-meat-fish
        description: >-
          Meat and fish require refrigerated or frozen storage — never
          ambient, for food safety.
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: meat_fish
        postconditions:
          slot_conditions:
            storage_requirement:
              any_of:
                - equals_string: refrigerated
                - equals_string: frozen

      - title: vm-storage-dairy-eggs
        description: Dairy and eggs require refrigerated or frozen storage.
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: dairy_eggs
        postconditions:
          slot_conditions:
            storage_requirement:
              any_of:
                - equals_string: refrigerated
                - equals_string: frozen

      - title: vm-storage-dry-goods
        description: Dry goods are shelf-stable — ambient or dry_cool storage only.
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: dry_goods
        postconditions:
          slot_conditions:
            storage_requirement:
              any_of:
                - equals_string: ambient
                - equals_string: dry_cool

      - title: vm-storage-canned
        description: Canned goods are shelf-stable — ambient storage only.
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: canned_goods
        postconditions:
          slot_conditions:
            storage_requirement:
              equals_string: ambient

      - title: vm-storage-beverages
        description: Beverages are stored ambient or refrigerated.
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: beverages
        postconditions:
          slot_conditions:
            storage_requirement:
              any_of:
                - equals_string: ambient
                - equals_string: refrigerated

      - title: vm-storage-snacks-confectionery
        description: Snacks and confectionery are shelf-stable — ambient storage only.
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: snacks_confectionery
        postconditions:
          slot_conditions:
            storage_requirement:
              equals_string: ambient

      - title: vm-storage-condiments
        description: Condiments are stored ambient or refrigerated (once opened).
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: condiments
        postconditions:
          slot_conditions:
            storage_requirement:
              any_of:
                - equals_string: ambient
                - equals_string: refrigerated

      - title: vm-storage-ready-meals
        description: >-
          Ready meals may be shelf-stable ambient, chilled, or frozen,
          depending on preparation.
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: ready_meals
        postconditions:
          slot_conditions:
            storage_requirement:
              any_of:
                - equals_string: ambient
                - equals_string: refrigerated
                - equals_string: frozen

      - title: vm-storage-baby-food
        description: Baby food is stored ambient or refrigerated (once opened).
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: baby_food
        postconditions:
          slot_conditions:
            storage_requirement:
              any_of:
                - equals_string: ambient
                - equals_string: refrigerated


slots:

  packaging_intact:
    range: boolean
    required: true
    description: >-
      Whether the item's original packaging is intact and uncompromised.
      Required except for bread_bakery, fruit_vegetables, and meat_fish —
      commonly donated without commercial packaging (loose bakery goods,
      loose produce, butcher-wrapped meat/fish). See
      lc-food-packaging-intact-required.
      UC block: false + perishable subcategory → must not redistribute.
      Primary safety signal for food items — analogous to is_sealed in
      PersonalCareCategory.
    see_also:
      - foodon:00001043
    annotations:
      label_en: "packaging intact"
      label_de: "Ungeöffnet & unbeschädigt"

  storage_requirement:
    range: StorageRequirementEnum
    required: true
    description: >-
      Required storage condition. Valid values constrained by subcategory
      via vm-storage-* rules. Set during sorting to enable correct
      storage slot assignment and demand signal matching.
    annotations:
      label_en: "Storage requirement"
      label_de: "Lagerhinweis"


enums:

  FoodTypeEnum:
    description: >-
      Primary food type classification. Grounded in FoodOn ontology (OBO Foundry).
      Each value maps to valid storage_requirement values via vm-storage-* rules.
    see_also:
      - foodon:00001017
    permissible_values:
      bread_bakery:
        description: >-
          Bread, rolls, pastries, cakes, and other baked goods.
          Storage: ambient or frozen.
        see_also: [foodon:03000288]
        annotations:
          label_en: "Bread & bakery"
          label_de: "Brot & Backwaren"
          aliases_en: ["Bread", "Bakery", "Bakery items", "Rolls", "Pastries", "Cakes"]
          aliases_de: ["Brot", "Backwaren", "Brötchen", "Gebäck", "Kuchen"]
      fruit_vegetables:
        description: >-
          Fresh fruit, vegetables, and herbs. Perishable — packaging_intact
          rule applies. May be stored ambient, refrigerated, or frozen.
        see_also: [foodon:00001015]
        annotations:
          label_en: "Fruit & vegetables"
          label_de: "Obst & Gemüse"
          aliases_en: ["Fruit and vegetables", "Produce", "Fresh produce", "Fruit", "Vegetable"]
          aliases_de: ["Obst und Gemüse", "Frischprodukte", "Obst", "Gemüse"]
      meat_fish:
        description: >-
          Fresh or frozen meat, poultry, sausage, fish, and seafood.
          Perishable — packaging_intact rule applies. Requires refrigerated
          or frozen storage.
        see_also: [foodon:03400793, foodon:03315173]
        annotations:
          label_en: "Fish & mean"
          label_de: "Fisch & Fleisch"
          aliases_en: ["Meat", "Fish", "Poultry", "Sausage", "Seafood"]
          aliases_de: ["Fleisch", "Fisch", "Geflügel", "Wurst", "Meeresfrüchte"]
      dairy_eggs:
        description: >-
          Milk, cheese, yoghurt, and eggs. Perishable — requires
          refrigeration or freezing.
        see_also: [foodon:00001180]
        annotations:
          label_en: "Dairy & eggs"
          label_de: "Milchprodukte & Eier"
          aliases_en: ["Dairy", "Milk", "Cheese", "Yogurt", "Eggs"]
          aliases_de: ["Milchprodukte", "Milch", "Käse", "Joghurt", "Eier"]
      dry_goods:
        description: >-
          Non-perishable dry staples: pasta, rice, flour, cereals, pulses.
          Storage: ambient or dry_cool.
        see_also: [foodon:00001256]
        annotations:
          label_en: "Dry goods"
          label_de: "Haltbare Lebensmittel"
          aliases_en: ["Dry goods", "Staples", "Pantry items", "Pasta", "Rice", "Flour", "Cereals", "Pulses"]
          aliases_de: ["Trockene Lebensmittel", "Grundnahrungsmittel", "Vorratsartikel", "Nudeln", "Reis", "Mehl", "Getreide", "Hülsenfrüchte"]
      canned_goods:
        description: >-
          Factory-sealed tins and cans. Shelf-stable at ambient temperature.
          Storage: ambient only.
        see_also: [foodon:00002403]
        annotations:
          label_en: "cCanned goods"
          label_de: "Konserven"
          aliases_en: ["Canned goods", "Canned items", "Can"]
          aliases_de: ["Dosenlebensmittel", "Konserven", "Dose"]
      beverages:
        description: Bottled or packaged drinks (non-alcoholic).
        see_also: [foodon:00001062]
        annotations:
          label_en: "Beverages"
          label_de: "Getränke"
          aliases_en: ["Beverages", "Drinks", "Juice", "Soda", "Water"]
          aliases_de: ["Getränke", "Saft", "Limonade", "Wasser"]
      snacks_confectionery:
        description: >-
          Sweet snacks (chocolate, sweets, candy, desserts) and savory snacks
          (crisps/chips, pretzels, popcorn, savory crackers, salted nuts).
          Merged into one bucket following DACH retail/food-bank sorting
          practice, where sweet and savory snacks share one shelf ("Süß &
          Salzig"). Storage: ambient.
        see_also: [foodon:03400978, foodon:03310825]
        annotations:
          label_en: "Snacks & confectionery"
          label_de: "Süß & Salzig"
          aliases_en: ["Confectionery", "Sweets", "Candy", "Chocolate", "Desserts", "Snacks", "Crisps", "Chips", "Pretzels", "Popcorn", "Crackers", "Nuts"]
          aliases_de: ["Süßwaren", "Süßigkeiten", "Bonbons", "Schokolade", "Nachspeisen", "Snacks", "Chips", "Salzgebäck", "Popcorn", "Cracker", "Nüsse"]
      ready_meals:
        description: >-
          Prepared meals — ambient (shelf-stable), refrigerated, or frozen.
        see_also: [foodon:03400172]
        annotations:
          label_en: "Ready meals"
          label_de: "Fertiggerichte"
          aliases_en: ["Ready meals", "Prepared meals", "Convenience meals"]
          aliases_de: ["Fertiggerichte", "Fertigkost", "Convenience-Food"]
      baby_food:
        description: >-
          Commercially prepared solid baby food (purées, jars, pouches).
          Perishable once opened — packaging_intact rule applies.
          Note: infant formula belongs in BabyInfantItem
          (subcategory=infant_formula), not here; this value covers baby food
          donated as part of a food collection.
        see_also: [foodon:00002640]
        annotations:
          label_en: "Baby food"
          label_de: "Babynahrung"
          aliases_en: ["Baby food", "Infant food"]
          aliases_de: ["Babynahrung", "Säuglingsnahrung", "Püree", "Gläschen"]
      condiments:
        description: Sauces, spreads, oils, vinegars, and seasoning products.
        see_also: [foodon:00001139]
        annotations:
          label_en: "Oils & Condiments"
          label_de: "Öle & Würzmittel"
          aliases_en: ["Condiments", "Sauces", "Spreads", "Oils", "Vinegar", "Seasoning"]
          aliases_de: ["Soße", "Aufstrich", "Öl", "Essig", "Gewürze", "Würzmittel", "Speiseöl"]
      other:
        description: Food items not fitting above categories.
        annotations:
          label_en: "other"
          label_de: "Sonstiges"

  StorageRequirementEnum:
    description: >-
      Required storage condition for a food item. Valid values per subcategory
      are constrained by vm-storage-* rules in FoodCategory.
    permissible_values:
      ambient:
        description: "Room temperature (15-25°C), dry conditions. Standard pantry/warehouse shelf."
        annotations:
          label_en: "Room temperature"
          label_de: "Raumtemperatur"
      refrigerated:
        description: "Refrigerated storage (0-4°C)."
        annotations:
          label_en: "Refrigerated"
          label_de: "Kühl lagern"
      frozen:
        description: "Frozen storage (-18°C or below)."
        annotations:
          label_en: "Frozen"
          label_de: "Tiefkühlt lagern"
      dry_cool:
        description: "Cool, dry conditions (8-15°C) — root vegetable or wine-cellar type."
        annotations:
          label_en: "Cool & dry"
          label_de: "Kühl & trocken lagern"
