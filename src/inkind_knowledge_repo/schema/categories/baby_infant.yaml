---
id: https://inkind-at.github.io/inkind-knowledge-repo/categories/baby_infant
name: baby_infant
title: Baby & Infant Supplies Category Schema
description: >-
  Defines BabyInfantCategory mixin applied to BabyInfantItem. COICOP
  otherwise scatters baby items across Divisions 03/05/01; treated as a
  first-class category here per Open Eligibility "Baby Supplies" and UNHCR
  NFI kit standards (nappies/formula are core relief items), and because
  baby equipment safety assessment needs rules a general HouseholdItem or
  ClothingItem category can't express. Ontology grounding: Product Types
  Ontology (pto:Baby_transport and per-subcategory IRIs).

  Safety standards behind the UC rules: EN 1888 (pushchairs), EN 716
  (cots — bans dropside), EN 14344 (car seats — 10-year limit), EN 14350
  (feeding equipment hygiene), EN 16781 (baby sleeping bags — neck/armhole
  openings, no loose cords).

  Three-track assessment model:
  Track 1 — safety-critical equipment (pushchairs_prams, cots_cribs,
  car_seats, baby_carriers, high_chairs, sleeping_bags): BabyEquipmentAssessmentEnum,
  structured provenance + structural assessment. Baby sleeping bags are here,
  not BeddingTextilesItem — EN 16781 differs materially from adult hygiene
  checks, and is_winter_suitable is also required (a summer-weight bag in a
  cold-weather response is a safety risk).
  Track 2 — consumables (infant_formula, feeding_bottles_teats, nappies,
  baby_care): is_sealed + expiry_date, same pattern as PersonalCareCategory.
  Nappies carry nappy_size (weight-banded, distinct from ClothingCategory's
  age-banded size). baby_care groups wipes/lotion/shampoo/etc. here rather
  than PersonalCareItem so sorters don't context-switch mid-box; assessment
  is identical to the adult-toiletry equivalents.
  Track 3 — general gear (bath_equipment, changing, baby_monitors,
  bouncers_swings, breastfeeding): condition_grade (wear grade).

license: MIT
see_also:
  - http://www.productontology.org/id/Baby_transport
  - https://company.auntbertha.com/openeligibility/
  - https://emergency.unhcr.org/emergency-assistance/core-relief-items/kind-non-food-item-distribution
  - https://unstats.un.org/unsd/classifications/Family/Detail/2094

prefixes:
  inkind_knowledge_repo: https://inkind-at.github.io/inkind-knowledge-repo/
  linkml: https://w3id.org/linkml/
  pto: http://www.productontology.org/id/

default_prefix: inkind_knowledge_repo
default_range: string

imports:
  - linkml:types
  - ./_base
  - ./_context_rules


classes:

  BabyInfantCategory:
    mixin: true
    is_a: CategoryMixin
    description: >-
      Mixin for baby and infant supply slots and UC rules — Tracks 2/3, see
      schema description above. Applied to BabyInfantItem via mixins:
      [BabyInfantCategory]. Track 1 assessment_result and its UC rules live
      on BabyEquipmentAssessmentMixin (below), so DemandSignal can dispatch
      to this bare mixin without that assessment content.
    see_also:
      - http://www.productontology.org/id/Baby_transport
      - https://company.auntbertha.com/openeligibility/
    slots:
      - subcategory
      - manufacture_year
      - includes_original_accessories
      - is_winter_suitable
      - is_sealed
      - expiry_date
      - condition_grade
      - nappy_size
    slot_usage:
      subcategory:
        range: BabyInfantSubcategoryEnum
        required: true
      is_winter_suitable:
        range: boolean
        required: false
        description: >-
          Whether this item provides meaningful warmth in cold conditions.
          Required for sleeping_bags (UC-enforced) — a summer-weight baby
          sleeping bag in cold-weather distribution is a safety risk.
          Thermal rating (e.g. "2.5 tog", "0°C comfort limit") may be
          noted in sorting_notes.
      is_sealed:
        required: false
        description: >-
          Packaging/seal integrity for Track 2 consumables.
          Required when subcategory in [infant_formula, feeding_bottles_teats,
          nappies].
      condition_grade:
        range: UsedConditionGradeEnum
        required: false
        description: >-
          Wear grade for Track 3 general baby gear.
          Required when subcategory in [bath_equipment, changing,
          baby_monitors, bouncers_swings, breastfeeding, other].
      nappy_size:
        range: NappySizeEnum
        required: false
        description: >-
          Weight-banded nappy size. Required when subcategory=nappies.
          Distinct from ClothingCategory's age-banded size slot — nappy fit
          is determined by infant weight, not age.
    annotations:
      completeness_minimal:  "subcategory"
      completeness_standard: "subcategory, usage, nappy_size"
      completeness_detailed: "subcategory, nappy_size, manufacture_year, is_complete_with_accessories, usage"
      track_structural_subcategories: "pushchairs_prams, cots_cribs, baby_carriers, high_chairs, car_seats, sleeping_bags"
      track_consumable_subcategories: "infant_formula, feeding_bottles_teats, nappies, baby_care"
      track_general_subcategories:    "bath_equipment, changing, baby_monitors, bouncers_swings, breastfeeding, other"
      regulatory_references: "EN 1888, EN 716, EN 14344, EN 14350, EN 16781"
      label_en: "Baby and infant supplies"
      label_de: "Baby- und Kleinkindbedarf"
      aliases_en: ["baby supplies", "infant supplies", "baby things", "infant things"]
      aliases_de: ["Babyausstattung", "Kleinkindausstattung", "Babybedarf", "Kleinkindbedarf", "Baby sachen"]
    rules:
      # ── Track 1: safety equipment, non-assessment_result rules ─────────────
      - title: uc-baby-car-seat-manufacture-year
        description: >-
          Car seats require manufacture_year to enable the runtime age check.
          EN 14344 standard — car seats over 10 years old or with unknown
          collision history must not be redistributed. manufacture_year must
          be recorded for all car seats (new and used) so the runtime check
          can verify the 10-year limit.
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: car_seats
        postconditions:
          slot_conditions:
            manufacture_year:
              required: true

      - title: uc-baby-sleeping-bag-winter-required
        description: >-
          Baby sleeping bags require is_winter_suitable to be explicitly set.
          A summer-weight baby sleeping bag (e.g. 0.5-1.0 tog) issued in a
          cold-weather response is a genuine safety risk — infants cannot
          regulate their own temperature. The thermal rating is typically
          printed on the label (tog, season number, or comfort temperature).
          action: warn — is_winter_suitable must be set at sorted state.
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: sleeping_bags
        postconditions:
          slot_conditions:
            is_winter_suitable:
              required: true

      # ── Track 2: consumables ──────────────────────────────────────────────
      - title: uc-baby-consumable-sealed-required
        description: >-
          Consumable baby items require sealed packaging. Nappies and formula
          are UNHCR NFI core relief items — hygiene integrity is essential.
          baby_care (wipes, powder, lotion, etc.) carries the same hygiene
          requirement as the adult toiletries it mirrors in PersonalCareCategory.
        preconditions:
          slot_conditions:
            subcategory:
              any_of:
                - equals_string: infant_formula
                - equals_string: feeding_bottles_teats
                - equals_string: nappies
                - equals_string: baby_care
        postconditions:
          slot_conditions:
            is_sealed:
              required: true

      - title: uc-baby-consumable-unsealed-block
        description: >-
          Unsealed consumable baby items must not be redistributed.
          action: block.
        preconditions:
          slot_conditions:
            subcategory:
              any_of:
                - equals_string: infant_formula
                - equals_string: feeding_bottles_teats
                - equals_string: nappies
                - equals_string: baby_care
            is_sealed:
              equals_string: "false"
        postconditions:
          slot_conditions:
            lifecycle_state:
              none_of:
                - equals_string: stored
                - equals_string: distributed

      - title: lc-baby-nappy-size-required
        description: >-
          Nappies require nappy_size. Weight-banded sizing is essential for
          matching donated nappies to the recipient infant's needs — an
          unsized nappy donation cannot be usefully distributed.
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: nappies
        postconditions:
          slot_conditions:
            nappy_size:
              required: true

      - title: uc-baby-feeding-used-block
        description: >-
          Used feeding bottles and teats must not be redistributed.
          Hygiene and infant safety — EN 14350 (drinking equipment for
          children). action: block — no override.
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: feeding_bottles_teats
            usage:
              equals_string: used
        postconditions:
          slot_conditions:
            lifecycle_state:
              none_of:
                - equals_string: stored
                - equals_string: distributed

      - title: uc-baby-consumable-expiry-block
        description: >-
          Consumables past expiry must not be redistributed. Runtime check.
        preconditions: {}
        annotations:
          enforcement: application_layer
          uc_action: block
          uc_suggest: disposal
          uc_note: "expiry_date < today — runtime check by Django model clean()"

      # ── Track 3: general baby gear ────────────────────────────────────────
      - title: uc-baby-general-condition-grade-required
        description: General baby gear requires condition_grade wear assessment.
        preconditions:
          slot_conditions:
            subcategory:
              any_of:
                - equals_string: bath_equipment
                - equals_string: changing
                - equals_string: baby_monitors
                - equals_string: bouncers_swings
                - equals_string: breastfeeding
                - equals_string: other
        postconditions:
          slot_conditions:
            condition_grade:
              required: true

  BabyEquipmentAssessmentMixin:
    mixin: true
    is_a: BabyInfantCategory
    mixins: [BabyInfantContextRulesMixin]
    description: >-
      Shared physical-item dispatch target for Baby & Infant Supplies — used
      identically by DonationItem, StorageCollection, and SortedCollection.
      Adds Track 1 assessment_result and its UC rules on top of
      BabyInfantCategory. Never used by DemandSignal.
    slots:
      - assessment_result
    slot_usage:
      assessment_result:
        range: BabyEquipmentAssessmentEnum
        required: false
        description: >-
          Structural/provenance assessment for Track 1 safety-critical equipment.
          Required when subcategory in [pushchairs_prams, cots_cribs,
          baby_carriers, high_chairs, car_seats, sleeping_bags].
    rules:
      # ── Track 1: safety equipment, assessment_result rules ─────────────────
      - title: uc-baby-equipment-assessment-required
        description: >-
          Safety-critical baby equipment requires a structured assessment.
          Required regardless of usage — new equipment can have defects.
          Standards: EN 1888 (pushchairs), EN 716 (cots), EN 14344 (car seats),
          EN 16781 (baby sleeping bags — neck/armhole openings, no loose cords).
        preconditions:
          slot_conditions:
            subcategory:
              any_of:
                - equals_string: pushchairs_prams
                - equals_string: cots_cribs
                - equals_string: baby_carriers
                - equals_string: high_chairs
                - equals_string: car_seats
                - equals_string: sleeping_bags
        postconditions:
          slot_conditions:
            assessment_result:
              required: true

      - title: uc-baby-equipment-unsafe-block
        description: >-
          Equipment assessed as do_not_redistribute or structural_concern
          must not be redistributed. action: block.
        preconditions:
          slot_conditions:
            assessment_result:
              any_of:
                - equals_string: do_not_redistribute
                - equals_string: structural_concern
        postconditions:
          slot_conditions:
            lifecycle_state:
              none_of:
                - equals_string: stored
                - equals_string: distributed

      - title: uc-baby-equipment-specialist-warn
        description: >-
          Equipment requiring specialist check before redistribution needs
          sorter confirmation. action: warn — sorting_notes required.
        preconditions:
          slot_conditions:
            assessment_result:
              equals_string: requires_specialist_check
        postconditions:
          slot_conditions:
            sorting_notes:
              required: true


slots:

  manufacture_year:
    range: integer
    description: >-
      Year of manufacture. Required for car seats (EN 14344 — 10-year
      redistribution limit). Recommended for cots (EN 716) and pushchairs
      (EN 1888) to verify age of safety-relevant components.
    annotations:
      show_if: "subcategory in [car_seats, cots_cribs, pushchairs_prams]"
      label_en: "Year of manufacture"
      label_de: "Herstellungsjahr"

  includes_original_accessories:
    range: boolean
    description: >-
      Whether standard accessories/components are included (e.g. pushchair
      includes rain cover and harness; cot includes mattress and side rails).
    annotations:
      label_en: "Original accessories included"
      label_de: "Originalzubehör vorhanden"

  nappy_size:
    range: NappySizeEnum
    description: >-
      Weight-banded nappy size, as printed on the pack. Required when
      subcategory=nappies (uc-baby-nappy-size-required). Nappy fit is
      determined by infant weight, not age, so this is a separate vocabulary
      from ClothingCategory's age-banded size slot — a nappy and a garment
      of the "same size" for a given infant are unrelated numbers.
    annotations:
      show_if: "subcategory in [nappies]"
      label_en: "Nappy size"
      label_de: "Windelgröße"



enums:

  BabyEquipmentAssessmentEnum:
    description: >-
      Structured safety assessment for safety-critical baby equipment
      (pushchairs, cots, car seats, carriers, high chairs). Required at
      sorting regardless of usage.

      Car seats (EN 14344): collision history can't be verified visually —
      over 10 years old or unknown history must receive do_not_redistribute;
      manufacture_year is required to enable the age check.
      Cots (EN 716): drop-side cots are EU-banned, always do_not_redistribute.
      Baby sleeping bags (EN 16781): verify neck/armhole opening safety, no
      loose cords/ties, no detachable decorative parts; is_winter_suitable
      must also be set.
    see_also:
      - https://eur-lex.europa.eu/  # EN 14344, EN 716, EN 1888
    permissible_values:
      safe_to_redistribute:
        description: >-
          Structurally sound; all components present; manufacture date within
          acceptable range; no safety concerns. Ready for redistribution.
          Appropriate for new items with no observed defects.
        annotations:
          label_en: "Suitable to redistribute"
          label_de: "Zur Weitergabe geeignet"
      safe_minor_wear:
        description: >-
          Minor cosmetic wear but structurally sound and all safety-relevant
          components intact. Safe to redistribute.
        annotations:
          label_en: "Minor signs of wear"
          label_de: "Leichte Gebrauchsspuren"
      requires_specialist_check:
        description: >-
          Appears functional but sorter cannot fully verify safety (unknown
          locking mechanism, unfamiliar harness system, unclear provenance).
          action: warn — redistribution only after specialist confirmation.
        annotations:
          label_en: "Professional assessment required"
          label_de: "Fachliche Prüfung erforderlich"
      structural_concern:
        description: >-
          Visible structural damage, cracked components, bent frame, broken
          harness buckle. Applies to new (manufacturing defect) and used items.
          action: block.
        annotations:
          label_en: "Safte concern"
          label_de: "Sicherheitsbedenken"
      do_not_redistribute:
        description: >-
          Must not be redistributed: car seat over 10 years old or confirmed
          post-collision (EN 14344), EU-banned dropside cot (EN 716), recalled
          model, missing critical safety components.
          action: block.
        annotations:
          label_en: "Not suitable for redistribution"
          label_de: "Nicht zur Weitergabe geeignet"

  BabyInfantSubcategoryEnum:
    description: >-
      Baby and infant supplies subcategories. Grounded in Product Types
      Ontology. Baby clothing belongs in ClothingItem (demographic=baby).
    permissible_values:
      pushchairs_prams:      {description: "Pushchairs, prams, strollers. Structural assessment required (EN 1888).", see_also: [pto:Baby_transport], annotations: {label_en: "Pram & strollers", label_de: "Kinderwagen & Buggys", aliases_en: ["pushchair", "pram", "stroller"], aliases_de: ["Kinderwagen"]}}
      car_seats:             {description: "Car and booster seats. Assessment + manufacture_year required (EN 14344).", see_also: [pto:Child_safety_seat], annotations: {label_en: "Car seats & booster", label_de: "Kindersitze & Sitzerhöhungen", aliases_en: ["car seat", "booster seat", "Maxi-Cosi"], aliases_de: ["Autositz", "Booster-Sitz", "Maxi-Cosi", "Kindersitz"]}}
      cots_cribs:            {description: "Cots, cribs, moses baskets. Structural assessment required (EN 716). Dropside cots banned.", see_also: [pto:Infant_bed], annotations: {label_en: "Cots & cribs", label_de: "Babybetten & Stubenwagen", aliases_en: ["cot", "crib", "moses basket"], aliases_de: ["Kinderbett", "Moseskorb", "Beistellbett", "Gitterbett"]}}
      baby_carriers:         {description: "Baby slings, carriers, wraps. Structural assessment required.", see_also: [pto:Baby_transport], annotations: {label_en: "Baby carriers", label_de: "Babytrage", aliases_en: ["baby carrier", "baby sling", "baby wrap"], aliases_de: ["Baby-Trage", "Baby-Hängematte", "Baby-Umhängetuch"]}}
      infant_formula:        {description: "Infant formula. Must be sealed + within expiry. UNHCR NFI core item.", see_also: [pto:Infant_formula], annotations: {label_en: "Infant formula", label_de: "Säuglingsnahrung"}}
      feeding_bottles_teats: {description: "Feeding bottles and teats. Must be sealed + unused (EN 14350).", annotations: {label_en: "Baby bottle & teats", label_de: "Babyflaschen & Sauger", aliases_en: ["feeding bottle", "teat", "bottle and teat", "baby bottle"], aliases_de: ["Flasche und Sauger", "Flasche mit Sauger", "Babyflasche", "Sauger"]}}
      nappies:               {description: "Baby nappies/diapers. Must be sealed. UNHCR NFI core item. nappy_size required.", see_also: [pto:Diaper], annotations: {label_en: "Nappies", label_de: "Windeln", aliases_en: ["nappy", "diaper", "nappies", "diapers"], aliases_de: ["Windel", "Windeln"]}}
      baby_care:             {description: "Baby wipes, powder, lotion, oil, wash, shampoo, diaper rash cream, teething gel, baby sunscreen. Must be sealed. (Adult-equivalent toiletries → PersonalCareItem.)", annotations: {label_en: "Baby care", label_de: "Babypflege", aliases_en: ["baby wipes", "wet wipes", "baby powder", "baby lotion", "baby oil", "baby wash", "baby shampoo", "diaper rash cream", "nappy cream", "teething gel", "baby sunscreen"], aliases_de: ["Feuchttücher", "Babypuder", "Babylotion", "Babyöl", "Baby-Waschlotion", "Baby-Shampoo", "Wundschutzcreme", "Zahnungsgel", "Baby-Sonnencreme"]}}
      breastfeeding:         {description: "Breast pumps, nursing pads, sterilisers.", annotations: {label_en: "Breastfeeding supplies", label_de: "Stillzubehör", aliases_en: ["breastfeeding supplies", "breast pump", "nursing pads", "steriliser"], aliases_de: ["Brustpflegeartikel", "Brustpumpe", "Stilleinlagen", "Sterilisator"]}}
      bath_equipment:        {description: "Baby baths, bath seats, bath thermometers.", annotations: {label_en: "Bath equipment", label_de: "Badezubehör (Baby & Kleinkind)", aliases_en: ["baby bath", "bath seat", "bath thermometer"], aliases_de: ["Babybadewanne", "Badsitz", "Badethermometer"]}}
      changing:              {description: "Changing mats, nappy bags, changing bags.", annotations: {label_en: "Changing supplies", label_de: "Wickelzubehör", aliases_en: ["changing mat", "nappy bag", "changing bag"], aliases_de: ["Wickelunterlage", "Windeltasche", "Wickeltasche", "Wickelzubehör"]}}
      baby_monitors:         {description: "Audio and video baby monitors.", see_also: [pto:Baby_monitor], annotations: {label_en: "Baby monitors", label_de: "Babyphones", aliases_en: ["baby monitor", "audio monitor", "video monitor", "babyphone"], aliases_de: ["Baby-Überwachungskamera", "Audio-Monitor", "Video-Monitor", "Babyphone"]}}
      bouncers_swings:       {description: "Baby bouncers, swings, rockers, play gyms.", annotations: {label_en: "Bouncers & swings", label_de: "Babywippen & Schaukeln", aliases_en: ["bouncer", "swing", "rocker", "play gym"], aliases_de: ["Kinderwippe", "Schaukel", "Rocker", "Spielgerät"]}}
      sleeping_bags:
        description: >-
          Baby sleeping bags for home use (0-24 months). Track 1 — structured
          safety assessment required per EN 16781:2018. Sorter must verify:
            - Neck opening size appropriate (infant cannot slip inside)
            - Armhole openings present and correctly sized
            - No loose cords, drawstrings, or ribbon ties (strangulation hazard)
            - No small decorative parts that could detach (choking hazard)
          is_winter_suitable required — thermal weight varies widely from
          0.5 tog (summer) to 3.5 tog (winter). Tog or comfort temperature
          rating is typically printed on the label.
          Adult and camping sleeping bags → BeddingTextilesItem.
        see_also:
          - pto:Sleeping_bag
        annotations:
          label_en: "Baby sleeping bags"
          label_de: "Baby-Schlafsäcke"
          aliases_en: ["baby sleeping bag", "infant sleeping bag", "baby sleep sack", "infant sleep sack"]
          aliases_de: ["Baby-Schlafsack", "Säuglings-Schlafsack", "Baby-Schlafsack mit Beinen", "Säuglings-Schlafsack mit Beinen"]
      other: {description: "Baby and infant supplies not fitting above subcategories.", annotations: {label_en: "Other baby/infant item", label_de: "Sonstiger Baby-/Kleinkindartikel"}}

  NappySizeEnum:
    description: >-
      Weight-banded nappy sizing, matching how nappies are sized and labeled
      by manufacturers. Distinct from ClothingSizeEnum's age-banded baby
      sizes, since nappy fit tracks infant weight rather than age. Bands are
      approximate and vary slightly by brand — the weight range printed on
      the pack is authoritative; sorters should match to the closest band.
    see_also:
      - pto:Diaper
    permissible_values:
      newborn:  {description: "Newborn, up to ~4kg.", annotations: {label_en: "Newborn", label_de: "Neugeborene", aliases_en: ["newborn", "size 0"], aliases_de: ["Neugeboren", "Größe 0"]}}
      size_1:   {description: "Size 1, ~2-5kg.", annotations: {label_en: "Size 1", label_de: "Größe 1"}}
      size_2:   {description: "Size 2, ~3-6kg.", annotations: {label_en: "Size 2", label_de: "Größe 2"}}
      size_3:   {description: "Size 3, ~4-9kg.", annotations: {label_en: "Size 3", label_de: "Größe 3"}}
      size_4:   {description: "Size 4, ~7-18kg.", annotations: {label_en: "Size 4", label_de: "Größe 4"}}
      size_5:   {description: "Size 5, ~11-25kg.", annotations: {label_en: "Size 5", label_de: "Größe 5"}}
      size_6:   {description: "Size 6, ~16kg and up.", annotations: {label_en: "Size 6", label_de: "Größe 6"}}
      other:    {description: "Size not fitting the standard bands, or unlabeled/unknown.", annotations: {label_en: "Other / Unknown", label_de: "Andere / Unbekannt"}}
