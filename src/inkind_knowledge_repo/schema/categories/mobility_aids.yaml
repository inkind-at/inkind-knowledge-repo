---
id: https://inkind-at.github.io/inkind-knowledge-repo/categories/mobility_aids
name: mobility_aids
title: Mobility Aids & Assistive Devices Category Schema
description: >-
  Defines MobilityAidsCategory mixin applied to MobilityAidsItem. COICOP
  Division 06.1.3 (other medical products) and 06.2 (durable medical
  equipment). Open Eligibility "Assistive Technology" top-level category.
  Ontology grounding: Product Types Ontology (pto:Assistive_technology and
  per-subcategory IRIs).

  Uses MobilityAssessmentEnum (structural + functional + hygiene in one
  vocabulary) instead of separate boolean slots — captures that
  body-contact items (hearing aids, orthotics) need hygiene assessment
  independent of structural soundness. assessment_result required
  regardless of usage since new items can have manufacturing defects.

license: MIT
see_also:
  - http://www.productontology.org/id/Assistive_technology
  - https://company.auntbertha.com/openeligibility/
  - https://unstats.un.org/unsd/classifications/Family/Detail/2094

prefixes:
  inkind_knowledge_repo: https://inkind-at.github.io/inkind-knowledge-repo/
  linkml: https://w3id.org/linkml/
  pto: http://www.productontology.org/id/

default_prefix: inkind_knowledge_repo
default_range: string

imports:
  - linkml:types
  - ./_base
  - ./_context_rules


classes:

  MobilityAidsCategory:
    mixin: true
    is_a: CategoryMixin
    description: >-
      Mixin for mobility aids and assistive device slots and UC rules.
      Applied to MobilityAidsItem via mixins: [MobilityAidsCategory].
      assessment_result and its UC rules live on MobilityAssessmentMixin
      (below) so DemandSignal can dispatch to this bare mixin without
      assessment content that only applies to a physical item in hand.
    see_also:
      - http://www.productontology.org/id/Assistive_technology
      - https://company.auntbertha.com/openeligibility/
    slots:
      - subcategory
    slot_usage:
      subcategory:
        range: MobilityAidsSubcategoryEnum
        required: true
    annotations:
      completeness_minimal:  "subcategory"
      completeness_standard: "subcategory, usage"
      completeness_detailed: "subcategory, usage"
      coicop_divisions: "06.1.3, 06.2"
      open_eligibility_category: "Assistive Technology"
      label_en: "Mobility Aids and Assistive Devices"
      label_de: "Mobilitätshilfen und Hilfsgeräte"
      aliases_en: ["mobility aids", "assistive devices"]
      aliases_de: ["Mobilitätshilfen", "Hilfsgeräte"]

  MobilityAssessmentMixin:
    mixin: true
    is_a: MobilityAidsCategory
    mixins: [MobilityAidsContextRulesMixin]
    description: >-
      Shared physical-item dispatch target for Mobility Aids — used
      identically by DonationItem, StorageCollection, and SortedCollection.
      Adds assessment_result and its UC rules on top of MobilityAidsCategory.
      Never used by DemandSignal.
    slots:
      - assessment_result
    slot_usage:
      assessment_result:
        range: MobilityAssessmentEnum
        required: false
        description: Safety and hygiene assessment. Required regardless of usage.
    annotations:
      completeness_minimal:  "subcategory, assessment_result"
      completeness_standard: "subcategory, assessment_result, usage"
      completeness_detailed: "subcategory, assessment_result, usage"
      coicop_divisions: "06.1.3, 06.2"
      open_eligibility_category: "Assistive Technology"
    rules:
      - title: uc-mobility-compromised-block
        description: >-
          Structurally compromised items must not be redistributed.
          Safety-critical — applies to new (manufacturing defect) and used items.
          action: block, suggest: disposal or specialist repair referral.
        preconditions:
          slot_conditions:
            assessment_result:
              equals_string: structurally_compromised
        postconditions:
          slot_conditions:
            lifecycle_state:
              none_of:
                - equals_string: stored
                - equals_string: distributed

      - title: uc-mobility-specialist-required-block
        description: >-
          Items requiring specialist assessment must not enter general
          redistribution. Flag for specialist organisation referral.
          action: block from normal redistribution path.
        preconditions:
          slot_conditions:
            assessment_result:
              equals_string: specialist_referral_required
        postconditions:
          slot_conditions:
            lifecycle_state:
              none_of:
                - equals_string: stored
                - equals_string: distributed

      - title: uc-mobility-safe-after-cleaning-warn
        description: >-
          Body-contact items (hearing aids, orthotics) requiring cleaning
          before redistribution need sorter confirmation.
          action: warn — sorting_notes required documenting cleaning recommendation.
        preconditions:
          slot_conditions:
            assessment_result:
              equals_string: safe_after_cleaning
        postconditions:
          slot_conditions:
            sorting_notes:
              required: true

      - title: uc-mobility-non-functional-warn
        description: >-
          Non-functional powered devices require sorter confirmation.
          action: warn — sorting_notes required.
        preconditions:
          slot_conditions:
            assessment_result:
              equals_string: non_functional
        postconditions:
          slot_conditions:
            sorting_notes:
              required: true


enums:

  MobilityAssessmentEnum:
    description: >-
      Structured safety and hygiene assessment for mobility aids and
      assistive devices, covering structural soundness, functional state,
      and body-contact hygiene in one vocabulary. Required at sorting
      regardless of usage.
    permissible_values:
      safe_to_redistribute:
        description: >-
          Structurally sound, fully functional (if powered), and clean.
          No hygiene concerns for body-contact items. Ready for redistribution.
          Appropriate for new items with no observed defects.
        annotations:
          label_en: "Safe to Redistribute"
          label_de: "Sicher zur Weiterverteilung"
      safe_cosmetic_wear_only:
        description: >-
          Minor cosmetic wear but structurally sound and fully functional.
          Safe to redistribute.
        annotations:
          label_en: "Safe with Cosmetic Wear"
          label_de: "Sicher mit kosmetischen Gebrauchsspuren"
      safe_after_cleaning:
        description: >-
          Body-contact item (hearing aid, orthotic) that is structurally sound
          but requires professional cleaning before redistribution.
          action: warn — sorting_notes required.
        annotations:
          label_en: "Safe After Cleaning"
          label_de: "Nach Reinigung sicher" 
      non_functional:
        description: >-
          Powered device does not operate as expected. Consider repair referral.
          action: warn — sorting_notes required.
        annotations:
          label_en: "Non-Functional"
          label_de: "Nicht funktionsfähig"  
      structurally_compromised:
        description: >-
          Load-bearing or structural components unsafe. Applies regardless of usage.
          action: block, suggest: disposal or specialist repair referral.
        annotations:
          label_en: "Structurally Compromised"
          label_de: "Strukturell beeinträchtigt"
      specialist_referral_required:
        description: >-
          Cannot be assessed by a general sorter — specialist evaluation required
          (prosthetics, complex orthotics, specialised communication devices).
          action: block from normal redistribution; flag for specialist organisation.
        annotations:
          label_en: "Specialist Referral Required"
          label_de: "Spezialistenbewertung erforderlich"  

  MobilityAidsSubcategoryEnum:
    description: >-
      Mobility aids and assistive devices subcategories.
      Grounded in Product Types Ontology and Open Eligibility taxonomy.
    permissible_values:
      wheelchairs:          {description: "Manual and powered wheelchairs. Structural + functional assessment required.", see_also: [pto:Wheelchair], annotations: {label_en: "Wheelchairs", label_de: "Rollstühle", aliases_en: ["Wheelchair", "Manual Wheelchair", "Powered Wheelchair"], aliases_de: ["Rollstuhl", "Manueller Rollstuhl", "Elektrischer Rollstuhl"]}}
      crutches:             {description: "Axillary and forearm crutches, walking sticks. Structural assessment.", see_also: [pto:Crutch], annotations: {label_en: "Crutches and Walking Sticks", label_de: "Krücken und Gehstöcke", aliases_en: ["Crutch", "Walking Stick", "Cane"], aliases_de: ["Krücke", "Gehstock", "Stock"]}}
      walking_frames:       {description: "Walking frames, Zimmer frames, wheeled walkers, rollators.", see_also: [pto:Walking_frame], annotations: {label_en: "Walking Frames", label_de: "Gehgestelle", aliases_en: ["Walking Frame", "Zimmer Frame", "Wheeled Walker", "Rollator"], aliases_de: ["Gehgestell", "Rollator"]}}
      mobility_scooters:    {description: "Electric mobility scooters. Full functional + structural assessment.", annotations: {label_en: "Mobility Scooters", label_de: "Mobilitätsscooter",alias_en: ["Mobility Scooter", "Electric Scooter"], aliases_de: ["Mobilitätsscooter", "Elektroroller"]}}
      hearing_aids:         {description: "In-ear and behind-ear hearing aids. Body-contact — safe_after_cleaning minimum.", see_also: [pto:Hearing_aid], annotations: {label_en: "Hearing Aids", label_de: "Hörgeräte", aliases_en: ["Hearing Aid", "In-ear Hearing Aid", "Behind-ear Hearing Aid"], aliases_de: ["Hörgerät", "In-Ear-Hörgerät", "Hinter-dem-Ohr-Hörgerät"]}}
      visual_aids:          {description: "Reading glasses (non-prescription), magnifiers, white canes.", annotations: {label_en: "Visual Aids", label_de: "Sehhilfen", aliases_en: ["Visual Aid", "Reading Glasses", "Magnifier", "White Cane"], aliases_de: ["Sehhilfe", "Lesebrille", "Lupe", "Weißer Stock"]}}
      orthotics:            {description: "Splints, braces, supports. Body-contact assessment applies.", see_also: [pto:Orthopedic_equipment], annotations: {label_en: "Orthotics", label_de: "Orthesen", aliases_en: ["Orthotic", "Splint", "Brace", "Support"], aliases_de: ["Orthese", "Schiene", "Bandage", "Stütze"]}}
      prosthetics:          {description: "Prosthetic limbs. Specialist referral required.", annotations: {label_en: "Prosthetics", label_de: "Prothesen", aliases_en: ["Prosthetic Limb", "Prosthesis"], aliases_de: ["Prothese"]}}
      daily_living_aids:    {description: "Grab rails, bath seats, reachers, adapted cutlery.", see_also: [pto:Assistive_technology], annotations: {label_en: "Daily Living Aids", label_de: "Hilfsmittel für den Alltag", aliases_en: ["Daily Living Aid", "Grab Rail", "Bath Seat", "Reacher", "Adapted Cutlery"], aliases_de: ["Hilfsmittel für den Alltag", "Haltegriff", "Badsitz", "Greifzange", "Angepasste Besteck"]}}
      communication_devices: {description: "AAC devices, talking clocks, large-button phones. Functional assessment required.", see_also: [pto:Augmentative_and_alternative_communication], annotations: {label_en: "Communication Devices", label_de: "Kommunikationshilfen", aliases_en: ["Communication Device", "AAC Device", "Talking Clock", "Large-button Phone"], aliases_de: ["Kommunikationshilfe", "AAC-Gerät", "Sprechende Uhr", "Telefon mit großen Tasten"]}}
      other:                {description: "Mobility aids and assistive devices not fitting above subcategories.", annotations: {label_en: "Other Mobility Aids", label_de: "Sonstige Mobilitätshilfen"}}