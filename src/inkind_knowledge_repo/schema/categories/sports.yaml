---
id: https://inkind-at.github.io/inkind-knowledge-repo/categories/sports
name: sports
title: Sports Equipment Category Schema
description: >-
  Defines SportsCategory mixin applied to SportsItem. COICOP Division 09.4.
  Bicycles are placed here by domain convention (COICOP assigns them to
  Division 07/Transport) since that's how social organisations actually
  sort and store them. Ontology grounding: Product Types Ontology
  (pto:Sporting_goods and per-subcategory IRIs).

  Dual-track assessment, enforced by SportsCategory rules based on
  subcategory: protective gear (helmets, pads, life jackets) uses
  SportsProtectiveAssessmentEnum — wear grade can't catch impact damage
  invisible under an intact shell, and assessment_result is required
  regardless of usage. Everything else uses condition_grade.

license: MIT
see_also:
  - http://www.productontology.org/id/Sporting_goods
  - https://unstats.un.org/unsd/classifications/Family/Detail/2094

prefixes:
  inkind_knowledge_repo: https://inkind-at.github.io/inkind-knowledge-repo/
  linkml: https://w3id.org/linkml/
  pto: http://www.productontology.org/id/

default_prefix: inkind_knowledge_repo
default_range: string

imports:
  - linkml:types
  - ./_base
  - ./_context_rules


classes:

  SportsCategory:
    mixin: true
    is_a: CategoryMixin
    description: >-
      Mixin for sports equipment slots and UC rules.
      Applied to SportsItem via mixins: [SportsCategory].
      condition_grade for general (non-protective-gear) subcategories lives
      here; assessment_result for protective_gear and its UC rules live on
      SportsProtectiveAssessmentMixin (below), so DemandSignal can dispatch
      to this bare mixin without that assessment content.
    see_also:
      - http://www.productontology.org/id/Sporting_goods
    slots:
      - subcategory
      - condition_grade
      - sport_type
      - demographic
      - is_set_complete
    slot_usage:
      subcategory:
        range: SportsSubcategoryEnum
        required: true
      condition_grade:
        range: UsedConditionGradeEnum
        required: false
        description: >-
          Wear grade for general sports equipment (non-protective-gear).
          Required when subcategory ≠ protective_gear.
      demographic:
        range: DemographicEnum
        required: false
        description: >-
          Age/gender demographic (from DemographicEnum in clothing.yaml).
          Optional — detailed completeness tier for sports equipment.
    annotations:
      completeness_minimal:  "subcategory"
      completeness_standard: "subcategory, condition_grade, usage"
      completeness_detailed: "subcategory, sport_type, demographic, condition_grade, is_set_complete, usage"
      coicop_division: "09.4"
      bicycle_note: >-
        Bicycles are in this category by domain convention.
        COICOP assigns bicycles to Division 07 (Transport).
      label_en: "Sports"
      label_de: "Sport"
      aliases_en: ["sports", "fitness"]
      aliases_de: ["Sport", "Fitness"]
    rules:
      - title: uc-sports-general-condition-grade-required
        description: General sports equipment requires condition_grade.
        preconditions:
          slot_conditions:
            subcategory:
              none_of:
                - equals_string: protective_gear
        postconditions:
          slot_conditions:
            condition_grade:
              required: true

      - title: uc-sports-general-poor-warn
        description: >-
          General sports equipment in poor condition requires confirmation.
          action: warn — sorting_notes required.
        preconditions:
          slot_conditions:
            subcategory:
              none_of:
                - equals_string: protective_gear
            condition_grade:
              equals_string: poor
        postconditions:
          slot_conditions:
            sorting_notes:
              required: true

  SportsProtectiveAssessmentMixin:
    mixin: true
    is_a: SportsCategory
    mixins: [SportsContextRulesMixin]
    description: >-
      Shared physical-item dispatch target for Sports — used identically by
      DonationItem, StorageCollection, and SortedCollection. Adds
      assessment_result (protective_gear only) and its UC rules on top of
      SportsCategory. Never used by DemandSignal.
    slots:
      - assessment_result
    slot_usage:
      assessment_result:
        range: SportsProtectiveAssessmentEnum
        required: false
        description: >-
          Structured safety assessment for protective_gear subcategory only.
          Required when subcategory = protective_gear; absent otherwise.
    annotations:
      protective_gear_standard: "subcategory, assessment_result, usage"
      coicop_division: "09.4"
    rules:
      - title: uc-sports-protective-gear-assessment-required
        description: >-
          Protective gear requires structured safety assessment regardless
          of usage — new protective gear can have manufacturing defects.
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: protective_gear
        postconditions:
          slot_conditions:
            assessment_result:
              required: true

      - title: uc-sports-protective-gear-unsafe-block
        description: >-
          Protective gear assessed as unsafe must not be redistributed.
          action: block.
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: protective_gear
            assessment_result:
              equals_string: unsafe_do_not_redistribute
        postconditions:
          slot_conditions:
            lifecycle_state:
              none_of:
                - equals_string: stored
                - equals_string: distributed

      - title: uc-sports-protective-gear-post-impact-warn
        description: >-
          Protective gear with unknown impact history requires confirmation.
          action: warn — sorting_notes required.
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: protective_gear
            assessment_result:
              equals_string: unknown_impact_history
        postconditions:
          slot_conditions:
            sorting_notes:
              required: true


slots:

  sport_type:
    range: string
    description: Sport or activity type (free text, e.g. "football", "cycling").


enums:

  SportsProtectiveAssessmentEnum:
    description: >-
      Structured safety assessment for protective gear (helmets, pads, life
      jackets, mouth guards). Structural damage may not be visually apparent
      after impact — a helmet that has absorbed an impact is unsafe even if
      it looks undamaged. Required regardless of usage.
    permissible_values:
      safe_to_redistribute:
        description: >-
          Visually and physically intact; all components present (straps, buckles,
          padding); no signs of impact damage; appropriate for redistribution.
          Appropriate for new items with no observed defects.
        annotations:
          label_en: "Safe to redistribute"
          label_de: "Zur Weitergabe geeignet"
      safe_cosmetic_wear_only:
        description: >-
          Minor cosmetic wear (scratches, scuffs) but structurally sound with
          no impact damage. Safe to redistribute.
        annotations:
          label_en: "Safe with cosmetic wear only"
          label_de: "Nur leichte Gebrauchsspuren"
      unknown_impact_history:
        description: >-
          No visible damage but impact history cannot be confirmed.
          action: warn — sorter must confirm; advise recipient that protective
          certification cannot be guaranteed.
        annotations:
          label_en: "Unknown impact history"
          label_de: "Mögliche Vorschäden unklar"
      visible_structural_damage:
        description: >-
          Cracks, dents, deformation, or compromised structural components.
          Must not be redistributed regardless of usage. action: block.
        annotations:
          label_en: "Visible structural damage"
          label_de: "Stark beschädigt"
      unsafe_do_not_redistribute:
        description: >-
          Definitively unsafe: confirmed post-impact, recalled model, expired
          certification, missing critical safety components.
          action: block — consider specialist recycling.
        annotations:
          label_en: "Unsafe — do not redistribute"
          label_de: "Ungeeignet zur Weitergabe"

  SportsSubcategoryEnum:
    description: Sports equipment subcategories. Grounded in Product Types Ontology.
    permissible_values:
      balls:             {description: "Footballs, basketballs, tennis balls, rugby balls.", annotations: {label_en: "Balls", label_de: "Bälle", aliases_en: ["balls", "football", "basketball", "tennis ball", "rugby ball"], aliases_de: ["Bälle", "Fußball", "Basketball", "Tennisball", "Rugbyball"]}}
      rackets_bats:      {description: "Tennis/badminton rackets, cricket bats, ping-pong bats.", see_also: [pto:Racket], annotations: {label_en: "Rackets and Bats", label_de: "Sportschläger", aliases_en: ["rackets and bats", "tennis racket", "badminton racket", "cricket bat", "ping-pong bat"], aliases_de: ["Schläger und Schläger", "Tennisschläger", "Badmintonschläger", "Krikettschläger", "Ping-Pong-Schläger"]}}
      protective_gear:   {description: "Helmets, shin pads, knee pads, life jackets. Structured assessment required.", see_also: [pto:Protective_gear], annotations: {label_en: "Protective Gear", label_de: "Schutzausrüstung", aliases_en: ["protective gear", "helmet", "shin pad", "knee pad", "life jacket"], aliases_de: ["Schutzausrüstung", "Helm", "Schienbeinschutz", "Kniepads", "Rettungsgürtel"]}}
      fitness_equipment: {description: "Weights, resistance bands, yoga mats, exercise machines.", see_also: [pto:Exercise_equipment], annotations: {label_en: "Fitness Equipment", label_de: "Fitnessgeräte", aliases_en: ["fitness equipment", "weights", "resistance band", "yoga mat", "exercise machine"], aliases_de: ["Fitnessgeräte", "Gewichte", "Widerstandsbänder", "Yogamatte", "Fitnessmaschine"]}}
      bicycles:          {description: "Bicycles and cycling accessories. Domain convention — COICOP 07 (Transport).", see_also: [pto:Bicycle], annotations: {label_en: "Bicycles & Cycling Equipment", label_de: "Fahrräder & Fahrradausrüstung", aliases_en: ["bicycles and cycling equipment", "bicycle", "cycling accessory"], aliases_de: ["Fahrräder und Fahrradausrüstung", "Fahrrad", "Fahrradausstattung"]}}
      water_sports:      {description: "Swimming goggles, snorkels, fins, wetsuits.", annotations: {label_en: "Water Sports Equipment", label_de: "Wassersportausrüstung", aliases_en: ["water sports equipment", "swimming goggles", "snorkel", "fins", "wetsuit"], aliases_de: ["Wassersportausrüstung", "Schwimmbrillen", "Snorkel", "Flossen", "Nassanzug"]}}
      winter_sports:     {description: "Skis, snowboards, ice skates, sleds.", see_also: [pto:Ski], annotations: {label_en: "Winter Sports Equipment", label_de: "Wintersportausrüstung"}}
      camping_outdoor:   {description: "Tents, sleeping bags, backpacks, hiking poles.", see_also: [pto:Camping], annotations: {label_en: "Camping & Outdoor Equipment", label_de: "Camping- & Outdoor-Ausrüstung"}}
      other:             {description: "Sports equipment not fitting above subcategories.", annotations: {label_en: "Other Sports Equipment", label_de: "Sonstige Sportausrüstung"}}