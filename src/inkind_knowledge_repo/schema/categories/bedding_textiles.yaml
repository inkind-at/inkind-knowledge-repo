---
id: https://inkind-at.github.io/inkind-knowledge-repo/categories/bedding_textiles
name: bedding_textiles
title: Bedding & Textiles Category Schema
description: >-
  Defines BeddingTextilesCategory mixin applied to BeddingTextilesItem.
  COICOP Division 05.2. UNHCR NFI Core Relief Standards list blankets and
  sleeping mats as core relief items at clothing's priority level — the
  primary justification for treating bedding as its own top-level category
  rather than folding it into HouseholdItem.

  Ontology grounding: Product Types Ontology (pto:Bedding and per-value
  IRIs), schema:material as fallback anchor.

  material (detailed tier) is used for allergen filtering (wool, down),
  winter-suitability hinting, and care-requirement matching.

  Uses BeddingAssessmentEnum (hygiene/condition) instead of condition_grade
  — hygiene state, not wear, is the redistribution signal (a worn but clean
  blanket is redistributable; a stained mattress is not). assessment_result
  required regardless of usage.

  is_winter_suitable (not the full SeasonEnum) captures thermal weight —
  meaningful for blankets/duvets/sleeping bags, suppressed by the fragment
  compiler for mattresses/towels/curtains/tablecloths. Sleeping bag thermal
  rating, if known, goes in sorting_notes as free text.

license: MIT
see_also:
  - http://www.productontology.org/id/Bedding
  - https://unstats.un.org/unsd/classifications/Family/Detail/2094
  - https://emergency.unhcr.org/emergency-assistance/core-relief-items/kind-non-food-item-distribution
  - https://schema.org/material

prefixes:
  inkind_knowledge_repo: https://inkind-at.github.io/inkind-knowledge-repo/
  linkml: https://w3id.org/linkml/
  pto: http://www.productontology.org/id/
  schema: http://schema.org/

default_prefix: inkind_knowledge_repo
default_range: string

imports:
  - linkml:types
  - ./_base
  - ./clothing   # imports is_winter_suitable slot definition
  - ./_context_rules


classes:

  BeddingTextilesCategory:
    mixin: true
    is_a: CategoryMixin
    description: >-
      Mixin for bedding and textiles slots and UC rules.
      Applied to BeddingTextilesItem via mixins: [BeddingTextilesCategory].
      assessment_result and its hygiene UC rules live on
      BeddingAssessmentMixin (below) so DemandSignal can dispatch to this
      bare mixin without assessment content that only applies to a physical
      item in hand.
    see_also:
      - http://www.productontology.org/id/Bedding
      - https://emergency.unhcr.org/emergency-assistance/core-relief-items/kind-non-food-item-distribution
    slots:
      - subcategory
      - material
      - is_set_complete
      - is_winter_suitable
    slot_usage:
      subcategory:
        range: BeddingTextilesSubcategoryEnum
        required: true
      material:
        range: BeddingMaterialEnum
        required: false
        description: >-
          Primary fibre or fabric composition. Optional — detailed
          completeness tier.
      is_winter_suitable:
        range: boolean
        required: false
        description: >-
          Whether this bedding item provides meaningful warmth for cold
          conditions. Required at standard completeness for blankets,
          duvets_quilts, and sleeping_bags; suppressed by the fragment
          compiler for towels, curtains, and tablecloths. Critical for
          sleeping bags — a summer bag issued in a cold-weather emergency
          is dangerous.
    annotations:
      completeness_minimal:  "subcategory"
      completeness_standard: "subcategory, is_set_complete, is_winter_suitable, usage"
      completeness_detailed: "subcategory, material, is_set_complete, is_winter_suitable, usage"
      material_winter_hint: >-
        Fragment compiler may pre-fill is_winter_suitable=true when
        material in [wool, fleece, down_feather] and is_winter_suitable=false
        when material in [linen, silk]. Sorter always overrides.
      coicop_division: "05.2"
      unhcr_nfi_category: "household_items"
      winter_suitable_subcategories: "blankets, duvets_quilts, pillows, mattresses, sleeping_bags, bedsheets"
      winter_suppress_subcategories: "towels, curtains_blinds, tablecloths_napkins"
      label_en: "Home textiles"
      label_de: "Heimtextilien"
      aliases_en: ["bedding", "textiles"]
      aliases_de: ["Bettwäsche", "Textilien"]
    rules:
      - title: uc-bedding-sleeping-bag-winter-required
        description: >-
          Sleeping bags require is_winter_suitable to be explicitly set.
          A summer sleeping bag issued in a cold-weather emergency is a
          genuine safety risk. Sorters must assess the thermal rating.
          action: warn — is_winter_suitable must be set at sorted state.
        preconditions:
          slot_conditions:
            subcategory:
              equals_string: sleeping_bags
        postconditions:
          slot_conditions:
            is_winter_suitable:
              required: true

  BeddingAssessmentMixin:
    mixin: true
    is_a: BeddingTextilesCategory
    mixins: [BeddingContextRulesMixin]
    description: >-
      Shared physical-item dispatch target for Bedding and Textiles — used
      identically by DonationItem, StorageCollection, and SortedCollection.
      Adds assessment_result and its UC rules on top of
      BeddingTextilesCategory. Never used by DemandSignal.
    slots:
      - assessment_result
    slot_usage:
      assessment_result:
        range: BeddingAssessmentEnum
        required: false
        description: Hygiene and condition assessment. Required regardless of usage.
    annotations:
      completeness_minimal:  "subcategory, assessment_result"
      completeness_standard: "subcategory, is_set_complete, assessment_result, is_winter_suitable, usage"
      completeness_detailed: "subcategory, material, is_set_complete, assessment_result, is_winter_suitable, usage"
      coicop_division: "05.2"
    rules:
      - title: uc-bedding-hygiene-concern-block
        description: >-
          Items with hygiene concerns must not be redistributed. Covers mattress
          staining, infestation signs, biological contamination, and packaging
          damage on new items. Applies regardless of usage.
          action: block, suggest: disposal.
        preconditions:
          slot_conditions:
            assessment_result:
              equals_string: hygiene_concern
        postconditions:
          slot_conditions:
            lifecycle_state:
              none_of:
                - equals_string: stored
                - equals_string: distributed

      - title: uc-bedding-not-washed-warn
        description: >-
          Used items where laundering is unconfirmed require sorter confirmation.
          action: warn — sorting_notes required.
        preconditions:
          slot_conditions:
            assessment_result:
              equals_string: used_not_confirmed_washed
        postconditions:
          slot_conditions:
            sorting_notes:
              required: true

      - title: uc-bedding-stained-warn
        description: >-
          Visibly stained items require sorter confirmation.
          action: warn — sorting_notes required.
        preconditions:
          slot_conditions:
            assessment_result:
              equals_string: clean_with_visible_staining
        postconditions:
          slot_conditions:
            sorting_notes:
              required: true


enums:

  BeddingMaterialEnum:
    description: >-
      Primary fibre or fabric composition of a bedding or textile item.
      Records the dominant fibre; use synthetic_blend when no single
      synthetic dominates. Grounded in Product Types Ontology (pto:),
      aligned with ClothingMaterialEnum's natural-fibre values for
      consistency. Used for allergen filtering, winter-suitability hinting
      (winter_hint annotation per value), and care-requirement matching.
    see_also:
      - schema:material
    permissible_values:
      cotton:
        description: >-
          Cotton or cotton-dominant. The most common natural fibre for
          sheets, pillowcases, and towels. All-season versatile; thermal
          weight varies by thread count and weave.
        see_also: [pto:Cotton]
        annotations:
          label_en: "Cotton"
          label_de: "Baumwolle"
      polyester:
        description: >-
          Polyester or polyester-dominant synthetic. Common in budget
          blankets, pillows, and duvet covers. All-season; easy-care.
        see_also: [pto:Polyester]
        annotations:
          label_en: "Polyester"
          label_de: "Polyester"
      wool:
        description: >-
          Wool, merino, or wool-dominant blend. Primary signal of winter
          suitability in blankets and duvets. Fragment compiler may pre-fill
          is_winter_suitable=true. Allergen signal for wool-sensitive beneficiaries.
        see_also: [pto:Wool]
        annotations:
          label_en: "Wool"
          label_de: "Wolle"
          winter_hint: "true"
      linen:
        description: >-
          Linen (flax) fabric. Lightweight and breathable. Typical for
          summer-weight sheets and tablecloths. Fragment compiler may
          pre-fill is_winter_suitable=false.
        see_also: [pto:Linen]
        annotations:
          label_en: "Linen"
          label_de: "Leinen"
          winter_hint: "false"
      fleece:
        description: >-
          Polar fleece or other synthetic-pile fabric. Common in lightweight
          throws and entry-level blankets. Warm for its weight. Fragment
          compiler may pre-fill is_winter_suitable=true.
        see_also: [pto:Polar_fleece]
        annotations:
          label_en: "Fleece"
          label_de: "Fleece"
          winter_hint: "true"
      down_feather:
        description: >-
          Down-filled or feather-filled duvets and pillows. Classic
          winter-weight fill. Fragment compiler may pre-fill
          is_winter_suitable=true. Allergen signal for feather/down allergy
          and asthma sufferers. Requires low-heat tumble drying.
        see_also: [pto:Down_feather]
        annotations:
          label_en: "Down / Feathers"
          label_de: "Daunen / Federn"
          winter_hint: "true"
      silk:
        description: >-
          Silk. Lightweight and temperature-regulating. Common in premium
          bedding sets. Requires dry-clean or specialist gentle wash.
          Fragment compiler may pre-fill is_winter_suitable=false.
        see_also: [pto:Silk]
        annotations:
          label_en: "Silk"
          label_de: "Seide"
          winter_hint: "false"
      microfibre:
        description: >-
          Microfibre (ultra-fine synthetic) fabric. Common in microfibre
          towels, soft sheets, and lightweight blankets. Quick-drying
          and easy-care.
        see_also: [schema:material]
        annotations:
          label_en: "Microfibre"
          label_de: "Mikrofaser"
      synthetic_blend:
        description: >-
          Mixed synthetic fibres or a synthetic + natural blend where no
          single fibre dominates. Covers polyester/cotton blends (polycotton),
          acrylic blends, and other mixed compositions.
        see_also: [schema:material]
        annotations:
          label_en: "Mixed fibres"
          label_de: "Mischgewebe"
      other:
        description: >-
          Materials not covered above. Record the specific material in
          sorting_notes when known.
        see_also: [schema:material]
        annotations:
          label_en: "Other"
          label_de: "Andere"

  BeddingAssessmentEnum:
    description: >-
      Structured hygiene and condition assessment for bedding and textiles.
      Replaces former boolean slots has_been_washed and is_mattress_hygienic.
      Required at sorting regardless of usage.
    permissible_values:
      clean_unused:
        description: >-
          Clearly unused/new with original packaging intact or no signs of
          previous use. No hygiene concerns.
        annotations:
          label_en: "Clean & unused"
          label_de: "Sauber & unbenutzt"
      clean_washed:
        description: >-
          Previously used but confirmed laundered and clean. No staining,
          odour, or hygiene concerns. Fully redistributable.
        annotations:
          label_en: "Clean & washed"
          label_de: "Sauber & gewaschen"
      clean_with_visible_staining:
        description: >-
          Clean and odour-free but with visible staining. Structurally sound.
          action: warn — sorting_notes required.
        annotations:
          label_en: "Clean, visible stains"
          label_de: "Sauber, sichtbare Flecken"
      used_not_confirmed_washed:
        description: >-
          Used item where laundering cannot be confirmed.
          action: warn — sorting_notes required.
        annotations:
          label_en: "Used, washing status unknown"
          label_de: "Gebraucht, unklar, ob gewaschen"
      hygiene_concern:
        description: >-
          Visible contamination, significant staining, odour, infestation,
          or other hygiene issue. Redistribution unsafe.
          action: block, suggest: disposal.
        annotations:
          label_en: "Hygiene concern"
          label_de: "Hygienisch bedenklich"

  BeddingTextilesSubcategoryEnum:
    description: >-
      Bedding and household textiles subcategories. Aligned with COICOP 05.2.
      is_winter_suitable is meaningful for the first five subcategories;
      suppressed by the fragment compiler for the last three.
    permissible_values:
      blankets:
        description: >-
          Blankets, throws, fleece covers. UNHCR NFI core relief item.
          is_winter_suitable required — a fleece blanket and a cotton
          throw serve very different needs in cold-weather distribution.
        see_also: [pto:Blanket]
        annotations:
          label_en: "Blankets"
          label_de: "Decken"
          aliases_en: ["blanket", "throw", "fleece cover"]
          aliases_de: ["Decke", "Wurfdecke", "Fleecedecke"]
      duvets_quilts:
        description: >-
          Duvets, quilts, continental quilts. is_winter_suitable required —
          tog rating (if legible) may be noted in sorting_notes.
        see_also: [pto:Duvet]
        annotations:
          label_en: "Duvets & quilts"
          label_de: "Bettdecken & Steppdecken"
          aliases_en: ["duvet", "quilt", "continental quilt"]
          aliases_de: ["Bettdecke", "Steppdecke", "Kontinentaldecke"]
      pillows:
        description: Pillows and sleeping cushions.
        see_also: [pto:Pillow]
        annotations:
          label_en: "Pillows"
          label_de: "Kissen"
          aliases_en: ["pillow", "cushion", "sleeping cushion"]
          aliases_de: ["Kissen", "Sitzkissen", "Schlafkissen"]
      mattresses:
        description: >-
          Single, double, children's mattresses. Hygiene UC applies.
          is_winter_suitable typically not meaningful — suppressed in UI.
        see_also: [pto:Mattress]
        annotations:
          label_en: "Mattresses"
          label_de: "Matratzen"
          aliases_en: ["mattress", "mat", "sleeping mat"]
          aliases_de: ["Matratze", "Matte", "Schlafmatte"]
      sleeping_bags:
        description: >-
          Adult and general sleeping bags and camping bedding.
          UNHCR NFI core relief item.
          is_winter_suitable required and UC-enforced — a summer sleeping
          bag in cold-weather emergency distribution is a safety risk.
          Thermal rating (e.g. "3-season", "-10°C comfort limit") may
          be noted in sorting_notes.
          IMPORTANT: Baby sleeping bags (0-24 months) → BabyInfantItem
          (subcategory: sleeping_bags). EN 16781:2018 applies — neck and
          armhole safety assessment required. Do not sort into this category.
        see_also: [pto:Sleeping_bag]
        annotations:
          label_en: "Sleeping bags"
          label_de: "Schlafsäcke"
          aliases_en: ["sleeping bag", "camping bedding"]
          aliases_de: ["Schlafsack", "Camping-Bettwäsche"]
      bedsheets:
        description: Fitted sheets, flat sheets, pillowcases, duvet covers.
        annotations:
          label_en: "Bedsheets"
          label_de: "Bettlaken & Leintücher"
          aliases_en: ["bedsheet", "fitted sheet", "flat sheet"]
          aliases_de: ["Bettlaken", "Leintücher", "Flachbettwäsche", "Spannbettlaken"]
      towels:
        description: >-
          Bath, hand, face, beach towels. is_winter_suitable not meaningful
          — suppressed by fragment compiler.
        see_also: [pto:Towel]
        annotations:
          label_en: "Towels"
          label_de: "Handtücher"
          aliases_en: ["towel", "bath towel", "hand towel"]
          aliases_de: ["Handtuch", "Badehandtuch", "Handtücher"]
      curtains_blinds:
        description: >-
          Curtains, net curtains, roller blinds. is_winter_suitable not
          meaningful at item level — suppressed by fragment compiler.
        see_also: [pto:Curtain]
        annotations:
          label_en: "Curtains & blinds"
          label_de: "Vorhänge & Sichtschutz"
          aliases_en: ["curtain", "net curtain", "roller blind"]
          aliases_de: ["Vorhang", "Nettovorhang", "Rolljalousie", "Sichtschutz"]
      tablecloths_napkins:
        description: Tablecloths, placemats, cloth napkins. Seasonal not applicable.
        annotations:
          label_en: "Tablecloths & napkins"
          label_de: "Tischdecken & Servietten"
          aliases_en: ["tablecloth", "placemat", "cloth napkin"]
          aliases_de: ["Tischdecke", "Platzset", "Stoffserviette"]
      other:
        description: Household textiles not fitting above subcategories.
        annotations:
          label_en: "Other"
          label_de: "Sonstige"
